schema_version: 1

lesson:
  number: 25
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et la parole"
  language: fr

points_principaux:
  - "Dans le domaine de la SIC, la parole joue un double rôle: donner et acquérir la connaissance."
  - "Le domaine fondamental de la parole, c'est le champ vivant, illimité de l'IC."
  - "Le but de la parole consiste à lier l'illimité - la parole exprime l'illimité au moyen de ses propres limites."
  - "La parole représente la base de toutes les branches d'apprentissage; c'est dans les vagues de la parole que l'océan de la connaissance s'élève, se meut et trouve sa plénitude."
  - "La SIC déploie toutes les gloires de la parole, manifestée et non-manifestée."

resume_long:
  - "La parole joue un rôle vital et fondamental dans l'enseignement et l'apprentissage; donner et acquérir la connaissance, voilà deux fonctions qui ont pour fondement la parole. La parole est l'expression de la conscience. La conscience de l'enseignant que le courant de connaissance s'écoule. Puisque la parole constitue le facteur fondamental dans ce courant de connaissance qui va de l'enseignant à l'étudiant, elle constitue aussi la base fondamentale sur laquelle la connaissance de la SIC est donnée et reçue. Nous devons prendre en considération le domaine de la parole dans toute investigation systématique des différentes avenues de l'IC."
  - "La parole est l'expression du champ silencieux, non-manifesté, de la pure intelligence. À partir de ce champ silencieux, elle s'écoule et se développe dans le champ exprimé de l'IC, jusqu'à réaliser son intention et atteindre son but - donner une expression vivante au champ supposément muet de l'illimité. Dans le domaine transcendantal, infini de la vie, la parole est sans voix. Cette situation n'est pas très agréable pour la parole, puisqu'elle désire se réjouir en amenant à l'intérieur de ses propres limites l'aspect vivant de l'illimité. La parole atteint son but quand la pleine valeur de l'Absolu infini, éternel, illimité danse dans ses impulsions."
  - "Le quatrième état de conscience laisse la parole sans voix à la porte de l'infini, Lorsque notre conscience s'ouvre au champ illimité de IC, la pensée se tranquillise, et la parole, solennellement inspirée devient muette, parole transcendantale à la source de la pensée. Dans cet état, la parole veut danser et jouer dans cet illimité. Ce désir naturel de la parole trouve sa plénitude quand l'illimité est établi de façon permanente au plan de notre conscience. Dans les états plus élevés de conscience, la parole devient capable d'englober la valeur illimitée, au-delà de la compréhension, infinie de l'IC; elle est capable de chanter la gloire de l'illimité infini."
  - "Le Rig Veda chante la gloire de la valeur suprême de la parole en disant: « c'est la puissance de la parole qui est capable de lier l'illimité ». L'illimité infini, étant devenu réalité permanente au niveau de notre conscience, est saisi dans une cognition directe par l'instrument de la parole. La parole du professeur révèle et structure la valeur vivante de l'infini dans le coeur de l'étudiant."
  - "La parole est capable de mouvoir l'Immuable. Reconnaissant ce fait, la SIC met à disposition méthodes et connaissance afin de nous familiariser avec l'étendue tout entière du langage, de sa valeur la plus fine à la plus exprimée, ceci en ouvrant notre conscience au champ non-manifesté de la parole, à la source de la pensée. Lorsque, grâce à l'expérience directe de ce domaine transcendantal, l'esprit acquiert la capacité de saisir à la fois les limites de la parole et sa valeur sans parole, non-manifestée, illimitée, l'enseignement de la SIC savoure le succès. Telle est la plénitude de la parole, telle est la plénitude de l'apprentissage."
  - "Toutes les disciplines s'enseignent sur la base du langage, le langage sur la base de la grammaire, et la grammaire sur la base du son jaillissant hors de la bouche en tant que parole. Tout enseignement, tout apprentissage ont leur base au niveau verbal de la parole. La SIC révèle un plan plus fondamental que le niveau verbal; elle ouvre notre conscience au pur champ de l'IC, à la source de la pensée, laquelle constitue l'origine de tout langage, la base sur laquelle toutes les disciplines sont enseignées et apprises. En révélant le champ non-manifesté de la parole à la source de la pensée, la SIC offre à l'éducation une base solide et immuable. À partir de cette racine de toute connaissance - la source de la pensée - la SIC peut apporter son soutien à toutes les branches d'apprentissage."
  - "Pour que le champ de la parole amène à expression l'entièreté de la connaissance (de sorte que la totalité de la vie puisse devenir une réalité vivante pour chacun), il est nécessaire que la parole soit bien fondée sur sa valeur non-manifestée, éternelle, illimitée, à la source de la pensée.\n\nLa parole, ancrée dans sa propre source illimitée, est profonde, hardie et forte, capable de donner la valeur illimitée de la connaissance à toute branche d'apprentissage."
  - "Les capacités de la parole sont merveilleuses. Elle peut saisir la valeur illimitée, infinie de la vie et la faire danser sur ses doigts. C'est pourquoi la SIC part de l'expérience directe de la valeur sans parole, transcendantale, de la parole, et couvre l'étendue tout entière de la pensée, de telle façon que chaque impulsion de pensée soit spontanément juste, harmonieuse, source de progrès et de plénitude.\n\nSur une telle base, la parole est profonde, tout-englobante, facteur de progrès et satisfaisante. Lorsque l'étendue entière de la parole se vivifie au plan de notre conscience, alors l'étendue entière de la connaissance devient elle-même vivante au plan de notre conscience."
  - "En insistant sur la nécessité de vivifier le niveau fondamental, non-manifesté de la parole, la SIC ne dénie en rien l'importance des autres niveaux, tels que le langage parlé, la grammaire et la littérature. Ces niveaux de la parole ont aussi leur valeur: cependant, ils doivent être soutenus par le niveau le plus fondamental de la parole, parce que toute activité est structurée dans l'entière étendue de la parole."
  - "L'étendue tout entière de la création est la parole du créateur. La SIC rend pleinement justice au champ de la parole en déployant toutes ses gloires, finies et infinies, et en les vivifiant dans le domaine pratique de la vie quotidienne. Comme la SIC et la parole sont intimement liées, on peut dire que la science de la parole, c'est-à-dire l'étude systématique de la nature, du développement, de l'étendue et de l'application de la parole n'est rien d'autre que la SIC elle-même."

questions:
  - question: "Quel est le lien entre la parole et la connaissance ”?"
    answer: "Les deux fonctions, donner et acquérir la connaissance, ont leur base dans la parole."
  - question: "Quel est le but de toute expression?"
    answer: "Le but de toute expression est la capacité d'exprimer l'infinité."
  - question: "Dans quels états de conscience la parole est-elle capable de saisir la valeur incompréhensible (au-delà de la compréhension), illimitée, infinie de IC?"
    answer: "Dans les cinquième, sixième et septième états de conscience. L'expression de l'infini illimité ne peut se faire qu'à partir du niveau illimité de la conscience. Ceci est une réalité permanente des cinquième, sixième et septième états de conscience. Par conséquent, il est évident que, dans ces trois états, la parole est capable de donner expression à l'infini, l'incompréhensible, l'illimité."
  - question: "Que dit le Rig Veda de la puissance de la parole?"
    answer: "Le Rig Veda chante la gloire de la parole dans sa valeur suprême et dit: « C'est la puissance de la parole qui peut lier l'illimité »."
  - question: "Quel message pratique apporte la SIC dans le domaine de la parole ”?"
    answer: "C'est de savoir comment ouvrir notre conscience à tous les domaines de la parole, du plus fin au plus grossier, et comment rendre le champ transcendantal muet vivant dans les limites mêmes de la parole."
  - question: "Que nous a révélé la SIC en ce qui concerne les niveaux plus subtils de la parole?"
    answer: "La SIC nous révèle qu'il existe des domaines de la parole plus fondamentaux que son expression au niveau verbal: le niveau de la grammaire, celui de l'alphabet, et le niveau transcendantal."
  - question: "Comment l'étendue tout entière de la parole s'ouvre-t-elle à nous grâce à la SIC?"
    answer: "La SIC part de l'expérience directe de la valeur transcendantale, muette, immuable de la parole, et couvre l'étendue entière de la pensée, de sorte que chaque impulsion de pensée soit spontanément juste, harmonieuse, source de progrès et de plénitude."
  - question: "Quand la parole atteint-elle son but?"
    answer: "Lorsque la pleine valeur de l'éternité infinie, illimitée, absolue, danse dans ses impulsions."
  - question: "Que peut-on dire de la parole d'un homme éduqué?"
    answer: "Un homme éduqué est celui dont la parole se fonde sur sa valeur éternelle à la source de la pensée."
  - question: "En quoi la SIC rend-elle justice à la parole?"
    answer: "En déployant toutes ses gloires, finies dans la vie quotidienne."

place_de_la_lecon:
  - "La communication entre individus est vitale, en vue du progrès et de l'accomplissement. Pour que les nations et le monde entier puissent partager la plénitude et l'accomplissement, il est essentiel que nous fassions l'expérience de niveaux raffinés du langage, lesquels renforcent notre capacité à penser et agir. Cet aspect silencieux, transcendantal de l'IC nous permet de donner expression à l'illimité à l'intérieur même des limites, exprimer l'entière étendue du langage, de sa valeur la plus fine à la plus exprimée dans la vie cosmique."
  - "La parole apparaît fondamentale pour donner comme pour acquérir la connaissance; elle est la base de toutes les branches du savoir. Cette leçon nous permet de comprendre que la SIC déploie toutes les gloires de la parole, manifestées et non-manifestées, les rend vivantes dans l'activité quotidienne et fournit un fondement solide à toutes les branches d'étude."
