schema_version: 1

lesson:
  number: 19
  course: "Science de l'Intelligence Créatrice"
  title: "La nature de l'esprit telle que révélée par la pratique de la Science de l'Intelligence Créatrice"
  language: fr

points_principaux:
  - "L'esprit est à la fois une expression de l'Intelligence Créatrice et un organe d'expression de l'Intelligence Créatrice."
  - "L'esprit englobe la totalité de l'étendue de l'expression de l'Intelligence Créatrice: les sens, le mental, les émotions, l'égo, et la réalité universelle."
  - "L'esprit est infiniment flexible. Il inclut la co-existence des opposées:\n- les limites et l'illimité\n- le fini et l'infini\n- le silence et l'activité\nL'esprit peut faire l'expérience de la totalité de l'étendue de l'Intelligence Créatrice, du non-manifesté aux confins ultimes de la vie cosmique."
  - "La nature de l'esprit est indescriptible. On peut cependant en vivre la pleine valeur par la pratique dela Science de l'Intelligence Créatrice."

resume_long:
  - "La pratique de la SIC révèle la nature de l'esprit. Dans un premier ' temps, elle clarifie la pensée, la rend plus précise, plus englobante. L'esprit devient capable de prendre des décisions plus justes et plus efficaces, qui sont soutenues davantage par l'environnement."
  - "Le corps est l'organe “grossier” de l'Intelligence Créatrice. A travers le corps, l'Intelligence Créatrice agit. L'esprit est l'organe subtil de l'Intelligence Créatrice. À travers l'esprit, l'Intelligence Créatrice pense et planifie."
  - "L'esprit est l'organe premier à travers lequel l'Intelligence Créatrice s'exprime. L'esprit est à la fois “expression” de l'Intelligence Créatrice et “organe” à travers lequel l'Intelligence Créatrice s'exprime dans le champ de l'activité. Les sens sont la projection de l'esprit et sont également des organes à travers lesquels l'esprit s'exprime. Ainsi l'Intelligence Créatrice s'exprime en différentes couches, imbriquées les unes dans les autres: l'esprit, les sens et toute la diversité de la création qui sert d'objet au sens."
  - "Au sein de l'esprit pensant se trouve le domaine délicat des sentiments. Profondément imbriqué dans ce domaine délicat des sentiments, se trouve le sentiment du “mien”, le niveau du “Je”. Encore plus subtil que ce niveau du “Je”, se trouve la valeur quasi-abstraite de l'existence et de l'intelligence individuelles ou “Jeïté”. Profondément imbriquée au sein de la “Jeïté”, réside la réalité éternelle, non-changeante, non-manifestée, illimitée."
  - "Quel est l'intérêt de cette connaissance? Grâce aux possibilités du système nerveux, il est possible d'accéder à une expérience universelle de cette réalité illimitée. Dans cet état d'être, la valeur illimitée et infinie de l'existence et de l'intelligence imprègne complètement les différentes expressions de l'Intelligence Créatrice - les sens, l'esprit, le sentiment, l'égo individuel. L'aspect le plus délicat, le plus flexible et le plus invincible de l'Intelligence Créatrice devient alors une réalité vivante."
  - "La MT permet de faire l'expérience de la valeur infinie, illimitée, universelle de la vie à la source de la pensée. Cette expérience imprègne progressivement les sens, l'esprit, les émotions, et l'égo de valeurs plus pleines de la vie, et aboutit à de plus grandes réalisations dans la vie et à une plus grande plénitude."
  - "Cet enrichissement de tous les aspects de la vie induit par la pratique de la MT, révèle l'étendue de la nature de l'esprit. L'esprit est l'expression de l'Intelligence Créatrice. En tant que tel, il est structuré en couches de différentes valeurs, dont il est possible de faire l'expérience. L “esprit” englobe ainsi toute la gamme des expressions de l'Intelligence Créatrice, depuis la réalité éternelle, illimitée, universelle, jusqu'au sens en passant par l'égo individuel, les émotions, et le mental."
  - "Lorsque l'esprit perd ses limitations, grâce à la pratique de la MT, tous les domaines de la vie s'améliorent. L'esprit devient plus précis, plus vaste, capable d'une plus grande appréciation et d'une plus grande compréhension des choses. Ces aptitudes montrent la flexibilité infinie de l'esprit humain: il peut aussi bien se localiser à l'intérieur de limites extrêmement étroites et rigides, que s'élargir jusqu'à vivre l'immense variété de la création et sa valeur infinie. Mieux encore, il peut créer un état dans lequel son caractère illimité est maintenu alors même qu'il est engagé dans l'expérience des limites et de la diversité de la création."
  - "Lorsque nous percevons des états plus fins du mantra, les limites de celui-ci s'estompent et l'esprit vit une liberté croissante. Lorsque l'esprit transcende l'état le plus fin du mantra, il accède à une liberté illimitée. Cette expérience révèle un autre aspect de la nature de l'esprit: son aptitude à faire l'expérience de sa propre valeur infinie,\n\nnon manifestée, hors de toute évaluation."
  - "Lorsque l'esprit sort de l'expérience de sa propre valeur infinie et s'immerge dans l'expérience du monde extérieur, il se ressent comme plus éveillé, plus efficace, plus évolué et plus précis. En conséquence, il rencontre davantage de réussite et de bonheur."
  - "Par l'expérience de sa nature illimitée, l'esprit devient capable d'embrasser la coexistence de ses valeurs opposées - l'activité et le silence, les limites et l'illimité, le fini et l'infini. Telle est la nature\n\nessentielle de l'esprit: une flexibilité infinie, qui peut embrasser la totalité de la vie, depuis les limites minuscules jusqu'à l'infini illimité."
  - "Grâce à la pratique de la MT, l'esprit est capable non seulement d'embrasser sa propre nature essentielle, mais de l'actualiser dans la vie quotidienne. La MT est ainsi un procédé grâce auquel l'esprit développe son plein potentiel et apprend à vivre la totalité du potentiel de la vie."
  - "L'esprit est cet organe de l'Intelligence Créatrice qui est capable de percevoir la totalité de l'étendue de l'Intelligence Créatrice dans ses deux directions: celle des aspects subtils d'expression jusqu'à la valeur fondamentale non-manifestée, et celle des valeurs de plus en plus manifestées jusqu'à la limite ultime de la vie cosmique."
  - "Grâce à la pratique de la MT, l'esprit s'ouvre à l'illimité, puis aux limites. L'alternance entre l'expérience de l'illimité et des limites rend l'esprit plus flexible. Le méditant devient ainsi plus tolérant et accepte mieux ce qu'il est."
  - "L'expérience de l'éveil au repos traduit la capacité de l'esprit à embrasser les valeurs opposées - l'activité et le silence. Toute la création est l'expression de ces oppositions. Ainsi lorsque l'esprit devient capable d'embrasser la coexistence des opposés, il vit l'étendue totale de la vie. Cette expérience apporte la joie et la plénitude de soi."
  - "Ainsi l'esprit est cet organe subtil, infiniment flexible, qui possède simultanément dans sa structure les valeurs illimitées et limitées de l'Intelligence Créatrice. La nature de l'esprit est indescriptible car les mots, qui ont des limites, ne peuvent en exprimer toute la valeur."
  - "Malgré cette impuissance de la parole à décrire la nature de l'esprit, on peut en vivre la pleine valeur, grâce à la pratique de la SIC. Telle est la gloire de la pratique. Elle montre que la nature de l'esprit, bien qu'indescriptible par le langage, peut être vécue dans toutes les dimensions de la vie pratique. Dans le domaine muet mais pratique de l'existence et de l'intelligence, la nature réelle de l'esprit peut être pleinement déployée et vécue."

questions:
  - question: "Citer deux organes de l'Intelligence Créatrice et décrivez comment l'IC fonctionne à travers eux?"
    answer: "L'esprit est l'organe subtil de l'Intelligence Créatrice. Le corps en est l'organe grossier. L'Intelligence Créatrice œuvre à travers le corps pour accomplir l'action, à travers l'esprit pour penser et planifier l'action. Les sens de perception sont les organes à travers lesquels l'esprit expérimente le domaine extérieur de la vie."
  - question: "Dans la profondeur de l'esprit se trouve le niveau du sentiment. Dans la profondeur du sentiment se trouve la Jeïté. Qu'est-ce qui réside au plus profond de la Jeïté individuelle?"
    answer: "Cela qui est illimité, la réalité illimitée non-manifestée, non-changeante, immortelle, éternelle."
  - question: "A quel niveau d'expérience est-on apte à apprécier les valeurs de l'Intelligence Créatrice?"
    answer: "Les valeurs de l'Intelligence Créatrice s'apprécient à tous les niveau d'expérience."
  - question: "Quel lien y a-t-il entre l'esprit et l'Intelligence Créatrice?"
    answer: "L'esprit est l'expression de l'Intelligence Créatrice. Il est capable d'expérimenter les différentes couches de lui-même en tant qu'expressions de l'Intelligence Créatrice."
  - question: "Comment est-il possible d'améliorer la qualité des différentes couches d'expression de l'Intelligence Créatrice?"
    answer: "Par l'expérience de la pure nature de l'Intelligence Créatrice, grâce à la MT."
  - question: "Quelle est l'étendue de la flexibilité de l'esprit?"
    answer: "L'esprit est infiniment flexible"
  - question: "Quelles sont les trois situations extrêmes qui démontrent l'amplitude de la flexibilité de l'esprit?"
    answer: "L'esprit peut se confiner à l'intérieur de limites. Il peut embrasser l'infini, la valeur illimitée de la création. Il peut également maintenir la coexistence de ces deux expériences."
  - question: "Qu'est-ce qui permet à l'esprit de progresser vers une flexibilité maximum?"
    answer: "Le fait d'ouvrir alternativement la conscience aux limites et à l'illimité."
  - question: "Quels résultats ce progrès entraîne-t-il sur le plan du comportement?"
    answer: "Le méditant accepte mieux ce qu'il est et devient plus tolérant. L'épanouissement de valeurs opposées dans l'esprit élargit l'horizon de la vie et apporte en conséquence plus de joie."
  - question: "Comment peut-on connaître la nature de l'esprit, puisqu'elle est indescriptible?"
    answer: "Par la pratique de la SIC, qui révèle la nature de l'esprit en tant que réalité pratique et vivante."

place_de_la_lecon:
  - "Cette leçon peut être considérée comme le sommet de ce cour. Elle souligne à quel point la valeur infinie de l'Intelligence Créatrice est à la porté de chaque homme. Toutes les qualités de l'Intelligence Créatrice sont présentes à l'intérieur de l'esprit humain. La pleine valeur de l'Intelligence Créatrice est intrinsèque à la nature même de la vie. Puisse cette connaissance inspirer chaque homme à intégrer rapidement la totalité de la vie au niveau de son esprit conscient."
  - "Cette leçon exprime l'expérience la plus intime de la méditation. La croissance de l'Intelligence Créatrice est si naturelle qu'aucune étape de son développement ne sera jamais ressentie comme surprenante. Cela est dû au fait que la nature même de l'esprit contient toute l'étendue de l'Intelligence Créatrice. L'homme évolue jusqu'à développer son plein potentiel, un état où il jouit naturellement de la totalité de la vie et d'une suprême plénitude."
  - "Lorsqu'un homme pleinement développé regarde son environnement, il perçoit une création multiple subtilement élargie. Une telle expérience pourrait le désorienter, si une grande stabilité ne se développait pas simultanément à mesure que l'esprit se tourne vers la profondeur de lui-même, où réside la valeur illimitée, universelle de la réalité. Cette connaissance de la nature réelle de l'esprit permet de chasser les doutes et d'apaiser les tensions de la quête. Cette leçon chante la gloire du cours tout entier."
