schema_version: 1

lesson:
  number: 30
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et le rôle du professeur"
  language: fr

points_principaux:
  - "Le professeur de SIC est:\n- un exposant de la pleine valeur de la vie\n- un exemple vivant de la connaissance qu'il répand"
  - "Ayant sa propre conscience ouverte à la pure conscience, demeure de toutes les qualités de l'IC, le professeur de SIC est la source-mère de toute connaissance. Il vivifie chaque domaine d'étude et conduit au but de toute connaissance: la vie vécue dans une plénitude grandissante."
  - "Il est celui qui possède et qui donne le plus grand purificateur jamais connu la capacité de contacter le pur champ de l'IC - lequel élimine les obstacles au plein épanouissement de la vie et structure la plénitude dans toutes les phases de la vie."
  - "Le professeur de SIC est le connaisseur et le diffuseur de la connaissance suprême."
  - "Le professeur de SIC est un professeur de l'âge technologique. Il parle te langage de son temps. Il enseigne une science rendue pratique par une technique."
  - "Le professeur de SIC régénère l'humanité jusqu'à la plénitude de la vie."

resume_long:
  - "Le professeur de SIC a le rôle d'un voyant; non seulement il voit, mais il vient dire ce qu'il voit. Il est le connaisseur et l'exposant de la pleine valeur de la vie. Il est capable de donner à ses étudiants et la compréhension intellectuelle et l'expérience directe de la valeur illimitée de la vie. Grâce à une technique simple et naturelle, il les rend capables de connaître et d'apprécier la valeur illimitée de la vie et d'exprimer spontanément sa pleine valeur en toute pensée et toute action."
  - "Le professeur de SIC est le plus profond et celui qui a le plus de succès, parce qu'il enseigne non seulement par des paroles mais encore par son propre exemple. Il est la concrétisation vivante du message qu'il répand. Grâce à sa propre expérience du champ pur, non manifesté de l'IC, il irradie l'IC dans ses pensées, ses paroles et ses actions. Il est un exemple vivant des deux étapes du progrès: repos et activité. Les pauses de son discours exhibent la valeur du repos, et l'expression de son discours dépeint la valeur de l'activité. Matin et soir il médite, et il est actif durant la journée; aussi est-il un exemple vivant des étapes du progrès: repos profond et activité dynamique. Ainsi il vit la connaissance qu'il répand et représente lui-même l'exemple de la connaissance de l'IC."
  - "Le professeur de SIC sait se qu'il faut dire et à quel moment le dire; il sait aussi où en est la croissance de la connaissance de ses étudiants, parce que les qualités de précision et de discrimination se construisent spontanément dans sa conscience. Sa conscience est imbibée des qualités essentielles de l'IC, et, par conséquent, il est spontanément précis, discriminatif, utile, progressif et créatif. De par sa pratique régulière de la MT, chacune de ses pensées est saturée de toutes les valeurs de l'IC; il enseigne donc spontanément par l'exemple, ce qui est la façon la plus efficace d'enseigner. Lorsque le silence du professeur de SiC murmure la vie vibrante de cet infini silencieux - domaine non manifesté de l'IC qui est la source de toute créativité - il vit alors la pleine valeur de l'IC."
  - "Le professeur de SIC est la source-mère de connaissance, de laquelle les courants de connaissance s'écoulent. En tout domaine d'étude, il met en lumière la vie de l'IC - qu'il s'agisse de l'orbite constante, systématique de l'électron autour du noyau, du pointillé de la vie contenue dans les molécules ADN et ARN, ou encore du mouvement ordonné des galaxies et de la structure de l'univers entier. En enseignant n'importe quel domaine de connaissance, le professeur de SIC met en relief une seule valeur fondamentale, qui soutient tous les champs de connaissance et le domaine entier de la vie: le champ pur de l'IC. Il rend à l'éducation l'étude manquante\n\nde l'intelligence et vivifie cette connaissance, pour le connaisseur, en termes de lui-même; c'est ainsi qu'il vivifie et enrichit tous les domaines d'apprentissage."
  - "Le professeur de SIC est un architecte de la vie qui structure une demeure de connaissance dans le coeur et l'esprit de chaque étudiant: ceux-ci sont donc à jamais libérés des doutes et spontanément capables de penser juste, d'avoir des pensées utiles qui soient favorables à la vie."
  - "Le professeur de SIC inspire la spontanéité de toute vie, de telle sorte que tout l'environnement de chaque individu puisse être purifié. Il est celui qui possède et donne cette connaissance, laquelle constitue le plus grand agent purificateur jamais connu. Grâce à la pratique de la MT, la connaissance de la SIC purifie le corps tout entier, normalise la santé et donc aplanit le chemin de l'action spontanément juste. Lorsque nous sommes exempts de tension et de fatigue, nous nous comportons spontanément de la bonne manière, d'une manière qui soit source d'aide et de plénitude pour chacun."
  - "Le professeur de SIC a du succès en enseignant la pleine valeur de la vie. Quoi qu'il enseigne, il amène à la vie la lumière essentielle de toute connaissance: le champ pur de l'IC; non seulement il en établit la valeur au plan de la compréhension intellectuelle, mais il est aussi à même de guider ses étudiants dans le domaine pratique, en leur donnant l'expérience directe de cette valeur fondamentale de la vie, par laquelle toutes les phases de la vie sont illuminées, enrichies et glorifiées. Il sait comment utiliser ce très beau et suprême principe qui anime la nature même de la vie pour vivifier spontanément sa pleine valeur."
  - "Le professeur de SIC est le connaisseur et le diffuseur de cette connaissance suprême grâce à laquelle, sans rien faire, toutes les avenues de la vie sont glorifiées, et grâce à laquelle nous devenons capable de vivre la vie dans la plénitude. Nous savons déjà comment nous reposer et comment agir, le professeur de SIC ne fait que nous donner la technique de non-agir, ce qui nous rend capable de nous reposer plus profondément et d'agir avec plus de dynamisme. Telle est la connaissance suprême."
  - "Le professeur de SIC est un enseignant fameux de cet âge scientifique et technologique. Il déploie de façon précise et systématique la valeur intérieure de la vie en utilisant une technique grâce à laquelle le but est automatiquement accompli sans que nous ayons à faire quoi que ce soit. Immédiatement, sans faire grand-chose, il peut donner à chacun son billet pour le champ infini illimité de la vie; telle est la technologie préprogrammée de la SIC."
  - "Le professeur de SIC joue un rôle régénérateur dans l'histoire de l'humanité. Il se tient debout avec un message qui va changer la vie de l'homme sur terre de la souffrance à la joie, d'une vie où prédomine la disharmonie, les conflits, le chaos et la souffrance à une vie faite toute d'harmonie, d'amour et de paix, partout et toujours. Il se lève pour donner une direction au temps et régénérer l'humanité jusqu'à la plénitude de la vie, en enseignant cette connaissance suprême et tout-englobante, qui utilise la nature même de la vie. Bénis soient tous ceux qui sont professeurs de SIC. Toute gloire à Guru Dev."

questions:
  - question: "Qu'enseigne le professeur de SIC?"
    answer: "Le professeur de SIC est l'exposant de la pleine valeur de la vie."
  - question: "Comment le professeur de SIC est-il l'incarnation de son propre enseignement?"
    answer: "Il enseigne par son propre exemple - il vit le message qu'il transmet aux étudiants."
  - question: "Quel aspect de la créativité le professeur de SIC enseigne-t-Il?"
    answer: "11 enseigne le fait que le domaine non manifesté de l'IC est silencieux, profondément silencieux, infiniment silencieux: la source de toute créativité."
  - question: "En ce qui concerne la connaissance, quel est le rôle du professeur?"
    answer: "Son rôle consiste à être une source de connaissance d'où jaillissent des courants vivifiants de connaissance."
  - question: "Comment le professeur de SIC restaure-t-il ce qui manque au domaine de l'éducation?"
    answer: "Le professeur de SIC enseigne la valeur fondamentale de la vie; dans tous les domaines, il met en lumière ce qui a manqué à l'éducation: l'étude de l'intelligence."
  - question: "Qu'est-ce que le professeur de SIC structure en chaque coeur et en chaque esprit?"
    answer: "En chaque coeur et en chaque esprit, le professeur de SIC structure la demeure de toute connaissance."
  - question: "En quoi le professeur de SIC traite-t-il des études interdisciplinaires?"
    answer: "Quel que soit le sujet qu'il enseigne, il amène à la vie la lumière essentielle de toute connaissance, qui est le domaine de l'intelligence pure."
  - question: "En quoi le professeur de SIC traite-t-il de la connaissance suprême?"
    answer: "Le professeur de SIC est l'enseignant de la connaissance suprême, une connaissance qui peut se structurer sans effort dans le coeur et l'esprit de chacun. Elle est fondée sur la nature même de la vie, cette valeur fondamentale qui est dormante mais doit être vivifiée, en sorte que chaque phase de la vie soit spontanément enrichie et glorifiée."
  - question: "Par quels moyens le professeur de SIC donne-t-il la connaissance, et pourquoi ces moyens sont-ils appropriés aujourd'hui?"
    answer: "Il donne la connaissance par le moyen d'une technique, parce qu'il est un enseignant de cet âge technologique."
  - question: "Quelle sorte de régénération est implicite dans le rôle du professeur de Science de l'Intelligence Créatrice °?"
    answer: "Il apporte un message qui va changer l'histoire de la vie de l'homme sur terre, de la souffrance au bonheur, de la disharmonie, du conflit et du chaos à l'harmonie totale, à l'amour et à la paix. Il régénère ce temps en lui donnant une direction. Il régénère l'humanité jusqu'à la plénitude de la vie."

place_de_la_lecon:
  - "Cette leçon vivifie le cours de SIC tout entier en montrant comment la connaissance et l'expérience de l'IC sont vibrantes chez le professeur. Les premières leçons ont analysé intellectuellement les différentes avenues de l'expérience, de l'étendue et de l'application de l'IC."
  - "Dans cette leçon, nous apprenons comment - en tant que professeurs de SIC\n- nous sommes les incarnations vivantes de cette sagesse de la totalité de la\nvie. Nous amplifions les qualités de l'IC par nos actions; en effet, ayant imprégné notre conscience des qualités essentielles de l'IC, grâce à notre pratique quotidienne, nous devenons de plus en plus précis, discriminatifs, utiles, en progrès et créatifs. Ainsi, nous enseignons par l'exemple, méthode la plus efficace jamais connue. En outre nous avons en main la théorie qui soutient la pratique et le développement de l'IC; nous sommes donc en mesure d'être des enseignants efficaces pour les autres."
  - "Nous sommes ceux qui possèdent et dispensent le plus grand agent de purification jamais connu: la capacité de contacter le champ pur de l'IC. Nous sommes les régénérateurs de l'humanité jusqu'à la plénitude de la vie."
  - "Cette leçon met en lumière les qualités cachées qui constituent l'essence d'un professeur de SIC. Lorsque nous pourrons évaluer la connaissance et l'expérience de l'IC acquises par chacun grâce à ce cours, nous pourrons alors reconnaître la pleine valeur de cette leçon dans le contexte du cours tout entier."
