schema_version: 1

lesson:
  number: 24
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et les moyens d'acquérir la connaissance"
  language: fr

points_principaux:
  - "Les moyens objectifs pour acquérir la connaissance:\n- s'utilisent dans la recherche scientifique\n- excluent la relativité toujours changeante\n\ns'adressent à des niveaux spécifiques d'existence - la connaissance ainsi acquise ne sera ni complète, ni totalement satisfaisante."
  - "Les moyens subjectifs pour gagner la connaissance dans le septième état de conscience:\n- sont non-variables; ainsi la connaissance acquise sera elle-même non-\nvariable et digne de foi,\n- saisissent la valeur totale de l'objet,\n- ouvrent le niveau infini de l'objet à la conscience du \"connaisseur\"; ainsi\nla connaissance gagnée sera-t-elle complète et source de plénitude."
  - "La SIC inclut tout à la fois les methodes subjectives et objectives pour gagner la connaissance. La connaissance qu'elle offre est donc doublement digne de foi, utile et source de plénitude."

resume_long:
  - "Considérant la SIC et les moyens d'acquérir la connaissance, nous envisageons en fait deux domaines. Le premier est la SIC elle-même, laquelle inclut l'étendue tout entière de l'infini et nous apprend à l'incorporer à notre propre conscience. L'autre, ce sont les différents moyens d'acquérir la connaissance."
  - "Les moyens d'acquérir la connaissance sont les canaux par lesquels la connaissance nous vient. Les sens, les sentiments, l'esprit, l'intellect et l'égo sont les moyens subjectifs pour acquérir la connaissance. Le connaisseur (le sujet connaissant), à savoir le “je” dépend de ces moyens pour connaître quoi que ce soit."
  - "Nous acquérons la connaissance par la perception directe, par l'analyse intellectuelle, l'inférence et la comparaison Dans le monde objectif également, nous avons des moyens d'acquérir la connaissance, tels la radio, la télévision, les journaux et les livres."
  - "La science réclame des moyens de connaissance qui empêchent la connaissance de varier, de telle sorte qu'elle restera vraie en tout temps et en tout lieu: on pourra s'appuyer dessus, elle sera digne de foi sur le plan pratique en vue du progrès et de l'évolution. La connaissance ainsi acquise par des moyens non variables sera systématique, vraie, fiable, et utile."
  - "Nous pouvons classer les moyens d'acquérir la connaissance en deux catégories: objectifs et subjectifs."
  - "La science utilise les moyens objectifs pour gagner la connaissance. Elle met complètement de côté la subjectivité du connaisseur parce que la subjectivité change en permanence. Dans les étapes clairement définies du progrès, il doit y avoir une direction spécifique, qui exclue la variabilité de direction qu'impliquent les états de veille, rêve et sommeil."
  - "Les moyens subjectifs d'acquérir la connaissance sont non-variables dans le septième état de conscience, état dans lequel la subjectivité elle-même est non-changeante. La connaissance acquise dans cet état est absolument non-variable, digne de foi, sans faille et complète. Tous les aspects de la connaissance sont alors ouverts à notre conscience."
  - "La connaissance est entièrement satisfaisante dans cet état de conscience qui est non-variable et ne nécessite pas non plus de développement ultérieur. Seule une connaissance complète peut être source de plénitude, et rien de moins. Si un quelconque domaine demeure encore inconnu, alors la\n\nquête continuera, et il n'y aura pas de plénitude dans cet état d'ignorance. À moins que le sujet ne soit complètement développé, à moins que le connaisseur n'acquière la connaissance au niveau de la conscience pure, la connaissance ne sera pas complète; elle ne sera donc pas non plus source de plénitude."
  - "Les moyens objectifs d'acquérir la connaissance s'adressent à un seul niveau d'existence de l'objet - niveau moléculaire, par exemple. La connaissance ainsi acquise sera non-variable, mais elle ne le sera qu'à ce niveau-là. A un autre niveau, tel le niveau atomique, la connaissance sera différente. Ainsi, les moyens objectifs d'acquérir la connaissance ne s'appliquent pas à la valeur totale de l'objet d'investigation. Ils s'appliquent seulement à des domaines spécifiques. La connaissance acquise sera donc spécifique, c'est-à-dire propre à tel domaine: elle variera lorsqu'on passera à un autre. La connaissance acquise grâce aux moyens objectifs ne sera donc jamais entièrement satisfaisante. Il y aura toujours d'autres domaines de connaissance qui ne seront pas ouverts à notre conscience."
  - "Le maximum que puisse tirer le connaisseur des moyens objectifs de connaissance, c'est la connaissance du relatif le plus fin, parce que c'est là la limite de l'objectivité, Aucun moyen objectif de connaissance ne peut saisir le niveau non-manifesté, infini de l'objet. Par conséquent, aucun moyen objectif de connaissance ne peut donner la plénitude."
  - "Inversement, dans le septième état de conscience, les moyens subjectifs de connaissance ouvrent le niveau infini, illimité de l'objet à la cognition directe du connaisseur; la connaissance ainsi fournie est complète, elle se suffit à elle-même et donne la plénitude."
  - "Le but de la connaissance est l'action efficace; le but de l'action efficace est l'accomplissement et le but de l'accomplissement est la plénitude. La plénitude constitue donc le but ultime de la connaissance. Ce but n'est pleinement réalisable, de façon permanente, que dans le septième état de conscience. C'est d'ailleurs l'état normal de la conscience: chacun peut le vivre en éliminant les obstacles, les tensions et la fatigue qui empêchent la conscience de fonctionner librement."
  - "«La connaissance est structurée dans la conscience ». Comment pourrait-on avoir une connaissance tout-englobante, si l'on ne connaît pas la conscience pure, laquelle est tout-englobante? Une telle connaissance ne serait que la connaissance d'une avenue particulière du savoir, non celle de la totalité de la vie. Dans ce cas, on cherchera toujours la connaissance, ici et là, et\n\njamais on n'accédera à cette abondance de connaissance, celle qui réside dans l'état de toute connaissance, à savoir le champ pur de l'IC."
  - "La SIC vise à développer directement le champ pur de l'IC au niveau de la conscience individuelle; ce développement en lui-même constitue d'ailleurs le moyen d'acquérir la connaissance la plus directe et la lus profonde."
  - "Nous ne dévalorisons pas les moyens objectifs de connaissance. Nous devons en effet toujours agir à l'intérieur des limites, et il est donc souhaitable d'avoir une connaissance des limites. La SIC inclut les deux manières d'acquérir la connaissance: objective, grâce à la méthode scientifique, et subjective, grâce à la pratique quotidienne de la Méditation Transcendantale."
  - "La SIC allie ainsi les bienfaits obtenus grâce aux moyens de connaissance orientaux et occidentaux. La connaissance qu'elle offre est donc doublement digne de foi, doublement utile et doublement satisfaisante - elle nous donne une valeur de vie de 200 %! C'est pourquoi nous désirons que toute personne au monde puisse acquérir la connaissance de la SIC. Chaque étape de progrès sera ainsi source de plénitude jusqu'à ce que le but de tout progrès - la plénitude éternelle, infinie - soit accompli."

questions:
  - question: "Comment l'IC est-elle décrite dans la SIC?"
    answer: "La SIC décrit la nature de l'IC comme étant non-manifestée et manifestée. Sa nature manifestée se dirige vers l'infini dans tous les différents domaines de la création: nous pouvons la développer en nous-mêmes en incorporant dans notre conscience individuelle sa nature non-manifestée."
  - question: "Quelle qualité doit avoir la connaissance pour être considérée comme digne de foi?"
    answer: "Elle doit être non-variable."
  - question: "Quels sont les deux moyens majeurs pour gagner la connaissance, et sur quel genre d'invariabilité reposent-ils?"
    answer: "Les moyens objectifs de connaissance sont non-variables parce qu'ils excluent la variabilité du sujet: les moyens subjectifs de connaissance reposent sur la non-variabilité du sujet dans le septième état de conscience."
  - question: "Pourquoi la connaissance acquise dans le septième état de conscience est-elle digne de foi?"
    answer: "Parce que cet état est non-variable, non-changeant, toujours le même, et fidèle à lui-même dans sa nature."
  - question: "À quel niveau doit-on acquérir une connaissance qui soit source de plénitude?"
    answer: "En acquérant la connaissance au niveau de la pure conscience individuelle. La connaissance ne sera ni complète ni source de plénitude si elle n'est pas gagnée à ce niveau-là."
  - question: "Quelles sont les limites des moyens objectifs de connaissance?"
    answer: "Les moyens objectifs de connaissance ne s'appliquent pas à la valeur totale de l'objet: ils ne s'appliquent qu'à des domaines spécifiques: moléculaire, atomique, subatomique, etc. Ces moyens ne donnent pas une abondance de plénitude, laquelle découle d'une connaissance complète, du fait qu'ils ne peuvent saisir la valeur infinie de l'objet."
  - question: "Quel est le but de la connaissance ? À quelles conclusions la définition de ce but nous mène-t-elle en ce qui concerne les divers moyens d'acquérir la connaissance ?"
    answer: "Le but de la connaissance, c'est l'action efficace. Mais puisque le but de l'action efficace est l'accomplissement, et le but de l'accomplissement la plénitude, il s'ensuit que la plénitude ultime constitue, pour le connaisseur, le but de la connaissance. Les moyens subjectifs de connaissance permettent le mieux d'atteindre ce but."
  - question: "Que signifie notre devise: « La connaissance est structurée dans la conscience », à l'égard à la totalité de la vie?"
    answer: "Comment pourrait-on acquérir une connaissance vaste sans connaître le caractère vaste de la conscience? Si la connaissance n'était pas étendue, quel serait son but? Ce pourrait être une illusion. Une connaissance non-vaste, c'est la connaissance d'une avenue particulière du savoir, et non la connaissance de la totalité de la vie."
  - question: "Parmi les divers moyens de connaissance, quels sont les plus louables?"
    answer: "Le développement du champ pur de l'IC au niveau de la conscience individuelle, le développement de la conscience par la pratique régulière de la SIC, tel est le moyen le plus direct pour gagner la connaissance."

place_de_la_lecon:
  - "La vie comprend des valeurs subjectives et objectives - esprit et corps. Elle possède une structure subjective et objective. Si l'on trouve un moyen de vérifier la vie par les deux types de moyens, on aura alors une connaissance complète. Lorsque la vérification objective se confirme subjectivement, et lorsque l'expérience subjective se vérifie objectivement, la connaissance est complète. Grâce à une telle connaissance, la structure de l'activité est toujours en progrès et toujours satisfaisante. Cette leçon donne à tout homme la possibilité de se sentir à l'aise en ce qui concerne son état présent d'existence et toute évolution ultérieure. Elle élimine toute possibilité de doute et toute quête inaboutie dans le domaine de la connaissance."
  - "Vue sous cet angle, cette leçon donne une valeur d'accomplissement à tout le cours. La connaissance de l'IC est complète, profonde et parfaite. Cette leçon constitue un sceau de perfection qui authentifie la nature tout-englobante de la connaissance de la SIC."
  - "Il est important de relever ceci: la valeur tout-englobante du cours se révèle dans la compréhension profonde que cette leçon nous apporte sur les moyens subjectifs et objectifs de connaissance. Mais les moyens ne sont que des moyens. Ils ne peuvent produire des résultats que s'ils sont utilisés. En tant qu'étudiants de la Science de l'Intelligence Créatrice, nous utiliserons donc les deux types de moyens de connaissance pour cultiver la pleine valeur de la connaissance et tirer le maximum de ce que la vie nous offre."
  - "Nous nous habituerons à être systématique, méthodique et scientifique dans toute entreprise. Les moyens objectifs et subjectifs de connaissance se développeront ainsi ensemble dans notre nature; et nous nous en servirons spontanément dans tous les domaines de pensée, d'action et de comportement. C'est ainsi que nous déploierons une créativité maximum dans notre vie quotidienne. Ce résultat à lui seul justifie notre étude de la SIC."
  - "Comme elle est complète et de valeur pratique, la connaissance de la SIC a quelque chose à apporter dans chaque phase de notre vie. Cette leçon éclaire vraiment le cours tout entier; elle est comme une lampe."
