schema_version: 1

lesson:
  number: 22
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et le quatrième état de conscience"
  language: fr

points_principaux:
  - "Il est possible de déterminer intellectuellement l'existence du quatrième état de conscience, par l'analyse de la nature des points de jonction entre les trois états de conscience classiques: la veille, le rêve et le sommeil."
  - "La MT permet de faire l'expérience directe du quatrième état de conscience."
  - "Puisqu'il est possible de vivre à tout moment les états de veille, de rêve et de sommeil, il est évident que leurs point de jonction, le quatrième état de conscience, est sous-jacent à ces trois états."
  - "Chacun de ces trois états commence et finit au point de jonction. Parce que les trois points de jonction ont les mêmes caractéristiques, il est évident que le quatrième état de conscience, identifiable au point de jonction, est la source et le but des trois autres états."
  - "L'expérience du quatrième état de conscience enrichit spontanément\n\nles trois autres états. N suffit pour cela de se mettre simplement en contact direct avec ce quatrième état, contact qui est obtenu de façon systématique par la pratique de la MT."
  - "La privation du quatrième état de conscience équivaut à priver les trois autres états de leur source nourricière."
  - "L'expérience répétée du quatrième état de conscience à travers la pratique régulière de la méditation enrichit tous les domaines de la vie et conduit à la plénitude."

resume_long:
  - "Pour comprendre l'inconnu, nous devons partir du connu. Ainsi, nous devons nous appuyer sur l'expérience des trois états de conscience - la veille, le rêve et le sommeil - pour déterminer la nature essentielle du quatrième état de conscience. Ceux qui pratiquent la technique de MT font l'expérience directe de ce quatrième état de conscience. Mais puisque nous avons entrepris l'analyse intellectuelle, nous raisonnerons à partir de l'expérience habituelle des états de veille, de rêve et de sommeil."
  - "Les trois états de conscience se succèdent au cours des vingt-quatre heures d'une journée. L'expérience de chacun de ces états peut être faite à n'importe quel moment du jour ou de la nuit. Cela implique que le point de jonction entre deux de ces trois états - la veille, le rêve, le sommeil - peut se produire à n'importe quel moment du jour ou de la nuit."
  - "Le point de jonction constitue la source et le but de chaque état. On peut le localiser au début et à la fin de chacun de ces états de conscience."
  - "Nous savons peu de choses sur ces points de jonction. Nous savons seulement qu'un état se termine et qu'un autre lui succède. Chaque état apparaît, passe et disparaît. Nous ne savons pas précisément ce qu'est le point de jonction car rien de comparable n'existe dans les trois états habituels. Sa nature est non-manifestée puisqu'il est différent de tout ce que nous appelons manifesté, c'est-à-dire de tout ce qu'il est possible d'expérimenter dans les trois autres états."
  - "Les états de veille, de rêve et de sommeil peuvent être comparés à des rideaux qui cachent un continuum de conscience, qui ne connaît aucun changement, qui existe partout, en tout temps dans sa valeur non-manifestée et qui ne possède aucune des caractéristiques des trois états classiques de la conscience. L'espace et le temps ne le limitent pas. Le point de jonction peut être localisé partout et à n'importe quel moment. De"
  - "Cette analyse fait ressortir les trois états classiques comme les valeurs manifestées de la conscience. Quant au point de jonction, il représente la valeur non-manifestée de la conscience, qui est sous-jacente à ses propres manifestations que sont la veille, le rêve et le sommeil profond. Chacun de ces trois états émerge et disparaît sur ce substrat non-manifesté, qui leur est sous-jacent."
  - "Quelles sont les caractéristiques de ce quatrième état de conscience? Ce domaine non-manifesté donne naissance au flux de la conscience. Il est la source créatrice d'une variété extrême de qualités manifestées. Il est donc conscience et non pas inconscience. Un flux de conscience ne peut émaner que d'un réservoir de conscience."
  - "Nous savons par expérience que la veille, le rêve et le sommeil sont des états de conscience relatifs. Ils sont différents et changeants. Aussi, devons nous conclure que l'état qui en est la source, qui les sous-tend et en est le but, est absolu, omniprésent et non-changeant. Le quatrième état de conscience est toujours identique à lui-même. Les trois autres états s'originent en lui."
  - "Comment peut-on faire l'expérience de cet état absolu? Partant de l'état de veille, nous amenons notre conscience, graduellement mais systématiquement, à une perception plus fine, jusqu'à ce que nous transcendions la perception relative la plus fine de l'état de veille et accédions au point de jonction. Toutes les qualités des autres états sont alors transcendées, car le quatrième état de conscience est absolu."
  - "L'existence de ce quatrième état de conscience a également été établie sur une base scientifique, notamment grâce à la mesure des changements physiologiques qui l'accompagnent. Cet état possède ses propres caractéristiques physiologiques: variation du taux métabolique, de l'amplitude respiratoire, du débit cardiaque, des ondes cérébrales. Le quatrième état de conscience correspondant à une physiologie spécifique, à l'instar des trois autres états de conscience, constitue donc une réalité expérimentable, et non un simple postulat sans fondement scientifique. L'existence de ce\n\nquatrième état de conscience peut être prouvée d'une part à partir de l'analyse intellectuelle, logique et philosophique, d'autre part à partir des procédures de l'expérimentation scientifique."
  - "Tout méditant expérimente que l'expérience du quatrième état de conscience (ou simplement le fait de s'en rapprocher) enrichit les trois autres états de conscience. La veille devient plus claire. Le sommeil est plus réparateur. Et les rêves apportent une élimination plus efficace des tensions et des fatigues. La découverte de la source stabilise et accroît la liberté de tous les flux de la conscience. L'expérience répétée du quatrième état de conscience enrichit profondément la vie à tous ses niveaux."
  - "Des études scientifiques ont montré que la privation des états de rêve ou de sommeil aboutit à des troubles de la coordination dans le comportement. Le Dr Dimitri Kanellakos, de l'Institut de Recherche\n- de Stanford, va jusqu'à dire que la privation de l'expérience du\nquatrième état de conscience aboutit à la souffrance."
  - "Le manque de connaissance et d'expérience du quatrième état de conscience conduit la société à considérer la vie comme une lutte. Une technique est désormais disponible, qui permet à tout homme de faire l'expérience directe du quatrième état de conscience et d'enrichir ainsi tous les aspects de tous les états de conscience, c'est-à-dire de vivre une plénitude profonde. Cette possibilité de faire l'expérience du quatrième état de conscience par la technique simple et naturelle de la Méditation Transcendantale est un don fait à la race humaine."

questions:
  - question: "Sur quelle base peut-on assoir la compréhension intellectuelle du quatrième état de conscience?"
    answer: "Sur l'expérience des trois états de conscience classiques: la veille, le rêve et le sommeil profond."
  - question: "Qu'y a-t-il de commun entre les trois états de conscience de veille, de rêve et de sommeil?"
    answer: "La veille est complètement différente du sommeil et du rêve, le rêve est complètement différent du sommeil et de la veille, etc. Ces trois états sont complètement différents l'un de l'autre. Il n'existe aucun élément commun entre eux."
  - question: "Quelle conclusion peut-on en tirer au sujet du quatrième état de conscience?"
    answer: "Le quatrième état de conscience doit être différent des trois autres."
  - question: "Quelle relation y a-t-il entre l'état de veille et le point de jonction?"
    answer: "Le point de jonction est à la fois l'origine et le but de l'état de conscience de veille."
  - question: "Quelle analogie illustre le mieux la relation existant entre le quatrième état de conscience et les trois états de conscience relatifs: la veille, le rêve et le sommeil?"
    answer: "Les états de veille, de rêve et de sommeil sont semblables à des rideaux qui cachent la nature essentielle du continuum de la - conscience, qui ne connaît aucun changement, qui reste toujours le\nmême, dans sa valeur non-manifestée, éternelle dans le temps."
  - question: "Quelle est l'origine et l'aboutissement du flux de la conscience de l'état de veille?"
    answer: "Le flux de la conscience de l'état de veille émerge de la valeur non-manifestée de la conscience et finit également dans ce même état non-manifestée de la conscience."
  - question: "Quelles caractéristiques spécifiques au quatrième état de conscience peut-on déduire intellectuellement?"
    answer: "Le quatrième état de conscience doit être non relatif, non-changeant."
  - question: "Pourquoi qualifie-t-on ce quatrième état “d'absolu”?"
    answer: "Il est non-changeant, toujours le même, toujours présent. Il demeure caché, mais peut être localisé n'importe quand au moment de transition entre deux des trois états de conscience relatifs, ainsi que durant la MT."
  - question: "Qu'est-ce que la MT nous apprend au sujet de la manière de faire l'expérience de ce quatrième état?"
    answer: "La MT montre qu'en déplaçant graduellement la conscience depuis les perceptions superficielles vers des perceptions plus fines jusqu'à transcender le niveau relatif le plus fin, l'homme peut transcender l'état de veille et accéder à l'état pur, non-manifesté de la conscience."
  - question: "Quels bienfaits pouvons nous retirer du contact avec le quatrième état de conscience?"
    answer: "L'expérience répétée du quatrième état de conscience enrichit l'expérience des trois états relatifs de la conscience."

place_de_la_lecon:
  - "La leçon 22 est consacrée à démontrer conceptuellement l'existence d'un quatrième état de conscience. Elle est donc plus analytique que les autres. Néanmoins, la clarté de l'exposé et ses ressources imaginatives éveillent l'aspiration du méditant à faire l'expérience directe de ce quatrième état de conscience. Elle aiguise également le discernement."
  - "Nous appuyant sur l'expérience connue des trois états relatifs de la conscience, et sur la déduction d'un point de transition entre eux, nous sommes amenés à conclure, sur la base d'une analyse soigneuse, que le point de jonction est non-manifesté, non- changeant, absolu. Il est l'origine et le but de chaque pensée individuelle."
  - "Cette conclusion intellectuelle apporte une contribution essentielle à la connaissance: elle offre une compréhension théorique solide grâce à laquelle l'expérience de la transcendance pourra être pleinement satisfaisante et grâce à laquelle les doutes intellectuels pourront être éliminés. Cette analyse établit les bases pour que chaque homme puisse bénéficier plus facilement des bienfaits du contact de l'esprit avec le quatrième état de conscience."
  - "L'utilité de la philosophie est évidente lorsque ses conclusions ouvrent une voie à l'expérience directe. La philosophie atteint alors son objectif."
  - "Cette leçon approfondit la compréhension du champ illimité de la conscience, demeure de toutes les valeurs de l'Intelligence Créatrice. Elle donne une vision directe des possibilités de cette connaissance. L'étude systématique de l'Intelligence Créatrice s'exprime ainsi dans les valeurs complémentaires de la compréhension et de l'expérience. Cette leçon présente la valeur holistique de la SIC."
  - "À mesure que le cours progressera, il sera intéressant de découvrir combien nombreuses sont les voies de connaissance qui émergent directement de cette leçon."
