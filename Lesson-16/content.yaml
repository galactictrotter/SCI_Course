schema_version: 1

lesson:
  number: 16
  course: "Science de l'Intelligence Créatrice"
  title: "Les principes qui sous-tendent le développement de l'Intelligence Créatrice"
  language: fr

points_principaux:
  - "L'Intelligence Créatrice se développe dans la vie grâce au mouvement d'extériorisation de l'esprit du processus de MT."
  - "Les mouvements d'intériorisation et d'extériorisation du processus de méditation se réalisent en vertu de la nature même de l'Intelligence Créatrice."
  - "L'intelligence Créatrice se développe à travers les principes de:\n\n- la plongée\n\n- l'auto-purification\n\n- la glorification du chemin\n- la coexistence des opposés"
  - "La MT établit la communication entre le silence intérieur et l'activité extérieure."
  - "La science de l'être amène spontanément les hommes à communiquer au niveau du cœur."

resume_long:
  - "La pratique de la Science de l'Intelligence Créatrice repose sur quatre principes fondamentaux: les principes de la plongée, de l'auto-purification, de la glorification du chemin et de la coexistence des opposés."
  - "Dans la Méditation Transcendantale, nous apprenons à percevoir des niveaux de plus en plus subtils du mantra jusqu'à ce que nous perdions la trace de l'état le plus subtil de la pensée et que nous plongions dans la pure conscience. Ce processus décrit le mouvement de l'esprit vers l'intérieur ou mouvement d'intériorisation de l'esprit."
  - "À l'opposé, le développement de l'Intelligence Créatrice se fait sur la base d'un mouvement de l'esprit vers l'extérieur ou mouvement d'extériorisation. Le mouvement d'intériorisation fournit l'énergie potentielle qui stimule ensuite le mouvement vers l'extérieur. En plongeant profondément dans l'eau, nous gagnons une énergie suffisante pour nous propulser ensuite hors de l'eau."
  - "Nous utilisons un mantra pour plonger à l'intérieur. Nous remarquons alors que le fait de revenir à l'extérieur est aussi naturel, spontané et dénué d'effort que le fait de plonger à l'intérieur."
  - "Qu'est-ce qui donne à l'esprit l'énergie pour s'extérioriser? Le niveau de repos. Lorsque l'activité mentale diminue, l'esprit s'apaise jusqu'à ce qu'il accède au niveau du repos infini de la source de la pensée. Cet accroissement du repos fournit le potentiel d'énergie suffisant pour conduire l'esprit à s'extérioriser."
  - "L'accroissement du repos s'opère simultanément dans l'esprit et dans le corps. La recherche scientifique vérifie ce principe par l'observation de la diminution du taux métabolique au cours du processus. L'accroissement du repos déclenche un processus d'élimination des tensions."
  - "Le relâchement des tensions accroît momentanément l'activité du système nerveux. Cette activité d'élimination des tensions, engendrée\n\npar l'approfondissement du repos, fournit à l'esprit un potentiel d'énergie qui le pousse à s'extérioriser."
  - "L'expérience personnelle permet de vérifier que l'esprit, lorsqu'il s'extériorise, est imprègné de valeurs plus hautes d'Intelligence Créatrice."
  - "La recherche physiologique et psychologique vérifie qu'après la méditation, nous sommes effectivement plus reposé, plus éveillé, que le temps de réaction est moindre. La pensée devient plus profonde et plus efficace. Toutes ces vérifications scientifiques de l'expérience personnelle confirment l'hypothèse de la croissance de l'Intelligence Créatrice dans la vie quotidienne."
  - "Bien qu'initialisé par le mouvement de la plongée profonde, le mouvement pour sortir hors de l'eau a ses propres mécanismes. De la même façon, bien qu'il soit le résultat du mouvement d'intériorisation de l'esprit, le mouvement vers l'extérieur dans la méditation a ses propres mécanismes."
  - "Le chemin de l'épanouissement de l'Intelligence Créatrice se clarifie à mesure que s'éliminent les stress physiologiques, qui bloquent l'expression de la pleine valeur de l'Intelligence Créatrice dans la vie quotidienne. Cette purification du chemin, grâce à laquelle l'Intelligence Créatrice se développe dans les valeurs manifestées, est appelée “glorification du chemin”."
  - "C'est la nature même de l'Intelligence Créatrice qui attire l'esprit depuis le niveau superficiel de la pensée vers la source de la pensée. La nature évolutive de l'Intelligence Créatrice est orientée vers l'expérience de la plénitude. À mesure que l'on transcende en se dirigeant vers cet état de plénitude, un repos plus profond s'installe, qui permet de relâcher les tensions et de propulser l'esprit vers l'extérieur. S'extériorisant, l'esprit reste imprégné d'une plus grande valeur d'Intelligence Créatrice."
  - "C'est la nature même de l'Intelligence Créatrice qui est responsable du\n\nprocessus de purification du chemin grâce auquel l'Intelligence Créatrice se développe. C'est pourquoi nous disons que le développement de l'Intelligence Créatrice se fait sur la base du principe de l'auto-purification."
  - "Le système nerveux se purifie à travers le processus même de croissance de l'Intelligence Créatrice. La purification du système nerveux produit une meilleure qualité de conscience. L'esprit conscient acquiert une plus grande valeur d'Intelligence Créatrice, ce qui lui permet de penser et d'agir en produisant de meilleurs résultats dans la vie. C'est ce que nous appelons le développement de l'Intelligence Créatrice."
  - "Quand l'esprit sort de la méditation, la valeur non-manifestée de l'Intelligence Créatrice commence à imprégner les limites de l'activité. Cette imprégnation de la valeur infinie et illimitée de l'Intelligence Créatrice dans les limites de l'activité est un phénomène spontané."
  - "La pratique de la MT développe une forme d'amitié entre les deux valeurs de l'Intelligence Créatrice, l'intérieur et l'extérieur, le silence et l'activité. La recherche scientifique confirme l'expérience personnelle de croissance simultanée du calme intérieur et de l'efficacité extérieure."
  - "La croissance de la coexistence des valeurs opposées caractérise et soutient le développement de l'Intelligence Créatrice. L'harmonie croît au sein des différences. L'harmonie, jusqu'alors cachée sous les différences, devient apparente dans l'activité quotidienne. Les gens qui développent leur Intelligence Créatrice, ont une personnalité plus harmonieuse et se sentent bien avec les autres."
  - "Les principes de la plongée, de l'auto-purification, de la glorification du chemin et de la coexistence des valeurs opposées sont à la base de la pratique de la Méditation Transcendantale. Ces principes permettent l'actualisation des qualités de l'Intelligence Créatrice en nous-même. Cette croissance de qualités personnelles à travers la pratique de la MT, confirme l'existence d'une relation intime entre ces principes et le développement de l'Intelligence Créatrice."
  - "Soutenue par ces principes, la technique de Méditation Transcendantale renforce la communication entre les aspects intérieurs\n\nnon-manifestés de l'Intelligence Créatrice et ses expressions extérieures. Cette communication accroît l'intégration entre le repos et l'activité, aboutit à leur coexistence, et finalement les fusionne en l'unité."
  - "Une telle communication apporte une grâce suprême, celle de convaincre l'infini à descendre dans les valeurs finies au point de devenir une réalité vivante et permanente de la vie. Cette communication réussit par ailleurs à convaincre les valeurs finies à accepter la co-existence avec l'infinitude, tout en maintenant leur propre existence."
  - "Dans chaque méditation, matin et soir, nous prenons régulièrement contact avec le réservoir intérieur de silence, puis nous réintégrons les limites de l'Intelligence Créatrice. Les deux valeurs opposées - l'absolu et le relatif - bien qu'ils aient des caractéristiques opposées, ne sont en fait pas réellement opposées. L'une est la cause de l'autre, En méditant, nous apprenons à maintenir une communication vivante entre ces deux valeurs opposées du silence et de l'activité et à créer un lien d'amitié entre elles."
  - "Cette communication entre valeurs opposées constitue une très grande leçon de vie pratique: malgré toutes les différences qui existent dans le monde, pourvu que la communication soit maintenue entre les êtres humains, chaque homme a la possibilité de se sentir à l'aise avec ses semblables. Chaque nation, préservant sa propre dignité et son individualité, peut se sentir complètement à l'aise avec toute autre nation."
  - "Les sentiments sont le meilleur moyen de communication. Le cœur est l'instrument le plus pénétrant pour communiquer. La science de l'Être offre une connaissance universelle pour cultiver le cœur humain. Lorsque cette connaissance sera disponible et vivante dans tous les cœurs, la communication se fera spontanément de cœur à cœur."
  - "Lorsque les hommes vivront la plénitude de la vie, lorsque chaque société bénéficiera de l'usage de son plein potentiel, lorsque chaque nation se trouvera élevée au niveau des valeurs les plus avancées du progrès et de la civilisation, alors derrière chaque porte, on rencontrera l'intelligence infinie qui est à la source du monde."
  - "L'être humain accédera à la dignité de voir le Créateur se réjouir du progrès et des réalisations de tous les hommes de cette génération. Quelques minutes de méditation, matin et soir, conjuguées à l'activité quotidienne, constituent le meilleur moyen pour développer la pleine valeur de l'Intelligence Créatrice. Le processus tout entier repose sur quelques simples principes de bon sens qui gouvernent la création entière."

questions:
  - question: "De quoi dépend le mouvement d'extériorisation de la méditation et par conséquent le développement de l'Intelligence Créatrice?"
    answer: "Il dépend du mouvement d'intériorisation de l'esprit - c'est-à-dire de la qualité du repos gagné au cours de la MT."
  - question: "Comment l'accroissement du repos produit-il l'énergie suffisante pour engendrer le mouvement vers l'extérieur de la méditation?"
    answer: "La croissance du repos entraîne un relâchement des tensions. Ce relâchement des tensions augmente momentanément l'activité du système nerveux, et engage l'esprit dans un mouvement d'extériorisation."
  - question: "Illustrez la façon dont le principe de la plongée aboutit au développement de l'Intelligence Créatrice?"
    answer: "En plongeant profondément dans l'eau, nous gagnons une énergie suffisante pour nous propulser ensuite hors de l'eau. De façon similaire, dans la Méditation Transcendantale, nous utilisons un mantra, nous plongeons à l'intérieur et découvrons que le fait de sortir est aussi naturel, spontané et dénué d'effort que l'a été le fait d'aller à l'intérieur."
  - question: "Comment le principe de l'auto-purification intervient-il dans le développement de l'Intelligence Créatrice?"
    answer: "Dans la méditation, c'est la nature même de l'Intelligence Créatrice qui oriente le mouvement d'intériorisation de l'esprit vers la pure nature de l'Intelligence Créatrice. Ce processus produit un profond repos qui permet le relâchement de tensions et qui purifie le système nerveux. Ainsi se trouve purifiée et glorifiée la voie de développement de l'Intelligence Créatrice."
  - question: ": Par quel moyen l'Intelligence Créatrice se développe-t-elle?"
    answer: "Grâce à l'élimination des tensions du système nerveux. Un système nerveux plus pur reflète davantage l'Intelligence Créatrice."
  - question: "Comment vérifie-t-on personnellement qu'après la MT, nous avons grandi en Intelligence Créatrice?"
    answer: "Après la méditation, nous pouvons vérifier que notre esprit est plus créatif. Le temps de réaction diminue, nous sommes plus efficaces, et obtenons de meilleurs résultats dans la vie."
  - question: "Comment vit-on en soi-même, à travers la pratique de la MT, la coexistence des opposées?"
    answer: "À travers la MT, nous faisons l'expérience d'une plus grande harmonie entre les valeurs opposées du repos et de l'activité."
  - question: "Comment le principe de la coexistence des opposées s'exprime-t-il dans la création?"
    answer: "La valeur non-manifestée, non-changeante de l'Intelligence Créatrice coexiste avec ses expressions manifestées et changeantes."
  - question: "Quel effet a dans la vie pratique l'expérience de la coexistence des opposées, induite par la pratique de la MT?"
    answer: "Nous devenons plus harmonieux et plus tolérants. Nous devenons conscients de l'harmonie jusqu'alors cachée par les différences."
  - question: "Comment la coexistence des opposées peut-elle devenir une réalité vivante?"
    answer: "L'alternance de la méditation du matin et du soir, et de l'activité, établit un lien entre l'illimité intérieur et les limites extérieures de l'activité. Notre conscience devient capable de vivre les deux valeurs simultanément et en permanence."
  - question: "La diffusion de la MT aboutissant au plein développement de l'Intelligence Créatrice dans la société, qu'adviendra-t-il des différences dans le monde?"
    answer: "L'harmonie dominera au sein des différences. Chaque nation préservera sa dignité et son individualité tout en se sentant complètement en harmonie avec les autres nations."

place_de_la_lecon:
  - "Les leçons précédentes ont analysé les principes qui sous-tendent l'expérience de la pure nature de l'Intelligence Créatrice. Sur cette base, cette leçon considère les principes qui gouvernent le mouvement d'extériorisation de l'esprit, qui permet à l'aspect non-manifesté, infini, illimité de l'Intelligence Créatrice de s'écouler dans les limitations de l'activité. Le développement de l'Intelligence Créatrice se présente donc comme un phénomène totalement spontané et naturel, engendré par la nature même de l'Intelligence Créatrice. La nature évolutive, auto-purifiante et auto-perpétuante de l'Intelligence Créatrice permet à la pleine valeur de l'Intelligence Créatrice de devenir une réalité vivante."
  - "Cette leçon décrit les mécanismes de la réalisation du premier objectif de la Science de l'Intelligence Créatrice, qui est le déploiement du plein potentiel de chaque individu. Elle montre comment la Méditation Transcendantale, fondée sur la nature de l'Intelligence Créatrice, est la méthode la plus simple, la plus efficace et la plus universelle pour atteindre les différents objectifs de la Science de l'Intelligence Créatrice, présentés dans les leçons précédentes."
