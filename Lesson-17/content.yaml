schema_version: 1

lesson:
  number: 17
  course: "Science de l'Intelligence Créatrice"
  title: "La Science de l'Intelligence Créatrice et la recherche scientifique"
  language: fr

points_principaux:
  - "Toutes les sciences ne sont que des aspects particuliers de la Science de l'Intelligence Créatrice et contribuent à son développement."
  - "La vie présente deux aspects, l'objectif et le subjectif, l'existence physique et l'intelligence."
  - "Chaque état de conscience correspond à un état spécifique de la physiologie."
  - "La recherche scientifique confirme que la MT produit un état spécifique de repos: l'état d'éveil au repos."
  - "La MT développe l'aptitude à une compréhension élargie en même temps que la capacité à se focaliser de façon précise."
  - "La pratique régulière de la MT élève la vie à un niveau de plénitude illimitée."

resume_long:
  - "Chaque aspect de la création est une expression de la valeur non-manifestée de l'Intelligence Créatrice."
  - "Les différentes sciences cherchent à découvrir la vérité des phénomènes de la création, les mécanismes de l'évolution."
  - "La Science de l'Intelligence Créatrice cherche à comprendre les mécanismes grâce auxquels l'Intelligence Créatrice se manifeste et évolue. Elle étudie ainsi de façon systématique les différents attributs de l'Intelligence Créatrice. Par conséquent, les diverses sciences, qui approchent la connaissance de domaines partiels de la vie, ne sont que des aspects particuliers de la SIC. Toutes les recherches scientifiques passées, présentes, et futures - contribuent au développement de la Science de l'Intelligence Créatrice."
  - "La vie a deux aspects qui coexistent dans chaque parcelle de la création:\n- le subjectif et l'objectif\n- le mental et le physique\n- l'intelligence et l'existence"
  - "La recherche scientifique cherche à comprendre les deux domaines, le physique et le mental. Elle analyse l'aspect physique de l'existence et la valeur de l'intelligence qui est inhérente à l'existence, qui la soutient et qui permet sa croissance vers des valeurs plus élevées."
  - "Notre étude de la Science de l'Intelligence Créatrice nous conduit à évaluer l'expérience de la pure Intelligence Créatrice et ses applications dans la vie pratique. Nos considérations sur la SIC et sur la recherche scientifique viseront à éclairer les effets de la Méditation Transcendantale sur le corps et sur l'esprit."
  - "Le corps et l'esprit sont interdépendants. Cette intime interdépendance est dû à l'inséparabilité de l'existence et de l'intelligence."
  - "Chaque état de conscience correspond à un état physiologique spécifique. Chaque phase de l'activité mentale dépend de la façon dont le corps fonctionne."
  - "La recherche scientifique sur la technique de MT montre qu'un changement spécifique a lieu dans l'activité mentale et physique lorsque la conscience s'ouvre au champ pur de l'Intelligence Créatrice à la source de la pensée. Le taux métabolique, la consommation d'oxygène, et le débit cardiaque diminuent tandis que l'esprit devient.\n\nplus alerte."
  - "Le domaine de l'intelligence pure est le lit silencieux de la vie à partir duquel les pensées émergent en vagues de créativité et se développent en actions pour la réalisation et la plénitude."
  - "Lorsque l'homme ouvre sa conscience à l'océan de la pure intelligence à la source de la pensée, chaque pensée, chaque vague de l'océan, devient une expression de cet océan de pure intelligence."
  - "Pendant la méditation, l'activité mentale diminue. Les vagues d'Intelligence Créatrice réintègrent leur source, le domaine infini, illimité de la pure Intelligence Créatrice. Cette expérience a un effet parallèle sur le corps. Nous faisons l'expérience d'une profonde relaxation. Les mesures de diminution de la résistance dermale apportent une confirmation scientifique de cet état de relaxation physique et confirment l'interdépendance du corps et de l'esprit."
  - "Quand l'activité mentale et physique diminue au cours de la méditation, la vigilance augmente. Il s'ensuit une amélioration du temps de réaction: le délai entre la pensée et l'action se raccourcit."
  - "Le raffinement progressif des expériences au cours de la méditation rend l'esprit de plus en plus éveillé. L'esprit devient de plus en plus calme sans devenir inerte comme c'est le cas lorsque l'esprit quitte l'état de veille pour s'endormir. -"
  - "L'étude de n'importe quelle discipline cultive l'aptitude à s'ouvrir plus profondément à un domaine de connaissance. Les mathématiques nous éduquent à résoudre les problèmes de façon systématique, et développe une forme de concentration. Cette habitude est ensuite spontanément utilisée dans les différents domaines de la vie. Une structure utile à la vie a donc ainsi été créée."
  - "L'habitude de faire l'expérience des états plus subtils de la pensée pendant la MT, construit en nous une aptitude à nous concentrer profondément dans les différents domaines d'activité, et structure ainsi l'aptitude la plus précieuse pour réussir."
  - "L'amélioration de la capacité à se concentrer a été vérifiée par les psychologues. Le méditant devient plus efficace. Son esprit est plus éveillé. Il est capable d'intégrer simultanément plusieurs domaines de connaissance. Il entreprend ainsi des actions plus efficaces et accède à un niveau de réalisations et de satisfaction profondes."
  - "En expérimentant des états plus subtils de la pensée, l'esprit développe une capacité d'intégration élargie. Quand l'esprit s'immerge dans la source de la pensée, sa capacité d'intégration atteint une valeur infinie. La conscience est devenue illimitée."
  - "L'existence n'est jamais stationnaire. Elle évolue constamment car l'Intelligence Créatrice se régénère et se perpétue d'elle-même."
  - "L'étude de la Science de l'Intelligence Créatrice et la recherche scientifique confirment notre connaissance des qualités de l'Intelligence Créatrice et des mécanismes à travers lesquels ces qualités s'expriment progressivement."
  - "En vertu de la nature évolutive de l'Intelligence Créatrice, chaque génération naît avec de nouvelles aspirations et de nouveaux moyens pour atteindre une plénitude plus élevée:"
  - "La valeur infinie de la vie, la conscience illimitée, peut être vécue au niveau de l'esprit conscient simplement parce que la création est évolutive. Chaque individu peut y accéder concrètement et sans effort grâce à la pratique de la MT."
  - "Les recherches scientifiques sur la MT confirme notre expérience personnelle de l'Intelligence Créatrice et nous invite à ne jamais manquer notre pratique biquotidienne de la MT. La régularité de la pratique de la MT est la base du développement spontané de la vie vers son but le plus élevé - une plénitude illimitée."
  - "A travers la pratique régulière de la méditation, la Science de l'Intelligence Créatrice offre la bénédiction d'établir l'illimité au niveau de notre conscience de façon permanente et dans notre vie quotidienne."

questions:
  - question: "Donnez une définition de la Science de l'Intelligence Créatrice?"
    answer: "La SIC est l'étude systématique de la nature essentielle de l'Intelligence Créatrice, des mécanismes de son développement et de l'étendue de ses applications."
  - question: "Quelle relation y a-t-il entre l'Intelligence Créatrice et les différents aspects de la création?"
    answer: "Toute chose dans l'univers est une expression de l'Intelligence Créatrice."
  - question: "Qu'est-ce qui distingue la Science de l'Intelligence Créatrice des autres sciences?"
    answer: "La Science de l'Intelligence Créatrice cherche à comprendre toutes les qualités de l'Intelligence Créatrice ainsi que les mécanismes de son développement. Elle analyse l'expérience de la pure Intelligence Créatrice et ses applications dans la vie pratique."
  - question: "Quel lien y a-t-il entre la Science de l'Intelligence Créatrice et les autres sciences?"
    answer: "Toutes les autres sciences sont des aspects de la Science de l'Intelligence Créatrice car elles n'étudient que des aspects partiels de la vie."
  - question: "Expliquez comment les deux aspects de la vie, le subjectif et l'objectif,: coexistent dans chaque parcelle de la création?"
    answer: "L'aspect objectif de la création correspond à l'existence physique. L'Intelligence Créatrice, l'aspect subjectif, est présent en chaque ' parcelle de l'existence afin que celle-ci puisse croître et évoluer vers ° des niveaux d'expression plus avancés."
  - question: "Quel lien existe entre le métabolisme et la conscience?"
    answer: "Chaque état de conscience correspond à un état spécifique de la ' physiologie. Le taux métabolique, qui est une mesure globale de l'activité du corps, diminue spontanément quand l'activité mentale se réduit au cours de la pratique de la Méditation."
  - question: "Citez quelques uns des effets de la Méditation Transcendantale, qui ont été mesurés par les physiologistes et les psychologues?"
    answer: "Les physiologistes ont trouvé une diminution du taux métabolique, de la consommation d'oxygène, du débit cardiaque. Les psychologues ont noté qu'après la pratique les sujets présentaient un esprit plus éveillé et un meilleur temps de réaction. Les méditants étaient par ailleurs plus chaleureux et avaient une plus grande énergie."
  - question: "Lorsque l'activité physique et mentale diminue au cours de la méditation, l'esprit devient-il plus inerte?"
    answer: "Non. L'éveil s'accroît. Au cours de la MT, l'esprit se focalise de façon de plus en plus fine sur les différentes expériences. Cet accroissement du raffinement de l'expérience rend l'esprit de plus en plus alerte."
  - question: "Quel est l'intérêt de cette expérience systématique des niveaux plus subtils de la pensée?"
    answer: "L'habitude de faire cette expérience des niveaux de plus en plus subtils de la pensée, construit en nous une aptitude naturelle à apporter une attention plus concentrée dans les diverses situations de la vie."
  - question: "Qu'apportent l'étude de la Science de l'Intelligence Créatrice et la recherche scientifique?"
    answer: "L'étude de la Science de l'Intelligence Créatrice et la recherche scientifique concrétisent notre connaissance des différentes qualités de l'Intelligence Créatrice et des mécanismes à travers lesquels ces qualités se développent. De nouvelles valeurs d'Intelligence Créatrice donnent continuellement expression à de nouvelles valeurs de l'existence et à de nouvelles vagues de progrès."

place_de_la_lecon:
  - "Cette leçon sur la Science de l'Intelligence Créatrice et la recherche scientifique concrétise les connaissances acquises dans les leçons précédentes. Elle permet d'approfondir la connaissance des qualités de l'Intelligence Créatrice et des mécanismes à travers lesquels ces qualités se développent dans toutes les phases de la vie."
  - "Le caractère spontané de l'application de l'Intelligence Créatrice dans la vie quotidienne est confirmée par les nombreuses recherches scientifiques qui mesurent l'effet produit par la MT aux deux niveaux physique et mental, aux deux niveaux de l'existence et de l'intelligence."
  - "En vérifiant l'existence de ce niveau suprême de la vie, la recherche scientifique trouve sa pleine maturité de science de l'intelligence créatrice, qui est de conduire la vie vers le but ultime du progrès, l'état de plénitude infinie."
  - "Le caractère vérifiable de la SIC abordé dans cette leçon, démontre encore une fois l'aspect scientifique, fiable, et tout-englobant de la SIC, et lui confère le statut de connaissance suprême."
