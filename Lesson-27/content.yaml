schema_version: 1

lesson:
  number: 27
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC : l'artiste et le scientifique"
  language: fr

points_principaux:
  - "Les qualités fondamentales de l'artiste et du scientifique sont présentes en chacun. Chacun à un coeur et un esprit, des qualités intégratives et analytiques qui toutes appartiennent à l'IC."
  - "L'artiste exprime sa propre nature subjective intérieure dans son travail et insuffle la vie à l'objet."
  - "Le savant chante le chant silencieux de l'infini dans chaque vague nouvelle de relativité."
  - "Chaque mouvement de l'artiste reflète l'infini."
  - "L'IC d'un scientifique explore le champ de l'existence."
  - "Le repos qui sépare chaque mouvement de l'artiste représente la valeur intérieure, la valeur transcendantale de son IC."
  - "Le scientifique agit à partir de l'observation, et, découvrant davantage et davantage du domaine relatif, avance tranquillement dans la direction de l'absolu."
  - "La SIC développe la pleine valeur du coeur et de l'esprit, et elle épanouit en tout homme les qualités de l'artiste et du scientifique."

resume_long:
  - "Les qualités de l'artiste et du scientifique sont présentes en chacun. Par la pratique de la SIC, les qualités qui soutiennent, pour l'artiste, la plénitude du sentiment, ainsi que la compréhension claire et sans préjugé du scientifique se développent jusqu'à ce que le coeur et l'esprit s'épanouissent dans leur pleine valeur. De cette manière, la SIC fait de tout homme un grand savant et un grand artiste."
  - "Toutes les qualités de l'IC sont présentes en toute chose dans la création. La diversité apparaît parce que certaines qualités sont plus exprimées que d'autres, dans différentes choses. Chaque chose, ainsi, possède son caractère distinct; ce fait explique les différences dans la création, en même temps que l'énorme variété d'existence et d'intelligence. Il rend également compte des différentes espèces d'activité dans l'univers, et des différences entre les gens, les goûts et les professions."
  - "Lorsque l'esprit conscient atteint le champ pur de l'IC, il se sature de toutes les qualités de l'IC; et lorsqu'ensuite on a besoin de certaines qualités dans quelque circonstance ou situation de la vie que ce soit, ces qualités s'expriment d'elles-mêmes davantage. C'est pourquoi ceux qui pratiquent la MT deviennent plus habiles dans ce qu'ils entreprennent, plus efficaces en tout domaine de la vie."
  - "Toutes les expressions de l'IC, toutes les différentes phases de l'activité individuelle et sociale appartiennent à la nature progressive de l'IC. L'IC s'exprime simultanément dans le domaine mental et physique, domaines de la psychologie et de la physiologie; de là, elle s'étend à tous les secteurs de la connaissance: physique, chimie, astronomie, histoire, économie, etc."
  - "La qualité discriminative de l'IC décide laquelle de ses qualités sera utilisée, où, quand, et en quelle quantité. Mais toutes les qualités qui s'expriment dans les différents phénomènes et phases de la création sont présentes dans la valeur non-manifestée de l'IC - laquelle est existence universelle. La totalité de l'IC est partout présente parce que tout, dans la création, n'est rien d'autre que l'expression de la valeur non-manifestée de l'IC."
  - "Toutes les qualités de l'IC sont présentes en tout homme, qu'il soit économiste, astronome, politicien, scientifique ou artiste. La question est juste de savoir ce qui est utilisé et qui l'utilise. Certaines personnes préfèrent utiliser leurs sens, d'autres leur coeur ou leur esprit. La profession et le rôle d'un individu dans la vie sont d'abord déterminés par le fait s'il utilise\n\ndavantage son coeur ou son esprit. Par exemple, la mère se sert davantage de son coeur, alors que le politicien a davantage l'habitude de faire travailler son esprit."
  - "Le scientifique se veut absolument objectif. Il évite le caractère variable de l'influence subjective car, si la connaissance dépend de l'humeur et des conditions changeantes du connaisseur, elle sera différente en différents\n\nendroits et à différents moments. En conséquence, elle ne fournira pas une assise stable en vue de l'action. La réalisation personnelle et la plénitude, qui dépendent d'une action ferme, resteront hors de portée. Ainsi, le scientifique utilise des moyens objectifs, non-variables, pour gagner la connaissance."
  - "Le scientifique analyse tout objet de manière à déterminer ses composants, sa structure et ses propriétés, alors que l'artiste voit toute chose comme étant l'expression de l'IC. Il désire que tout objet avec lequel il joue chante la pleine gloire de la vie. Dans chaque expression innocente de l'artiste, l'objet respire la vie. Combien de vie l'objet est-il capable d'exprimer, cela dépend de la quantité de créativité que l'artiste est à même de lui donner. L'artiste joue le jeu de la vie."
  - "L'étudiant de la SIC peut voir les différentes qualités de l'IC s'exprimer de différentes manières dans chaque oeuvre d'art et chaque découverte scientifique. Le mouvement de l'artiste, c'est le déploiement de la créativité. Toutes les différentes couches d'existence qu'explore la science sont conduites par les différentes qualités de l'IC, s'exprimant de manière telle que le progrès"
  - "Le scientifique et l'artiste expriment les deux champs de l'IC: le scientifique se fait le champion du champ objectif, l'artiste celui du champ subjectif. Mais le scientifique n'est pas toujours uniquement objectif, et l'artiste pas seulement subjectif, car la vie n'est pas compartimentée dans sa nature: les qualités du coeur et de l'esprit sont présentes en chacun. Aucun homme n'est privé de sentiments, ce qui est du domaine de l'artiste, et aucun homme non plus n'est privé d'une perception claire, véritable, ce qui est le domaine du scientifique."
  - "Le coeur du scientifique se réjouit du fascinant déploiement d'Intelligence Créatrice qu'il observe dans son laboratoire. La soif de connaissance est en Chacun, parce que la connaissance donne satisfaction et plénitude. Le scientifique fait l'expérience d'un grande plénitude chaque fois qu'il découvre un nouveau phénomène."
  - "Toute étendue du coeur et de l'esprit est un rappel de l'infini: il faut juste un œil clair et net pour le voir, un coeur clair et net pour le sentir, et un esprit clair et net pour le comprendre. Les tensions sont éliminées par la pratique de la SIC; ainsi augmentent la clarté et la netteté de la perception, du coeur et de l'esprit. Toute observation laisse une profonde impression de la réalité limitée de la vie. Toute expérience de la vie est une inspiration à vivifier ce champ omniprésent de l'IC en vue de le savourer davantage. Le champ non-manifesté de l'IC est partout présent mais il faut le vivifier au plan de notre conscience. Ce caractère vivant de l'IC naît lorsque le coeur et l'esprit deviennent capables d'apprécier une limite isolée. Le fait qu'un coeur et un esprit clairs et nets puissent apprécier une limite seule titille l'infini et conte l'histoire de l'illimité de la vie."
  - "La fierté de l'artiste est de mettre en scène l'infini, de le faire apparaître dans un seul mouvement simple, innocent. Personne ne remarque le caractère illimité ou la blancheur de la toile jusqu'au moment où, grâce à un seul geste de l'artiste, un point noir y apparaît; alors l'expansion illimitée du blanc se manifeste immédiatement. De même, grâce à une seule observation au niveau microscopique ou galactique de la création, le savant peut murmurer la réalité de l'infini.\n\nNote au professeur: faites un point sur une feuille blanche, ce point exprimera la netteté, la propreté de la feuille. Si le point n'est pas là, la feuille n'exprime pas sa netteté, sa propreté. Le point met en lumière l'arrière-plan. S'il n'y a aucune limite, il n'y aura pas non plus \"d'illimité\": il faut qu'il y ait quelque limite pour mettre l'illimité en valeur. Tel est le but de la création."
  - "Le scientifique travaille à partir du plan de l'observation, tandis que l'artiste part du plan transcendantal de sa propre vie. La connaissance révélée par le scientifique est très concrète, et cependant très abstraite par son objectivité même. Ses applications sont concrètes: sa valeur réside dans des domaines plus isolés et spécifiques de la vie - le champ relatif des limites. L'artiste, de son côté, travaille directement avec les impulsions de vie, les impulsions de créativité. Bien que les mécanismes de son expression soient très abstraits, l'expression elle-même rend le chant de la plénitude plus audible."
  - "Alors que l'artiste exprime davantage d la valeur de la vie, sa capacité d'apprécier cette valeur grandit simultanément et il peut ainsi mieux chanter encore le chant du Créateur. Comme la valeur de la vie est infinie et illimitée, plus il exprime la vie, plus il se rapproche du Créateur. Chaque étape dans la création artistique constitue une étape vers une plus grande réalisation des valeurs du Créateur. En science, chaque étape de progrès,\n\nqui révèle les mécanismes de la création, constitue elle aussi une étape vers la pleine connaissance du Créateur. L'effet de ce progrès\n\nce soit dans la vie de l'artiste ou celle du scientifique: l'élargissement de la connaissance de la pleine valeur de la vie conduit à l'élargissement de la connaissance du Créateur du cosmos illimité. Quel que soit le chemin que nous prenons - celui de l'artiste ou celui du scientifique - la nature progressive et évolutive de l'IC amènera chacun à ce niveau suprême d'accomplissement: la connaissance de la totalité de la vie. Scientifique et artiste sont comme les pieds gauche et droit du corps de l'IC, sur lesquels elle progresse rapidement vers la plénitude de la vie."
  - "Les qualités de l'artiste et du scientifique sont présentes en chacun - il s'agit simplement de savoir dans quelle mesure elles sont utilisées. On trouve les qualités de l'artiste chez le scientifique, et celles du scientifique chez l'artiste. Le scientifique quitte son laboratoire et ses recherches abstraites pour revenir chez lui, et là Il se rafraichit dans les joies du coeur. Les qualités de l'esprit, nourries au travail et au bureau, sont équilibrées par les qualités du coeur, nourries à la maison."
  - "La pratique de la SIC développe simultanément les qualités du coeur et de l'esprit. Les qualités qui soutiennent les sentiments de l'artiste et leur donne substance, et les qualités qui maintiennent la compréhension claire et impartiale du scientifique grandissent et gagnent ainsi leur expression correcte dans la vie quotidienne. La SIC fera de tout homme à la fois un grand savant et un grand artiste en développant simultanément les pleines valeurs du coeur et de l'esprit. Chacun sera pleinement développé, quel que soit le domaine de la vie dans lequel il s'exprime. Telle est la bénédiction de la SIC."

questions:
  - question: "Qu'est-ce qui explique des différences dans la création?"
    answer: "Certaines qualités de l'IC sont exprimées davantage en un endroit qu'en un autre, et ceci explique les différences dans la création, la grande variété d'existences et d'intelligence, et les différentes espèces d'activité dans l'univers."
  - question: "En termes des qualités de l'IC, que se passe-t-il quand l'esprit atteint le champ pur de l'IC?"
    answer: "Lorsque l'esprit conscient atteint le champ pur de l'IC, il se sature de toutes les qualités de l'IC, et ces qualités s'expriment davantage, quels que soient le lieu et le moment où l'on en a besoin. C'est pourquoi, lorsque nous pratiquons la MT, nous gagnons en capacité dans tout ce que nous entreprenons, et sommes plus efficaces dans chaque phase d'activité et de progrès."
  - question: "Où réside en totalité la valeur exprimée de l'IC?"
    answer: "La création tout entière est l'expression de la valeur totale de l'IC."
  - question: "Qu'est-ce qui détermine nos occupations (profession) et nos entreprises (activités)?"
    answer: "L'utilisation des qualités du coeur ou de l'esprit, tel est le choix fondamental qui conduit la destinée des occupations et des entreprises."
  - question: "Quelle est la ligne de conduite du scientifique dans sa pensée?"
    answer: "Etre absolument objectif, utiliser les moyens objectifs pour gagner la connaissance."
  - question: "A partir de quel plan de sa propre vie l'artiste agit-il?"
    answer: "L'artiste utilise ses sentiments, son coeur. Il ne se satisfait pas des objets en tant que tels, mais il veut que ces objets expriment la vie."
  - question: ". Comment l'étudiant de la SIC regarde-t-il l'artiste et le scientifique?"
    answer: "L'étudiant de la SIC voit en tout geste de l'artiste, en toute découverte du savant, le jeu et le déploiement de l'IC."
  - question: "Comment l'artiste et le scientifique représentent-ils les deux différents aspects de l'IC, et que se passe-t-il quand ils se rencontrent?"
    answer: "Le scientifique et l'artiste sont deux exemples excellents des deux champs différents de l'IC - objectif et subjectif. L'un se fait le champion du champ objectif, l'autre celui du champ subjectif. Lorsqu'ils se rencontrent, l'artiste et le scientifique sont chacun une inspiration pour l'autre."
  - question: "Est-ce que l'artiste et le scientifique partagent quelques caractéristiques?"
    answer: "Le scientifique n'est pas toujours seulement objectif, et l'artiste n'est pas non plus seulement subjectif, parce que la vie n'est pas ainsi compartimentée. Les valeurs du coeur et de l'esprit sont toutes deux présentes en chacun. Aucun homme n'est dépourvu de sentiments, aucun non plus n'est exempt d'une perception claire et véritable de l'unicité de la connaissance."
  - question: "Comment la SIC affecte-t-elle en chacun de nous l'artiste et le scientifique?"
    answer: "La pratique de la SIC développe en nous tout à la fois les qualités de l'artiste et celles du scientifique. Les qualités de l'IC qui soutiennent les sentiments pour l'artiste et leur donne substance, de même que les qualités de l'IC qui soutiennent la compréhension claire, impartiale, du scientifique grandissent systématiquement avec la pratique de la MT et gagnent ainsi une expression appropriée dans la vie quotidienne."

place_de_la_lecon:
  - "Dans la création, comme toute chose est l'expression de l'IC, toutes les qualités de l'IC se retrouvent partout. Les différences viennent du fait que certaines qualités s'expriment davantage en certaines choses qu'en d'autres, et ceci est dû à la nature discriminante de l'IC. De même, les qualités du coeur et de l'esprit, présentes en chacun, s'expriment à des degrés variés chez divers individus."
  - "Dans le travail de l'artiste, les qualités du coeur prédominent, alors que dans le scientifique s'expriment davantage celles de l'esprit. Le scientifique est celui qui parle du champ objectif de la vie; l'artiste nous parle du champ subjectif."
  - "L'étudiant de la SIC savoure ces deux phases de la vie - subjective et objective. Il sait que les qualités du coeur et de l'esprit, présentes en chacun, peuvent se développer au maximum par la pratique de la SIC. Quand l'IC se développe, ses multiples qualités grandissent; ses qualités holistique et unifiante grandissent en même temps. On réalise ainsi l'idéal de l'éducation un homme pleinement développé dans tous les aspects de la vie, qui se sente à l'aise dans tous les domaines de la connaissance et de l'action."
  - "Cette leçon révèle l'IC au sommet de sa gloire chez tout individu: dans le plein épanouissement du coeur et dans le plein déploiement de l'intellect. La douce note de cette leçon fait écho à l'orchestre du cours tout entier. Car nous voyons ici, dans l'exemple de l'artiste et du scientifique, la gloire de l'unité au milieu même de la diversité. L'artiste - utilisant des moyens subjectifs pour gagner la connaissance - et le scientifique - utilisant des moyens objectifs - ont un but commun: découvrir et structurer l'infini dans l'étendue du fini. L'IC se manifeste par différents moyens d'expression pour chanter le chant des différences; son but ultime consiste cependant à révéler l'illimité au sein même des limites. C'est là la nature unifiante de l'IC, telle qu'elle s'exprime dans toute la création."
  - "En amenant l'Absolu à l'intérieur de l'expression individuelle et en révélant les mécanismes par lesquels un individu grandit dans toutes les qualités de l'IC, cette leçon réalise l'idéal élevé du cours, qui est de révéler la connaissance de l'IC pour créer un homme pleinement développé."
