schema_version: 1

lesson:
  number: 15
  course: "Science de l'Intelligence Créatrice"
  title: "Vérification par la biologie des principes qui sous-tendent l'expérience de la pure nature de l'Intelligence Créatrice"
  language: fr

points_principaux:
  - "SIC : Principe de la plongée : prendre un angle correct et laisser les choses se faire.\n- Biologie : La structure héritée est la base sur laquelle l'organisme s'adapte aux stimuli extérieurs."
  - "SIC : Principe de la gravité : l'esprit se dirige naturellement dans la direction d'une croissance maximale.\n- Biologie : La présence d'une substance nécessaire pousse un organisme à s'orienter vers celle-ci."
  - "SIC : Principe du charme croissant : une influence agréable s'installe à mesure que l'esprit se rapproche du champ pur de l'Intelligence Créatrice.\n- Biologie : L'attraction est plus grande lorsque l'organisme sent une forte concentration en substances vitales."
  - "SIC : Principe du voyage confortable ou de l'accroissement de la vitesse à proximité du but : le mantra permet à l'esprit de faire un voyage confortable vers la conscience illimitée.\n- Biologie : L'enzyme est un catalyseur qui accélère les réactions chimiques à l'intérieur des cellules."
  - "SIC : Principe de l'accroissement de l'intelligence par le repos : après avoir fait l'expérience directe du domaine silencieux de l'Intelligence Créatrice, l'esprit émerge avec des valeurs plus élevées d'énergie et d'intelligence.\n- Biologie : Le gène non actif, s'exprimant à travers son messager — l'ARN — est la source de toute activité dans la cellule."
  - "SIC : Principe de la purification du chemin : lorsque l'activité mentale diminue, l'activité physique diminue également et les stress se dissolvent grâce au repos obtenu.\n- Biologie : Le gène, centre silencieux d'intelligence, contient l'information nécessaire à la cellule pour éliminer les impuretés."

resume_long:
  - "Dans cette leçon, nous allons analyser les principes responsables de l'expérience de la pure nature la biologie. La biologie est l'étude du vivant. Elle nous apporte la\n\n__ connaissance de la façon dont les systèmes biologiques préservent leur vie et évoluent. Pour la Science de l'Intelligence Créatrice, le mouvement d'intériorisation de l'esprit vers la source de la pensée est une activité du vivant. Nous allons donc vérifier si les principes responsables du mouvement d'intériorisation sont confirmés par les lois de la science biologique."
  - "Le premier principe agissant dans l'expérience du champ pur de l'Intelligence Créatrice est le principe de la plongée, le principe de la prise d'un angle correct et du laisser faire. En biologie, “l'angle” correspond aux conditions initiales déterminées par la structure héritée de chaque cellule et responsables de l'apparition de l'activité. “Laisser faire” correspond à la flexibilité des organismes vivants qui permet de fournir une réponse adaptée aux stimuli extérieurs en vue de faire face aux nécessités d'existence et d'évolution."
  - "La composante de gravité du principe de la plongée se retrouve à la fois dans les mécanismes de l'esprit et dans ceux de la biologie. Chaque organisme vivant a tendance à se diriger naturellement en direction des substances nécessaires à sa croissance. La présence de substances vitales stimule l'organisme à se mouvoir dans leur direction. L'esprit est également spontanément attiré dans la direction qui lui permet une croissance infinie. Il se tourne donc vers l'intérieur, là où il sent la possibilité de vivre la conscience illimitée."
  - "A mesure que l'esprit s'enfonce dans le champ pur de l'Intelligence Créatrice, le méditant ressent un effet agréable. Ce principe du charme croissant guide l'esprit vers la pure nature de l'Intelligence Créatrice. L'esprit est attiré spontanément et sans effort vers le champ pur de l'Intelligence Créatrice, dans lequel se trouve la plus grande possibilité\n\n- de vivre la plénitude."
  - "Un mécanisme similaire au principe du charme croissant peut être trouvé en biologie. Quand un organisme sent une concentration élevée de substances nécessaires, l'attraction grandit. Et l'organisme se hate dans cette direction car il ressent un bonheur croissant à mesure qu'il se rapproche du but. Cette attraction plus grande crée un bonheur croissant, réduit la fatigue, et permet une utilisation plus efficace de l'énergie."
  - "À mesure que le charme augmente dans le cheminement vers le but, la vitesse s'accroît également. C'est le principe du voyage confortable. Quand le rythme de nos réalisations s'accélère, nous ressentons une plus grande satisfaction et un plus grand confort. Le mantra permet un voyage confortable pour l'esprit, si bien qu'à chaque étape évolutive, il se réjouit de son progrès et de son expansion, jusqu'à ce qu'il atteigne la conscience illimitée à la source de la pensée."
  - "Dans le domaine de la biologie, l'enzyme permet un voyage confortable aux molécules en facilitant le progrès et le développement des cellules. Agissant en tant que catalyseur, l'enzyme accélère la réaction des éléments à l'intérieur de la cellule. Il permet à la cellule d'évacuer rapidement ce qui n'est pas nécessaire et d'assimiler rapidement ce qui lui est nécessaire."
  - "L'intelligence qui construit l'enzyme provient d'un centre tranquille d'intelligence à l'intérieur de la cellule: le gène. Résidant au niveau silencieux, non actif de la cellule, le gène illustre le principe de l'accroissement de l'intelligence par le repos. Toute l'activité des cellules est mise en œuvre sous l'inspiration silencieuse du gène. Le\n\nmessager ARN transmet l'information visant à créer au niveau des structures cellulaires l'effet désiré pour le maintien de l'existence et de la croissance."
  - "Ce centre silencieux et ordonné de l'intelligence, qui est responsable de l'existence de l'enzyme, s'apparente au champ infini de l'Intelligence Créatrice, à la source de la pensée. A partir de ce domaine silencieux d'énergie et d'intelligence illimitées, l'esprit tire toute la créativité qui lui permet d'orchestrer les valeurs d'ordre et d'énergie dans l'activité."
  - "Pendant la MT, lorsque l'activité mentale diminue et que le système nerveux gagne un profond repos, tous les stress et les tensions qui bloquent l'esprit dans sa marche vers le but sont éliminés de manière spontanée. Ce principe de la purification du chemin a un parallèle en biologie. Les caractéristiques d'intelligence et d'énergie inhérentes à la structure du gène se manifestent à travers l'activité de l'ARN, qui à son tour oriente spontanément l'activité des cellules de façon à éliminer les impuretés et tout ce qui ne favorise pas le maintien de l'existence et de la croissance."
  - "Nous voyons ainsi que les principes qui régissent l'expérience de la pure nature de l'Intelligence Créatrice se retrouvent dans les mécanismes responsables de l'activité des systèmes vivants. Les lois de la nature qui soutiennent toute activité naturelle sont les mêmes. Que nous appréhendions ces lois sous l'angle de la physique, de la biologie, de la chimie, ou de la Science de l'Intelligence Créatrice, nous retrouvons les mêmes phénomènes naturels de soutien de l'existence et de l'évolution."
  - "L'expérience de la technique de Méditation Transcendantale montre qu'en établissant l'esprit dans le domaine illimité de l'Intelligence Créatrice, nous favorisons l'existence et la croissance de la vie. Il s'agit d'un phénomène naturel, soutenu par les lois de la nature."

questions:
  - question: "Pourquoi pouvons nous affirmer que les principes responsables de l'expérience de la pure nature de l'Intelligence Créatrice sont similaires aux lois qui régissent les processus naturels?"
    answer: "Tous deux sont des phénomènes naturels. Les mêmes lois de la nature sont responsables de toutes les activités naturelles."
  - question: "Dans quelle direction l'esprit s'oriente-t-il spontanément?"
    answer: "L'esprit s'oriente naturellement vers la conscience illimitée, dans la direction de la croissance infinie."
  - question: "Comment le principe du charme croissant soutient-il l'expérience de la pure nature de l'Intelligence Créatrice?"
    answer: "Un effet agréable est ressenti lorsque l'esprit s'enfonce profondément dans le champ pur de l'Intelligence Créatrice."
  - question: "Dans le processus de la plongée, pourquoi l'esprit a-t-il besoin d'un véhicule pour se mouvoir efficacement dans la direction qui offre une croissance maximale?"
    answer: "Un véhicule permet de prendre l'angle correct et accroît la vitesse vers le but."
  - question: "Quelle similitude voyez-vous entre le gène et le domaine infini de l'Intelligence Créatrice à la source de la pensée?"
    answer: "Tous deux sont une source non active d'intelligence et d'énergie."

place_de_la_lecon:
  - "Cette leçon établit le lien entre les lois de la nature tirées de l'étude des organismes vivants et les principes de la Science de l'Intelligence Créatrice décrivant le mouvement de l'esprit vers la source de la pensée, vers le champ pur de l'Intelligence Créatrice. La biologie est l'étude du vivant. L'activité de l'esprit dans le processus de transcendance appartient également au registre du vivant. Aussi pouvons-nous trouver des parallèles naturels entre ces deux domaines de connaissance."
  - "Dans cette leçon, nous analysons plusieurs principes de la Science de l'Intelligence Créatrice à l'aide d'exemples et d'analogies tirées de la biologie. Nous remarquons que ces principes responsables du mouvement d'intériorisation de l'esprit vers l'expérience de la pure nature de l'Intelligence Créatrice se retrouvent dans les mécanismes de l'activité des systèmes biologiques. Nous en tirons la conclusion suivante: les lois de la nature qui sous-tendent l'existence et l'évolution, sont les mêmes, quelle que soit la discipline à partir de laquelle on les étudie."
