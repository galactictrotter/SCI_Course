schema_version: 1

lesson:
  number: 5
  course: "Science de l'Intelligence Créatrice"
  title: "Les Qualités de l'Intelligence Créatrice"
  language: fr

points_principaux:
  - |-
    Il est possible d'analyser les qualités de l'Intelligence Créatrice à deux niveaux :
    - le niveau intellectuel
    - le niveau de l'expérience
  - |-
    L'Intelligence Créatrice est :
    - intégratrice
    - évolutive
    - discriminatrice
    - ordonnée
    - autonome
    - holistique
    - etc.
  - >-
    Le champ pur de l'Intelligence Créatrice est la source de toutes les
    qualités identifiables dans la création.
  - >-
    Toutes les qualités de l'Intelligence Créatrice s'épanouissent
    spontanément en nous, lorsque nous ouvrons notre conscience au champ
    pur de l'Intelligence Créatrice.
  - "La MT est la technique pour y parvenir."

resume_long:
  - |-
    Il est possible d'analyser les qualités de l'Intelligence Créatrice à deux niveaux :
    - celui de l'observation des fonctionnements et des expressions de l'Intelligence Créatrice dans le monde phénoménal, et
    - celui de l'expérience directe du champ pur de l'Intelligence Créatrice au cours de la pratique de la MT.
  - >-
    L'Intelligence Créatrice est intégratrice parce qu'elle unit des valeurs
    opposées : le manifesté et le non manifesté, le silence et l'activité,
    l'absolu immobile et le relatif mouvant.
  - >-
    Nous faisons l'expérience de la croissance de la qualité intégratrice de
    l'Intelligence Créatrice lorsque, à travers la MT, nous développons une
    plus grande vigilance, une plus grande clarté d'esprit et que nous
    devenons ainsi capables de percevoir plusieurs choses simultanément.
  - >-
    Examinant la création - et plus particulièrement une rose - on peut
    localiser la qualité intégratrice de l'Intelligence Créatrice au niveau de
    la sève. Toutes les différentes qualités de la rose - la tige, les épines,
    les feuilles, les pétales, etc. - sont intégrées au niveau de la sève.
  - >-
    La qualité intégratrice de l'Intelligence Créatrice est la base dynamique
    de toute action : lorsque la sève se met en œuvre pour créer la tige, elle
    construit la base de sa propre manifestation - une tige solide et ferme.
  - >-
    Selon la mécanique quantique, la qualité intégratrice de l'Intelligence
    Créatrice se trouve dans l'état fondamental. À ce niveau, toutes les
    qualités de l'univers diversifié sont contenues de façon extrêmement
    intégrée.
  - >-
    Dans la MT, nous faisons l'expérience de la qualité intégratrice de
    l'Intelligence Créatrice lorsque l'esprit transcende la pensée. En effet,
    cet état est le plus concentré, le plus intégré de l'esprit. L'esprit y est
    au repos tout en demeurant vigilant.
  - >-
    L'Intelligence Créatrice est évolutive et discriminatrice. Nous faisons
    l'expérience du développement de ces qualités en nous lorsqu'à travers
    la pratique de la MT, nos pensées deviennent plus utiles et s'orientent
    davantage vers un but.
  - >-
    On peut observer le caractère évolutif de l'Intelligence Créatrice dans
    une plante. L'Intelligence Créatrice met en mouvement la sève
    non-manifestée et la fait se développer en valeurs diversifiées.
  - >-
    Dans une rose, la feuille sera toujours verte, jamais rouge. Cela
    démontre l'infaillibilité du caractère discriminateur de l'Intelligence
    Créatrice.
  - >-
    L'Intelligence Créatrice est auto-suffisante, autonome. Elle crée toute
    chose à partir de l'intérieur d'elle-même. Elle n'a besoin de rien qui
    vienne de l'extérieur.
  - >-
    Nous faisons l'expérience de cette qualité d'auto-suffisance de
    l'Intelligence Créatrice lorsque, grâce à la pratique de la MT, nous
    devenons plus autonome, plus indépendant.
  - >-
    L'observation de l'ordre et de la précision présents dans la création
    montre que l'Intelligence Créatrice est ordonnée et précise.
  - >-
    C'est la nature ordonnée de l'Intelligence Créatrice qui rend la méthode
    d'investigation de l'Intelligence Créatrice ordonnée et systématique
    c-à-d scientifique.
  - >-
    L'Intelligence Créatrice est systématique : dans son évolution, chaque
    étape a une signification et un but. Cette évolution obéit à sa propre loi
    - l'alternance du repos et de l'activité.
  - >-
    L'Intelligence Créatrice est la source de sa propre satisfaction.
    L'expérience de l'Intelligence Créatrice développe une plus grande
    créativité et une plus grande satisfaction dans la vie.
  - >-
    L'Intelligence Créatrice est invincible. On ne peut la dominer. Son
    autonomie et sa vigilance la rendent invincible.
  - >-
    L'Intelligence Créatrice est omniprésente : la valeur non-manifestée de
    l'Intelligence Créatrice est présente partout.
  - >-
    Comme toutes ces qualités appartiennent à la nature même de
    l'Intelligence Créatrice, on peut dire que l'Intelligence Créatrice est
    holistique. Elle est présente dans la totalité de la vie.
  - >-
    Chaque parcelle de la création est structurée dans la totalité. Chaque
    grain de sève possède en lui-même la totalité des caractéristiques de
    l'arbre. Nous pouvons donc enrichir tous les aspects de notre vie,
    c'est-à-dire toutes les expressions de l'Intelligence Créatrice, en
    ouvrant simplement notre conscience à la valeur holistique de la
    création, au champ pur de l'Intelligence Créatrice situé en nous-même.
  - >-
    L'Intelligence Créatrice est illimitée. Dans la méditation, lorsque la
    conscience atteint le champ pur de l'Intelligence Créatrice, toutes les
    limites du relatif disparaissent.
  - >-
    Cette nature illimitée est la source de toutes les qualités que nous
    pouvons concevoir dans les domaines de la connaissance, de l'action, de
    l'existence et de l'évolution.

questions:
  - question: >-
      Comment la qualité intégratrice de l'Intelligence Créatrice se
      manifeste-t-elle dans sa valeur la plus haute ?
    answer: >-
      En associant les opposés, le silence et l'activité, le relatif mouvant
      et l'Absolu immuable.
  - question: >-
      Comment cette qualité intégratrice (toute-englobante) de l'Intelligence
      Créatrice s'incarne-t-elle dans la vie en général ?
    answer: >-
      À travers la coexistence du relatif et de l'Absolu d'où toute la
      création multiple émerge.
  - question: >-
      Comment le méditant expérimente-t-il la croissance de cette qualité
      intégratrice, toute-englobante en lui-même ?
    answer: >-
      À travers l'expérience de l'état de vigilance au repos, obtenu par la
      MT, le méditant développe une conscience plus large qui intègre plus de
      choses simultanément.
  - question: >-
      Comment le méditant expérimente-t-il la qualité discriminatrice de
      l'Intelligence Créatrice ?
    answer: >-
      Lorsque l'on commence à méditer, les pensées inutiles disparaissent.
      Elles deviennent davantage orientées vers un but.
  - question: >-
      Comment le méditant expérimente-t-il la qualité d'auto-suffisance de
      l'Intelligence Créatrice ?
    answer: >-
      La pratique de la MT développe une pensée subtile à travers laquelle
      l'esprit devient moins instable. Il devient ainsi moins nécessaire de
      faire appel à l'extérieur. On crée toute chose à partir de l'intérieur
      soi-même.
  - question: >-
      Quelle qualité fondamentale permet à l'Intelligence Créatrice d'être
      précise, ordonnée dans ses fonctionnements ?
    answer: "Elle est intelligente."
  - question: >-
      Indiquez quelques qualités de l'Intelligence Créatrice qui rendent son
      évolution scientifique ?
    answer: >-
      Elle est ordonnée, systématique, infaillible, discriminative, et
      précise.
  - question: >-
      Donnez un exemple du caractère holistique de l'Intelligence Créatrice
      dans la nature ?
    answer: >-
      Chaque parcelle de sève contient toutes les caractéristiques de la
      plante et chaque parcelle de sève est utile à la plante.
  - question: >-
      Quelle est la base de la qualité holistique de l'Intelligence Créatrice ?
    answer: >-
      L'aspect non-manifesté de l'Intelligence Créatrice. Celui-ci est plus
      fin que le plus fin et se trouve partout. Toute chose en est
      l'expression.
  - question: >-
      Comment pouvons nous “capturer” la base de toute la création et
      enrichir tous les aspects de notre vie de toutes les qualités de
      l'Intelligence Créatrice ?
    answer: >-
      En établissant notre conscience dans le champ pur et illimité de
      l'Intelligence Créatrice, par une pratique régulière de la MT, et en en
      exprimant les valeurs à travers nos actions, nos paroles et notre
      pensée.

place_de_la_lecon:
  - >-
    Les trois premières leçons ont été une inspiration pour commencer la
    pratique de la MT. Elles ont décrit l'ensemble des bienfaits que l'on peut
    retirer de la pratique, les mécanismes de celle-ci et la tradition dont
    elle est issue.
  - >-
    La quatrième leçon a esquissé la description de la nature de
    l'Intelligence Créatrice, telle que l'expérience personnelle peut nous la
    révéler. L'expérience de l'Intelligence Créatrice est intéressante grâce
    au contact avec la pure nature de l'Intelligence Créatrice, qui accroît le
    niveau d'efficacité personnelle et permet d'accéder à une réalisation
    plus large et une satisfaction plus profonde dans la vie.
  - >-
    S'appuyant sur l'analyse intellectuelle et la vérification par
    l'expérience personnelle, cette cinquième leçon présente les qualités
    fondamentales de l'Intelligence Créatrice. La connaissance de ces
    qualités s'obtient aussi bien par le biais de l'expérience que par celui
    de l'observation. Une meilleure compréhension intellectuelle élève la
    conscience individuelle au niveau de la conscience cosmique. Cette mise
    au diapason de la vie individuelle à la vie cosmique, constitue le but de
    la connaissance de ce cours.
  - >-
    L'ensemble du cours est consacré à l'étude de la Science de
    l'Intelligence Créatrice. Sans la connaissance des qualités de
    l'Intelligence Créatrice, ce cours serait comme un océan sans phare. Un
    phare guide les navires. Cette leçon sur les qualités de l'Intelligence
    Créatrice est semblable à un phare dans la globalité du cours.
