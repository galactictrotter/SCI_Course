schema_version: 1

lesson:
  number: 26
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et l'idéal de l'éducation"
  language: fr

points_principaux:
  - "L'idéal de l'éducation consiste à créer un homme pleinement développé, qui soit:\n- un homme de connaissance\n- un homme plein de ressources\nD un homme responsable\n- un homme qui ait du succès\n- > un homme de plénitude\n- un homme qui soit au maximum utile à lui-même et aux autres"
  - "Le but de l'éducation sera réalisé lorsque les méthodes subjectives et objectives pour acquérir la connaissance seront toutes deux utilisées."
  - "La SIC crée un homme pleinement développé, et réalise ainsi le but le plus élevé de l'éducation. Elle construit la demeure de toute connaissance dans l'esprit individuel."

resume_long:
  - "Nous avons déjà vu que la connaissance doit être complète, si nous voulons que la plénitude soit vaste et durable: nous avons vu également que la SIC réalise cette complétion de connaissance en utilisant tout à la fois les moyens objectifs et subjectifs de gagner la connaissance. Grâce aux moyens subjectifs de gagner la connaissance, notre conscience s'étend jusqu'à ce que la conscience illimitée soit établie au plan de l'esprit conscient. Sur la base de cette conscience illimitée, les moyens objectifs, scientifiques, de gagner la connaissance nous fournissent une connaissance très précise, non-variable, digne de foi, des limites, des domaines spécifiques de la vie relative. En utilisant ensemble les moyens subjectifs et objectifs de gagner la connaissance, la SIC satisfait à l'aspiration de l'éducation: créer des êtres de connaissance, pleinement développés."
  - "Un homme de connaissance est un homme qui sait faire le meilleur usage de lui-même et de son environnement. Il a un esprit plein de ressources. Pour réaliser son but, l'éducation a développé des méthodes qui placent les étudiants dans un environnement tel que diverses informations venant de disciplines différentes soient nécessaires dans le but de réaliser une tâche spécifique. De cette manière, l'étudiant apprend à utiliser ses ressources intérieures et gagne confiance dans la vie."
  - "L'éducation voudrait faire de tout homme un membre de la société qui soit plein de ressources, responsable, juste et puissant. Un homme dont les ressources sont pleinement développées depuis l'intérieur est d'utilité maximum et à lui-même et aux autres. Grâce à la SIC, l'éducation développe tout à la fois les ressources intérieures et extérieures. Elle déploie pleinement la réserve d'IC latente en tout homme; du même coup, elle donne à l'homme la connaissance de tous les aspects de la vie."
  - "Les différentes branches d'étude sont là pour que l'homme puisse connaître les différents domaines de la vie, mais la capacité de gagner la connaissance doit aussi être améliorée. Le “conteneur” de la connaissance doit augmenter sa capacité en même temps qu'il se remplit; il doit être assez vaste pour contenir l'océan de la connaissance tout entier. La pratique de la SIC dilate l'esprit jusqu'à son potentiel infini d'une manière spontanée, naturelle et sans effort."
  - "L'éducation devrait développer l'étudiant de telle sorte quil soit un bon membre de la société, qu'il ait du succès et qu'il progresse en toute phase de la vie, quelle que soit sa connaissance du domaine relatif, quelle que soit sa capacité d'action. S'il demeure incapable d'utiliser son plein potentiel, il est un boulet pour la société. Toute société qui intègre la SIC à son système d'éducation sera capable de réaliser l'idéal de l'éducation: tout étudiant deviendra profond dans sa pensée, dans son action, dans son accomplissement et dans sa plénitude, ceci en utilisant ensemble les moyens subjectifs et objectifs pour gamer la connaissance."
  - "En dépit des grands progrès accomplis par l'homme moderne en science et en technologie, en dépit de sa capacité à connaître les vastes galaxies et le monde de l'atome, le système d'éducation actuel ne fournit pas une connaissance complète. La soif de connaître n'est pas étanchée. Un homme sait quelque chose en histoire, quelque chose en économie, quelque chose en physique et quelque chose encore dans les autres domaines d'étude: mais le champ de la connaissance est tellement vaste qu'il n'est pas possible de connaître toute chose en se contentant d'étudier les différentes disciplines. La valeur totale de la connaissance peut cependant être acquise au plan de notre conscience. En étendant la capacité consciente de l'esprit, il est possible de construire la demeure de toute connaissance dans notre conscience, et donc de structurer la plénitude dans nos coeurs et dans nos esprits. Telle est l'accomplissement de l'éducation offerte par la SIC."
  - "Dans le présent système d'éducation, plus nous étudions un sujet, plus nous prenons conscience d'un plus grand domaine d'inconnu devant nous. Le champ de l'ignorance grandit plus rapidement que le champ de la connaissance. L'homme est abandonné au désespoir puisqu'il ne peut satisfaire sa soif de connaissance. Quand l'existence désire progresser et évoluer jusqu'à sa valeur infinie, la connaissance aussi désire croître jusqu'à sa valeur infinie. Mais lorsqu'en grandissant dans la connaissance d'un petit domaine, nous grandissons en même temps dans l'ignorance d'un domaine encore plus vaste, il y a de la cruauté. Un tel système d'éducation sabote la vie."
  - "En intégrant la SIC aux systèmes d'éducation du monde entier grâce au Plan Mondial, nous rendrons l'éducation capable de présenter la fleur de la connaissance sans les épines de l'ignorance. Quel que soit le sujet d'étude, on y incorporera également la pratique du développement de la conscience, c'est-à-dire les moyens subjectifs de gagner la connaissance.\n\nQuand l'esprit conscient deviendra demeure de toute connaissance, toute pensée jaillira alors du domaine de toute connaissance et embrassera tout, et toute action deviendra profonde et facteur de progrès, aboutissant à un accomplissement et une plénitude maximums."
  - "Le développement physique de chaque étudiant vers la maturité adulte devrait s'accompagner de la croissance de l'esprit et de la conscience. Parce que la nature de la vie est de croitre, le désir de grandir en connaissance pousse les gens à continuer à étudier tout au long de leur vie. Le domaine entier de la vie est le domaine de l'éducation."
  - "L'étude doit se fonder sur des étapes de progrès, sur le succès et non l'échec. On a pensé que souffrance, échec et ignorance étaient nécessaires, parce que la vie humaine n'avait ni plan ni direction appropriés. L'éducation doit satisfaire son but et donner à la vie une direction de progrès, puisse être vécue dans la plénitude. Ce que le présent système d'éducation ne fournit pas, c'est la connaissance de la source de la pensée, du siège de l'IC. Si nous ne savons comment localiser le réservoir de l'C, nous ne savons pas non plus d'où tirer la plénitude de la ie,"
  - "La bénédiction de la SIC tient en ce qu'elle déroule le tapis de la connaissance au sein de toutes les différentes disciplines, édifiant la demeure de toutes les branches d'étude, le champ pur de l'IC, dans notre propre conscience. Ensuite, où que nous allions, quoi que nous voyions, nous sommes établis dans la demeure de toute connaissance d'où s'élèvent de profondes inspirations, lesquelles vont se traduire en actions utiles et efficaces, en vue d'un maximum d'accomplissement et de plénitude. Ainsi, utilisant à la fois les moyens objectifs et subjectifs pour gagner la connaissance, la SIC produit des individus pleinement éduqués et développés; elle réalise donc l'idéal de l'éducation."

questions:
  - question: "Qu'est-ce qui est nécessaire, dans le domaine de l'éducation, pour que la plénitude englobe tout?"
    answer: "Pour que la plénitude englobe tout et qu'elle dure, il est nécessaire que la connaissance sou complète."
  - question: "Comment définissons-nous un homme de connaissance?"
    answer: "Un homme de connaissance est un homme dont l'esprit est plein de ressources; il sait foire le meilleur usage de lui-même et de son environnement."
  - question: "Qu'est-ce que l'éducation accomplit grâce à la SIC?"
    answer: "Grâce à la SIC, l'éducation développe en l'homme les ressources de son Intelligence Créatrice intérieure, latente: elle en fait en même temps un connaisseur de son propre environnement, du passé et des possibilités de l'avenir."
  - question: "Quand l'idéal de l'éducation est-il réalisé?"
    answer: "Lorsque les pensées, sentiments, actions, accomplissements et la plénitude qui en résulte sont profonds et maximums."
  - question: "Que manque-t-il à l'éducation contemporaine?"
    answer: "À l'éducation présente manque la technique qui donnerait satisfaction dans le domaine de la connaissance. C'est le but de l'éducation qui est manqué."
  - question: "Quel est donc le domaine vital dont le développement a manqué jusqu'ici?"
    answer: "Le champ de la conscience et de l'intelligence."
  - question: "Qu'est-ce qui a causé ce manque de développement?"
    answer: "L'ignorance du siège de l'IC, du réservoir de l'IC, et le fait de ne pas savoir comment en tirer la pleine valeur de la vie."
  - question: "Qu'est-ce qui est mis à disposition par l'étude de la SIC - en termes de connaissance - et comment l'éducation en est-elle affectée?"
    answer: "La possibilité d'édifier la demeure de toute connaissance au plan de notre esprit conscient La SIC fournit la connaissance du pur champ de l'IC à toutes les disciplines et branches d'étude. Elle amène à maturité l'ensemble des moyens subjectifs et objectifs pour gagner la connaissance, de sorte que l'éducation puisse réaliser son idéal le plus élevé: former des hommes et des femmes pleinement développés et pleinement éduqués."

place_de_la_lecon:
  - "Jusqu'ici les leçons du cours ont développé en profondeur les bénéfices fantastiques qu'individu et société peuvent tirer de l'étude et l'apprentissage de la SIC."
  - "Nous avons vu que la totalité de la connaissance est nécessaire pour une plénitude tout-englobante et durable. En outre, la SIC fournit cette connaissance complète en développant la connaissance subjective en parallèle avec la connaissance objective."
  - "De la même manière, dans cette leçon - la SIC et l'idéal de l'Education nous verrons que les moyens subjectifs et objectifs pour gagner la connaissance doivent être tous deux développés pour que l'éducation soit complète et satisfaisante. C'est-à-dire: la croissance de la connaissance dans tous les différents domaines d'étude doit aller de pair avec la croissance de la conscience chez les étudiants eux-mêmes."
  - "On doit constamment jouir du fruit de l'éducation tout en gagnant la connaissance. Dès le départ, l'éducation doit structurer la demeure de toute connaissance dans notre conscience. C'est sur cette base, la demeure de toute connaissance, que nous pouvons être vraiment éduqué. Tel est l'idéal de l'éducation."
  - "Cette leçon met le doigt sur ie manque de développement de la connaissance subjective; cela explique l'échec du système d'éducation actuel dans la réalisation de cet idéal et dans la création de citogens responsables, pleins de ressources et de succès. Cette leçon présente la SIC comme le moyen de rendre l'éducation complète, en fournissant le développement et la compréhension de la conscience."
  - "En donnant les grandes lignes de l'éducation, cette leçon offre au monde, pour la première fois, un moyen de créer des citogens productifs ei créatifs, qui vivent dans la plénitude, et ceci pour toutes les générations à venir."
  - "En quelques mois seulement, l'introduction de la SIC dans les systèmes d'éducation, partout sur terre, fournira une méthode pratique pour changer rapidement et de façon permanente la face du monde - de la souffrance et du manque de satisfaction à la paix, au progrès et à la plénitude durable."
  - "Mettant en lumière l'idéal de l'éducation, cette leçon réalise l'un des principaux objectifs du cours tout entier et promet la plénitude à toutes ses aspirations."
