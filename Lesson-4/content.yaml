schema_version: 1

lesson:
  number: 4
  course: "Science de l'Intelligence Créatrice"
  title: "Connaissance de la SIC par l’expérience personnelle"
  language: fr

points_principaux:
  - "L’existence de l’Intelligence Créatrice est évidente."
  - |-
    Il est possible de vérifier l’existence de l’Intelligence Créatrice à deux niveaux :
    - celui de la compréhension intellectuelle
    - celui de l’expérience directe
  - |-
    Il est possible de faire l’expérience de la nature de l’Intelligence Créatrice à deux niveaux :
    - non manifesté
    - manifesté
  - "La nature manifestée de l’Intelligence Créatrice est intégratrice, évolutive, etc."
  - >-
    Cette nature intégratrice et évolutive de l’Intelligence Créatrice est à
    l’origine de la transformation de la conscience individuelle en conscience
    cosmique.
  - |-
    L’expérience de l’Intelligence Créatrice a une valeur pratique dans la vie quotidienne :
    - elle élimine les tensions
    - elle développe l’efficacité
    - elle élève le niveau de réalisation personnelle
    - elle instaure un état de plénitude intérieure

resume_long:
  - >-
    L’expérience directe de la pure nature de l’Intelligence Créatrice au cours
    de la pratique de la MT apporte la connaissance de la nature de
    l’Intelligence Créatrice, de son développement et de l’étendue de ses
    applications.
  - >-
    L’observation de la croissance et de l’ordre dans le monde phénoménal
    conduit à postuler l’existence d’une intelligence fonctionnant sur tous les
    plans de la création.
  - >-
    L’expérience directe de la pure nature de l’Intelligence Créatrice confirme
    cette conclusion intellectuelle. Elle permet d’établir le principe selon
    lequel l’Intelligence Créatrice sous-tend toute existence et toute
    évolution. L’Intelligence Créatrice est la base de toute création. Elle est
    la valeur fondamentale du processus de l’évolution.
  - >-
    Ainsi, il est possible de vérifier l’existence de l’Intelligence Créatrice
    à la fois au niveau de la compréhension intellectuelle — par l’observation
    du monde phénoménal — et au niveau de l’expérience directe — par la pratique
    de la MT.
  - >-
    La première chose que l’on découvre au sujet de l’Intelligence Créatrice,
    c’est son existence. Une question émerge alors : à quoi ressemble-t-elle,
    quelle est sa nature ?
  - >-
    L’expérience personnelle nous permet de dire que l’Intelligence Créatrice
    possède une valeur de repos. Lorsque l’esprit progresse vers l’expérience
    de la pure nature de l’Intelligence Créatrice, le corps et l’esprit
    ressentent chacun une influence régénérante de repos.
  - >-
    Le méditant sait d’autre part, toujours sur la base de son expérience
    personnelle, que l’Intelligence Créatrice est dynamique. Suite au contact
    avec la pure nature de l’Intelligence Créatrice, il ressent un plus grand
    dynamisme et expérimente une plus grande réussite dans son activité.
  - >-
    Le repos physique et mental expérimenté au cours de la MT, et le plus grand
    dynamisme expérimenté dans l’activité qui suit la pratique de la MT,
    constituent chacun un des deux aspects de la nature de l’Intelligence
    Créatrice.
  - >-
    Le mouvement vers l’intérieur de la méditation met en évidence la nature
    dynamique non manifestée de l’Intelligence Créatrice, tandis que le
    mouvement vers l’extérieur révèle sa nature dynamique manifestée.
  - >-
    L’expérience de la nature non manifestée de l’Intelligence Créatrice produit
    un état d’éveil au repos simultanément dans le corps et dans l’esprit.
  - >-
    Le repos et l’éveil sont deux valeurs distinctes. De même, le corps et
    l’esprit sont distincts. Toutefois, au cours de la pratique de la MT, le
    corps et l’esprit acquièrent chacun simultanément un état d’éveil au repos.
  - >-
    Les recherches physiologiques et psychologiques confirment le ressenti
    personnel de cet état d’éveil au repos.
  - >-
    La coexistence de l’expérience de la pure nature non manifestée de
    l’Intelligence Créatrice et de l’expérience de ses valeurs manifestées au
    niveau de la pensée et de l’action révèle le caractère intégrateur de
    l’Intelligence Créatrice. Elle intègre le progrès et l’évolution simultanés
    de tous les aspects de la vie physique et non physique.
  - >-
    Cette nature intégratrice de l’Intelligence Créatrice est en même temps
    évolutive. En effet, l’intime interdépendance du corps et de l’esprit permet
    à la vie d’évoluer comme un tout. Les mécanismes de l’intégration sont
    identiques à ceux de l’évolution.
  - >-
    Les valeurs d’évolution de l’Intelligence Créatrice en nous-mêmes et ses
    valeurs d’évolution dans la création sont liées, car la même Intelligence
    Créatrice est responsable de l’évolution individuelle et des
    transformations de l’ensemble de l’univers.
  - >-
    La conscience individuelle peut s’élever jusqu’à la conscience cosmique,
    qui guide la destinée de l’évolution de tout l’environnement. En conscience
    cosmique, l’évolution individuelle et l’évolution de l’environnement se
    réalisent pleinement dans un seul et même processus. C’est ce qu’on appelle
    « utiliser la pleine valeur de l’Intelligence Créatrice ».
  - >-
    Nous savons que l’Intelligence Créatrice existe et nous en avons examiné la
    nature. Une autre question se pose : que réalise-t-elle ? Que peut-elle nous
    apporter ?
  - >-
    L’expérience personnelle montre que le contact avec l’Intelligence Créatrice
    développe la santé, la clarté d’esprit, la créativité et inspire un
    comportement plus harmonieux.
  - >-
    Vers quel but conduit donc l’expérience de la pure nature de l’Intelligence
    Créatrice ?
  - >-
    L’expérience de la pure nature de l’Intelligence Créatrice conduit vers des
    niveaux de plus grande énergie et de plus grande intelligence. Elle conduit
    à des actions plus satisfaisantes, à des accomplissements plus gratifiants.
    Elle conduit l’homme à la demeure de toute connaissance.
  - >-
    L’expérience de la pure nature de l’Intelligence Créatrice fait évoluer
    l’homme vers des valeurs enrichies de la vie et donne accès au but même de
    la vie : une réalisation et un bonheur illimités.

questions:
  - question: >-
      Quelles sont les deux manières de vérifier l’existence de l’Intelligence
      Créatrice ?
    answer: >-
      L’observation du monde phénoménal et l’expérience directe du champ pur de
      l’Intelligence Créatrice par la pratique de la technique de MT.
  - question: >-
      Quels aspects de l’Intelligence Créatrice sont mis en évidence par les
      deux mouvements intérieur et extérieur du processus de MT ?
    answer: >-
      Le mouvement vers l’intérieur met en évidence sa nature dynamique non
      manifestée, tandis que le mouvement vers l’extérieur révèle sa nature
      dynamique manifestée.
  - question: >-
      Quelle est la première qualité de l’Intelligence Créatrice que l’esprit
      expérimente au cours du processus de MT ?
    answer: "La qualité de repos."
  - question: >-
      Vers quel but nous conduit la croissance cumulative de l’Intelligence
      Créatrice à travers la pratique régulière de la MT ?
    answer: >-
      À la conscience cosmique, c’est-à-dire un état dans lequel la vie
      individuelle est vécue au diapason de la vie universelle.
  - question: >-
      Quelle fonction joue l’Intelligence Créatrice dans la vie cosmique ?
    answer: >-
      Elle est responsable de l’évolution de toute chose dans la création.
  - question: >-
      Comment peut-on montrer que l’éveil au repos expérimenté durant la MT est
      la base de la plénitude ?
    answer: >-
      L’état d’éveil au repos est la base d’un projet bien pensé. Un projet bien
      pensé est la base d’une action efficace. L’action efficace est la base
      d’une réalisation efficace, et la réalisation efficace est à son tour la
      base de la plénitude.
  - question: >-
      Comment la pensée est-elle reliée à la source de l’Intelligence Créatrice ?
    answer: >-
      Chaque pensée jaillit de la source de l’Intelligence Créatrice, car la
      source de la pensée est la source de l’Intelligence Créatrice.
  - question: "Expliquez l’expression : « L’Intelligence Créatrice est intégratrice »."
    answer: >-
      Elle agit simultanément et harmonieusement à tous les niveaux de la vie.
  - question: >-
      Comment la pratique de la MT nous fait-elle faire l’expérience de cette
      qualité intégratrice de l’Intelligence Créatrice ?
    answer: >-
      Le méditant intègre progressivement la double expérience de la pure nature
      non manifestée de l’Intelligence Créatrice, expérimentée dans le processus
      d’intériorisation, et des valeurs manifestées de l’Intelligence Créatrice,
      expérimentées dans le processus d’extériorisation.
  - question: >-
      Comment le méditant fait-il l’expérience du caractère évolutif de
      l’Intelligence Créatrice en lui-même ?
    answer: >-
      À travers la MT, il fait l’expérience d’une croissance de la clarté de sa
      pensée, d’une meilleure santé, d’une plus grande créativité et d’une
      harmonisation de son comportement.
  - question: >-
      Pourquoi Maharishi conclut-il la leçon 1 en affirmant que la vie ne
      devrait pas être une lutte ?
    answer: >-
      La vie ayant naturellement tendance à croître et à évoluer, nous pouvons
      conclure qu’elle ne devrait pas être une lutte. L’objectif de la SIC est
      de découvrir pourquoi le but de toute évolution, le bonheur profond,
      demeure hors de portée de l’humanité.

place_de_la_lecon:
  - >-
    Cette leçon est la première à faire référence à l’expérience personnelle du
    nouveau méditant pour établir la connaissance de l’Intelligence Créatrice.
    Jusqu’ici, la connaissance était essentiellement intellectuelle. Cette
    leçon permet à l’étudiant de comprendre sa propre expérience de
    l’Intelligence Créatrice. Cette compréhension est le fondement de la
    connaissance de l’Intelligence Créatrice sur lequel toutes les leçons à
    venir viendront s’appuyer.
  - >-
    La compréhension du caractère intégrateur et évolutif de l’Intelligence
    Créatrice, de sa double nature manifestée et non-manifestée, et de la valeur
    pratique de l’expérience directe, est fondamentale pour les leçons
    suivantes.
  - >-
    Par ailleurs, la démarche scientifique constitue une garantie de fiabilité
    dans cette quête de la connaissance. Elle dote le chercheur d’une torche qui
    lui épargne de nombreux errements dans l’obscurité. Dans la démarche
    scientifique, chaque progrès s’appuie sur l’expérience. L’expérience est à
    la fois le but de la connaissance scientifique et le moyen de créer la base
    solide pour le développement de nouvelles étapes de progrès.
  - >-
    Cette leçon « La connaissance de l’Intelligence Créatrice par l’expérience
    personnelle » est le laisser-passer qui permet de progresser dans la
    connaissance de la SIC. Cette leçon trace une voie qui conduit jusqu’au but
    du cours tout entier.
