schema_version: 1

lesson:
  number: 18
  course: "Science de l'Intelligence Créatrice"
  title: "Considération des autres systèmes"
  language: fr

points_principaux:
  - "La nature et l'aspiration de la MT et des autres systèmes de développement."
  - "Sens, intellect, émotions, recherche de la valeur ultime."
  - "La valeur non-manifestée de l'IC est stimulée par le vent de la vie et inspirée en vagues de progrès."
  - "La valeur non-manifestée de l'IC est animée."
  - "Nécessité d'un système qui transcende sa propre activité, afin de développer la pleine valeur de l'IC."

resume_long:
  - "La MT, aspect pratique de la SIC, est le système le plus efficace, naturel et universel grâce auquel tout homme peut s'élever au plein potentiel de l'IC, et ainsi aider toute société, toute nation, à s'élever elle-même à son plein potentiel."
  - "La MT constitue un système tout à fait naturel, spontané, automatique, qui tient compte de la nature même de la vie. Tout autre système de développement, qui serait aussi naturel et spontané, ne peut être que celui-là.\n\nPuisque la MT constitue un système complètement naturel, tout ce qui en est différent ne sera pas non plus aussi naturel. N'étant pas si naturel, un autre système ne pourra couvrir toutes les lois de la nature et, par conséquent, ne sera pas aussi universel ni aussi efficace."
  - "En fin de compte, tout système qui se veut tout-englobant vise à découvrir la pleine valeur de l'IC et à en dériver un épanouissement total de la vie, la pleine possibilité de l'existence, la pleine croissance de l'intellect et des qualités du coeur. Nous voulons maintenant considérer ceci: savoir si, oui ou non, les autres systèmes rendent justice à leurs aspirations concernant le plein épanouissement de l'IC."
  - "Il peut y avoir d'innombrables systèmes visant à s'enquérir de la profondeur de la réalité d'un objet ou d'un phénomène. Partant de n'importe quel élément de la création, on peut cerner le constituant ultime de la création, c'est à dire la Valeur non manifestée, illimitée de l'IC par n'importe quel moyen d'observation et d'expérience: les cinq sens de perception, l'intellect ou les émotions. Les différents systèmes de développement que le monde a connu dans les temps passés impliquaient un ou plusieurs de ces trois niveaux: sensoriel, intellectuel et émotionnel."
  - "Dans tous les domaines de perception (qu'il s'agisse du plan sensoriel, intellectuel ou émotionnel), il y a toujours une tendance à vouloir pénétrer profondément dans la réalité et, si possible, localiser l'ultime. La connaissance ne désire rester incomplète à aucun niveau. Toute méthode d'observation vise à une connaissance complète de l'objet de perception: toute expérience veut être profonde et pénétrer la valeur ultime de la perception. L'intellect aspire à pénétrer, analyser, pour savoir si les choses sont vraies, réelles. Les sentiments veulent sonder la profondeur de la réalité dans chaque relation."
  - "Ce qui bloque ce processus d'investigation de la réalité ultime dans le domaine des sens, de l'intellect ou des émotions, c'est le défaut de plein développement des sens: ils peuvent pénétrer jusqu'ici, mais pas plus loin. L'intellect - de par l'absence de plein développement - peut discriminer et analyser jusqu'à un certain point, mais pas plus; le défaut du plein développement de la valeur émotionnelle de la vie restreint les sentiments à une certaine limite, et ils ne peuvent aller plus loin. Ce manque de plein développement des sens, de l'intellect et des émotions est dû au fonctionnement anormal, ou sous-normal, du système nerveux."
  - "Le système nerveux humain possède la capacité de permettre aux sens, à l'intellect et aux émotions de fonctionner si pleinement et si complètement, qu'ils puissent saisir la réalité dans toute sa profondeur et localiser l'ultime. Donc, si le système nerveux peut fonctionner normalement, sans aucune restriction, la perception sera assez aiguisée pour pénétrer jusqu'à la valeur la plus profonde de l'objet et le connaître à partir de ce niveau; l'intellect sera assez aiguisé et aura assez d'envergure pour localiser la valeur ultime et connaître la réalité au plan de la compréhension intellectuelle; les émotions seront assez denses pour ressentir profondément la réalité et localiser l'ultime au plan des sentiments."
  - "Les tensions et la fatigue empêchent le fonctionnement normal du système nerveux. Par conséquent, tout système qui aspire à posséder un moyen d'observation ou d'expérience assez efficace pour cerner la valeur ultime de l'IC doit être à même d'éliminer les tensions, la fatigue et les anomalies du système nerveux, l'inspirant ainsi à fonctionner normalement. Tout système capable d'éliminer les tensions est par là-même un système qui favorise des possibilités de plus en plus grandes de vivre des valeurs plus élevées de l'IC dans la vie quotidienne."
  - "Tous les systèmes de développement de la vie par des moyens sensoriels, intellectuels ou émotionnels trouvent leur origine dans le fonctionnement naturel de la vie."
  - "Le domaine tout entier de la perception - utilisant les sens, le domaine tout entier des relations - utilisant le coeur, tous les domaines de connaissance utilisant l'intellect titillent la valeur non manifestée de l'IC, l'inspirent à sortir."
  - "Lorsque nous considérons la valeur de la vie, nous découvrons le désir d'exister ensemble, de croitre ensemble, de vivre ensemble dans la plénitude."
  - "L'IC se développe donc par tous les éléments naturels des différents aspects de la vie. Mais le moyen fondamental pour développer l'IC consiste à animer sa valeur non manifestée en y amenant notre conscience. Tous ces moyens d'acquérir la connaissance - les sens, l'intellect, les émotions - ne sont effectifs que dans la mesure où le système nerveux est capable de répondre. Si le système nerveux est restreint dans son fonctionnement, alors l'impulsion de perception, l'impulsion de pensée, l'impulsion de sentiment ne pénètrent pas assez profondément pour animer la valeur non manifestée de l'IC.\n\nCes impulsions ont quelque influence sur la vie, mais pas tout à fait assez pour animer la base de toute créativité, la source de la pensée."
  - "Tout système qui n'anime pas directement la valeur non manifestée de l'IC ne peut éliminer les tensions et la fatigue du système nerveux, et tout système qui ne peut raffiner le système nerveux ne vaut pas la peine."
  - "La fondation du développement de la créativité est la valeur non manifestée de l'IC. Donc si nous pouvons maitriser la croissance de l'IC à partir de sa source, de sa base, nous aurons en main la pleine possibilité d'enrichir toutes les expressions de l'IC, le domaine tout entier de l'activité. Si nous désirons grandir, si nous désirons nous épanouir dans la pleine valeur de la vie par l'activité, nous devons alors nous rendre au domaine de repos absolu et commencer notre activité à partir de là: l'activité doit partir du silence absolu, et alors le domaine tout entier de l'activité sera animé."
  - "Rien de ce sur quoi nous pouvons agir, au plan de l'activité, n'atteindra la valeur non manifestée de l'IC, parce que l'activité est l'expression de l'IC. Par conséquent, tout système - peu importe qu'il implique les sens, l'intellect ou les émotions - qui ne transcende pas sa propre activité et ne parvient pas à cette valeur ultime de repos, ne sera pas apte à développer la pleine valeur de l'IC."
  - "Ainsi, tous ces systèmes qui agissent au plan horizontal de l'activité système d'analyse intellectuelle, de contemplation ou concentration, systèmes qui défendent l'activité comme moyen d'évolution - ne font que gratter la surface dans l'espoir de développer l'IC. L'éducation est restée au plan intellectuel, plan de la valeur exprimée de l'IC, au lieu d'avoir été établie dans sa valeur non manifestée; par conséquent, elle n'a pas pu structurer la conscience dans la pleine valeur de l'IC."
  - "Nous trouvons donc ceci: tout système qui ne transcende pas la perception, tout système qui ne transcende pas l'activité intellectuelle, tout système qui ne transcende pas l'activité émotionnelle n'atteint pas la racine de la vie. Il n'atteint pas le domaine non manifesté de la pure IC, à partir duquel s'enrichissent toutes les expressions de l'IC dans le champ tout entier de l'activité. Par conséquent, n'importe quel système de ce genre ne suffira pas pour développer l'IC. Tout système qui transcende sa propre activité\n\nperceptuelle, sa propre activité intellectuelle et sa propre activité émotionnelle sera la MT elle-même."

questions:
  - question: "Quels sont les trois éléments essentiels que doit comprendre un procédé permettant de vivre la pleine valeur de l'IC?"
    answer: "1 - La conscience doit faire l'expérience de la pure nature de l'IC. 2 - La conscience doit faire l'expérience de la manière dont l'IC se développe. 3 - L'intellect doit connaître les principes qui promeuvent cette expérience et ce développement."
  - question: "Quel est le but de tous les systèmes?"
    answer: "Une pleine connaissance de l'objet de perception ou de l'activité."
  - question: "Pourquoi le caractère naturel de la MT est-il un avantage?"
    answer: "La MT est à même de couvrir toutes les lois de la nature: elle est, par conséquent, universelle, toute-englobante et efficace."
  - question: "Quels seront les désavantages d'un système qui ne serait pas aussi naturel que la MT?"
    answer: "Il ne sera pas aussi complet, tout-englobant, universel ou efficace."
  - question: "Le défaut de plein développement de l'un des modes d'acquisition de la connaissance - sens, intellect ou sentiments - bloquera tout procédé d'investigation. Quelle est la cause commune d'un tel manque?"
    answer: "Un fonctionnement anormal ou sous-normal du système nerveux, causé par des tensions ou par la fatigue."
  - question: "Quelle est la contrepartie positive de la normalisation du système nerveux réalisée par l'élimination des tensions et de la fatigue?"
    answer: "La croissance de l'IC."
  - question: "Dé quoi un système doit-il être capable pour donner la connaissance et développer pleinement tous les modes par lesquels la connaissance s'acquiert?"
    answer: "Affiner le système nerveux: développer pleinement l'IC."
  - question: "Quelle exigence fondamentale tout système doit-il remplir pour développer pleinement l'IC?"
    answer: "° Il doit avoir la capacité d'animer la valeur non manifestée de l'IC en y amenant notre CONSCIENCE,"
  - question: "Quel est le moyen le plus rapide d'animer la valeur non manifestée de l'IC?"
    answer: "Affiner le système nerveux grâce à l'expérience directe de la pure IC."
  - question: "Les améliorations de tout domaine de la vie (relations, perception, compréhension, sentiments) entreprises grâce à des systèmes qui ne raffinent pas directement le système nerveux sont semblables au fait d'arroser les feuilles d'une plante. Pourquoi?"
    answer: "Parce que seule la valeur de surface est touchée, au point d'application."
  - question: "Qu'est-ce qui arrive à l'activité perceptuelle, intellectuelle et émotionnelle dans un système qui arrose la racine, c'est-à-dire anime la valeur non manifestée de l'IC?"
    answer: "Elle est transcendée,"
  - question: "Quel est donc le critère fondamental par lequel on puisse juger de la valeur d'un système?"
    answer: "Transcende-t-Il sa propre activité?"

place_de_la_lecon:
  - "Dans cette leçon nous constatons que la Méditation Transcendantale est le moyen le plus efficace pour développer le plein potentiel de l'individu. Dans une vue d'ensemble sur les autres systèmes qui essayent de développer les valeurs potentielles de l'individu, Maharishi met en évidence le fait que tout système qui ne permet pas de transcender l'intellect, les sens, les sentiments est sans intérêt. Si un système ne raffine pas le système nerveux en procurant un profond repos et ne transcende pas l'activité, alors ce système n'a aucun moyen pour éliminer les obstacles qui empêchent le développement total du potentiel. La Méditation Transcendantale est donc le système le plus naturel parce qu'il reçoit le soutien des lois de la nature. Il transcende les modes d'activité: sens, intellect et émotions."
  - "Cette leçon est précieuse en ce sens qu'elle épargne notre énergie et notre temps en montrant clairement l'efficacité et l'universalité de la Méditation Transcendantale. Elle abat d'un seul coup les bataillons de l'ignorance. Cela nous permettra d'aborder les leçons suivantes l'esprit en repos, libre de doute, sachant qu'aucun autre système à notre disposition aujourd'hui ou demain ne présente autant d'efficacité que la Méditation Transcendantale."
  - "Nous émettons l'espoir que tous les systèmes se purifient et viennent se réchauffer à la gloire de la Science de l'Intelligence Créatrice."
