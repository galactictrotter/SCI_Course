schema_version: 1

lesson:
  number: 21
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et la solution à tous les problèmes"
  language: fr

points_principaux:
  - "Les problèmes proviennent de la faiblesse - la faiblesse individuelle, en d'autres termes: une conscience étroite et restreinte."
  - "La base de la force, c'est un esprit pleinement développé."
  - "Tout individu peut prendre contact avec cette source de force, profondément en lui-même."
  - "La SIC offre une formule permettant de développer le plein potentiel de l'esprit; elle fournit ainsi une solution unique à tout problème."
  - "Dans le processus de développement de l'IC, les résistances au succès s'éliminent d'elles-mêmes et un environnement plus favorable se crée spontanément."
  - "On doit maintenant partager cette connaissance, afin que la souffrance puisse disparaître dès cette génération."

resume_long:
  - "Problème signifie faiblesse, ce qui veut dire que tous les problèmes ont leur base dans la faiblesse, ils proviennent de la faiblesse et se développent dans la faiblesse. Ceci vaut pour tout problème dans n'importe quel domaine: social, politique, technologique, scientifique, individuel, national."
  - "Nous avons vu que toute faiblesse, dans la vie, peut se ramener à une faiblesse de la conscience individuelle. Si l'esprit est faible, les aspirations, les efforts, les accomplissements et les satisfactions sont également faibles. Cet état sous-développé de l'esprit constitue un terrain fertile pour le foisonnement des problèmes."
  - "La SIC donne la connaissance du potentiel infini de l'esprit, et elle fournit aussi une technique grâce à laquelle tout individu peut développer son esprit sans effort et naturellement. Par le total développement de l'IC dans l'esprit de l'individu, la base de tout problème - la faiblesse individuelle - peut s'éliminer et faire place à la force individuelle, laquelle contribuera à une vie libre de tout problème."
  - "Puisque la faiblesse individuelle - bouillon de culture de tout problème - consiste en une conscience étroite et restreinte, il apparaît donc comme immédiatement nécessaire d'élargir notre état d'esprit, d'agrandir la conscience en permettant simplement à l'IC de se développer en nous, ceci afin de surmonter tout problème. Celui qui a une vision large saisit un horizon étendu et résout les problèmes avant même qu'ils ne se manifestent comme tels. La vision s'élargit, l'esprit se dilate grâce à l'expérience du contact conscient avec le réservoir infini de l'IC, situé à la source de la pensée."
  - "Un esprit élargi est un esprit plus fort; un esprit plus fort nous fait d'abord voir la futilité des problèmes, ensuite un chemin facile pour en sortir. En conséquence, nous devenons plus pratiques, nous réussissons davantage, et nous acquérons une plus grande vigilance, une plus grande compréhension. Telle est l'expérience de milliers de personnes pratiquant la MT dans le monde entier. Nous ne nous sentons plus bloqués ou crispés, tandis que des horizons de plus en plus larges s'ouvrent à nous, et nous nous sentons portés par la vie."
  - "Tandis que l'IC devient plus ample et plus abondante, les résistances au succès s'éliminent d'elles-mêmes et un environnement plus favorable se crée\n\nspontanément. Cette solution à tous les problèmes, donnée par la pratique régulière de la MT, ressemble au fait d'arroser seulement la racine, et enrichir des milliers de feuilles et de pétales. Par l'efficacité de cette unique opération, tous les domaines de la vie sont libérés des problèmes et des contraintes. Nous n'avons pas le temps de nous attarder sur chaque feuille. Mais, en arrosant la racine, c'est-à-dire en opérant au niveau causal de la vie, on peut éliminer tous les effets et symptômes de la faiblesse, et réaliser ainsi le bien-être de toute la plante, c'est-à-dire de la totalité de la vie, de façon naturelle."
  - "Si l'on éprouve quelque sentiment de se trouver dans les problèmes à quelque niveau que ce soit - individu, société, nation, monde, univers - ce sentiment provient d'une faiblesse individuelle. Et puisque l'IC imprègne toute chose, chaque individu peut ainsi contacter ce domaine de toute force, profondément en lui-même, et renforcer spontanément le développement de l'IC dans ces domaines. La technique de MT, aspect pratique de la SIC, constitue un moyen naturel, simple, spontané et aisé pour acquérir la force intérieure; grâce à cette force-là, nous pouvons nous débarrasser de tout problème."
  - "Les ténèbres disparaissent dès qu'il y a de la lumière. Ce principe doit être appliqué à la question des problèmes. Les problèmes s'évanouissent dès que l'IC se développe. C'est dans la SIC que nous trouvons cette règle d'or permettant de créer des individus pleinement développés: et c'est grâce à leur conscience élargie que des problèmes vieux comme le monde, de délinquance, de crime, de mésentente, de conflits et de guerres pourront disparaître. Viendront alors une société, des nations et un monde où les problèmes n'existeront plus. Dans l'âge scientifique et hautement technologique où nous vivons, nous avons besoin d'hommes forts, c'est-à-dire capables de mettre fin à cette histoire chaotique du passé: en effet, maintenant dans cette génération-ci, chacun dispose d'un procédé aisé et universel lui permettant de mettre fin à toute faiblesse en ouvrant sa propre conscience au champ abondant de l'IC. Et les résultats scientifiques constituent une garantie de l'efficacité de cette formule."
  - "Grâce au Plan Mondial, il est possible d'avoir partout un nombre suffisant de professeurs de SIC; cette connaissance pourra ainsi être donnée à chacun, de telle sorte que chaque individu, chaque société, chaque nation croisse jusqu'à son plein potentiel, éliminant du même coup tout problème de la vie. Même si les ténèbres dues au crime et à tous les problèmes chroniques de l'humanité ont perduré si longtemps, l'aube doit venir et répandre partout la lumière. La croyance, vieille comme le monde, selon\n\nlaquelle la vie est une lutte s'évanouira dans cette lumière. Ce malentendu concernant la nature de la vie doit maintenant cesser, même s'il s'est maintenu souvent au nom de Dieu et de la religion. Précisément dans cet âge scientifique, on a développé une technologie naturelle permettant d'utiliser la nature même de la vie pour l'amener à son plein épanouissement, et ceci grâce à une technique parfaite par laquelle on agit de moins en moins tout en accomplissant davantage et davantage."
  - "Une technique - comme celle du levier, par exemple - est un moyen de faire quelque chose qui semblait, auparavant, impossible. C'est la connaissance mise en application dans la pratique. Voici une technique: la Méditation Transcendantale, et voici une connaissance: la connaissance systématique de l'IC. En nous servant des deux à la fois, nous pouvons automatiquement ouvrir notre conscience à l'IC illimitée, et ainsi nous sentir chaque jour en meilleure santé et plus calme. La pensée et le sentiment que cela est impossible disparaissent, maintenant tout nous devient possible. Ainsi, d'énormes possibilités s'ouvrent à chaque individu, comme celles discutées dans la leçon: Vision des possibilités offertes par la pratique de la SIC."
  - "La connaissance doit être maintenant partagée, ainsi la souffrance finira-t-elle dans cette génération. Les gouvernements sont tout-puissants: ils font les lois, imposent des punitions aussi extrêmes que la mort, fournissent des environnements et un système d'éducation particulier, car ils disposent de\n\nl'assentiment de la nation et contrôlent ses ressources. Quel que soit le parti auquel il appartient, le dirigeant d'une nation se verra penser, au moins dans ses moments les plus tranquilles, « Que puis-je faire de plus pour mon peuple? ». Il en est ainsi parce que dans ce moment précieux, lorsque son esprit est frais, il a conscience de sa responsabilité envers son peuple. Cette aspiration, qui est celle de tout chef de famille, de société, de nation, peut être à présent pleinement satisfaite par la connaissance de la SIC."
  - "La bonne volonté des Nations Unies et des chefs d'état se dissipe à cause de conflits qui s'élèvent sans cesse dans tous les coins du monde. Il suffit pourtant de faire une seule chose: déraciner la cause commune de toutes ces infections; autrement, cette tradition des infections continuera. On ne peut laisser à des esprits non cultivés la responsabilité de questions aussi importantes que la paix sur la terre. Cela coûte trop cher. Il y a une condition initiale malsaine et, à moins qu'on ne fasse quelque chose de radical, elle se manifestera n'importe quand, à l'improviste. Le Plan Mondial est ce quelque chose de radical qui atteint la racine même de ces infections, ces mésententes. Depuis la chaire de la SIC, nous apprécions\n\nchaleureusement les efforts de tous ceux qui tentent de développer la force de l'individu dans la société; avec assurance, nous leur présentons ce procédé naturel qui permet de liquider tous les problèmes, qu'il s'agisse de la santé, de questions nationales ou internationales, de l'éducation, de l'économie, ou de quoi que ce soit d'autre. Le développement d'individus solides se fera sentir à tous les niveaux de la société et dans le monde entier."
  - "Peu importe qu'une nation soit dans l'affluence, ou en voie de développement, car où que nous tournions notre attention, il y a de la souffrance. Cela nous montre en tout cas que l'économie actuelle se résume en une faillite complète. Riches ou pauvres, tous les pays ont à faire face à quelque genre de souffrance. Des hommes intelligents perdent leur temps à déplorer la situation écologique, l'éducation, la politique; dans tous les domaines, ils évaluent l'étendue de la faillite, et ceci au moment même de l'histoire où la SIC nous est donnée pour amener l'humanité de la souffrance au bonheur total. Grâce à cette connaissance, cette génération murmurera la force à tous ceux qui suivront. Murmurer la force, cela veut dire éliminer la racine des problèmes, au lieu de perdre du temps à les analyser; cela veut dire faire de la lumière au lieu d'étudier les ténèbres. Ces conférences mondiales et ces professeurs d'université doivent savoir qu'il existe un enseignement et une technique permettant d'éliminer la racine même de tout problème: il faut en effet reconnaître qu'il y a là des gens puissants, très bien intentionnés, de grands esprits qui ont passé leur temps à étudier des problèmes d'écologie, d'éducation. de santé, de religion. bref, des problèmes de toute sorte. Il n'est plus besoin pour eux de déplorer tel problème, d'en calculer l'ampleur, etc., car il y a maintenant une solution. Il suffit d'allumer la lumière de la SIC et de développer ainsi, systématiquement, la force de chacun grâce à sa pratique, la MT, et tous les problèmes s'évanouiront."

questions:
  - question: "Dans quelles conditions les problèmes existent-ils?"
    answer: "Les problèmes s'élèvent dans la faiblesse."
  - question: "Qu'est qui rend l'individu faible?"
    answer: "Les limites de l'esprit, l'étroitesse et les restrictions de l'esprit individuel."
  - question: "Quelle est la base de Ja force?"
    answer: "La base de la force, c'est l'IC qui se développe, un esprit développé, une conscience élargie, un état d'esprit très ouvert."
  - question: "Quelle est la base de la solution à tout problème?"
    answer: "Tout problème plonge ses racines dans la faiblesse. Mais toutes les faiblesses disparaissent lorsque l'esprit s'élargit, et lorsque l'IC se développe de plus en plus grâce à la pratique de la MT°"
  - question: "Que devrait faire une personne qui se sent faible?"
    answer: "Toute personne qur se sent faible devrait immédiatement contacter le réservoir de l'IC."
  - question: "Donner un exemple du principe dit du second élément."
    answer: "Si nous sommes dans les ténèbres, faites de la lumière."
  - question: "Dans quel but le Plan Mondial a-t-il été créé?"
    answer: "Le Plan Mondial a pour but d'éliminer tous les problèmes à tous les niveaux de la vie - individuel, social, national, international - et d'en finir avec les problèmes du crime, de la délinquance, etc."
  - question: "Quel est le but d'une technique?"
    answer: "faire moins et accomplir plus."
  - question: "Quel est le résultat de l'utilisation combinée de la connaissance et de la technique de la SIC?"
    answer: "Tous les problèmes tels que crime, délinquance disparaissent lorsque chacun gagne en force grâce au développement de l'IC. On accomplit ce but grâce au procédé spontané, sans effort par la connaissance de la SIC."
  - question: "Comment un chef de famille, de communauté, de nation peut-il accomplir le maximum pour ceux dont il est responsable?"
    answer: "Il peut leur apporter la plénitude en leur faisant connaitre la connaissance et la pratique de la SIC."
  - question: "Pourquoi, jusqu'à présent, les efforts d'hommes puissants et de bonne volonté n'ont-ils pas réussi à alléger la souffrance de l'humanité?"
    answer: "Parce que leurs efforts traiter les symptômes de la souffrance au lieu d'en attaquer la véritable cause, à savoir: la faiblesse individuelle."

place_de_la_lecon:
  - "Comme nous l'avons vu dans les leçons précédentes, le progrès vers une plénitude plus grande obtenue grâce à la pratique régulière de la MT dépend de ceci: que l'esprit fasse l'expérience de sa propre nature essentielle. L'esprit, sur la base de cette nature, est capable de refléter l'illimité de l'IC en alternant l'expérience des limites et de l'illimité grâce à cette pratique. Cette alternance d'expérience élargit la vision, agrandit et renforce l'esprit en contactant le réservoir infini de l'IC qui réside en chaque individu."
  - "L'individu est l'unité de base de la société. Toute qualité possédée par l'individu se reflète sur une plus large échelle au sein de la société. Ainsi, en renforçant l'individu, par la connaissance et la pratique de la SIC, nous prenons le chemin direct pour renforcer la communauté, la nation et le monde."
  - "Les problèmes proviennent de la faiblesse. Ils se développent dans la faiblesse. Ceci s'applique à tous les genres de problèmes: sociaux, politiques, individuels, et nationaux. Si l'individu est faible, cette faiblesse se reflétera dans tout son environnement. La force, également, se reflète dans toutes les directions à la fois. Comme nous l'avons vu dans cette leçon, l'IC pleinement développée constitue la base de la force. Un homme ayant cette conscience élargie saisit un horizon plus vaste et résout les problèmes dans l'œil, c'est-à-dire en les éliminant avant même qu'ils n'aient eu le temps d'apparaître."
  - "Puisque la connaissance et la pratique de la SIC développent l'IC jusqu'à sa plénitude, il en découle que la SIC constitue une solution immédiate à tous les problèmes de la vie."
  - "Le but même de l'étude de l'IC - sous forme scientifique - consiste à développer la capacité d'utiliser spontanément la pleine valeur de l'IC, lorsque c'est possible. Cette leçon, mettant en lumière la pure valeur de l'IC, sous-jacente à tous les processus évolutifs, cette valeur de l'IC dans notre conscience. Elle annonce une seule solution à tous les problèmes de la vie. Elle réalise ainsi le but du cours tout entier. La chaleur de la connaissance de cette leçon anime l'esprit du cours tout entier."
