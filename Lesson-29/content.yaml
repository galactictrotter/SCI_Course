schema_version: 1

lesson:
  number: 29
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et les approches verticales et horizontales de la connaissance"
  language: fr

points_principaux:
  - "Le fait de gagner la connaissance a pour but de se familiariser avec l'entière étendue de la vie, des limites à l'illimité, en sorte que la vie soit vécue dans la plénitude."
  - "Pour atteindre son but, la connaissance doit s'élargir à la fois horizontalement et verticalement."
  - "La SIC ouvre notre conscience à la pleine valeur de la connaissance, sur ces deux plans - horizontal et vertical - et nous établit dans l'état de plénitude."
  - "La pénétration verticale dans la signification sous-jacente et dans les lois d'un domaine d'étude quelconque soutiennent l'expansion horizontale de ta connaissance dans ce domaine."

resume_long:
  - "La connaissance a pour but de rendre le cheminement du connaisseur infaillible, rapide et satisfaisant - trois choses. À un certain point, le connaisseur devient acteur, et à un autre, il est comblé par le résultat de l'action. Nous avons vu que la plénitude provient de l'accomplissement, celui-ci résultant d'une action fondée sur la connaissance. Chacun doit donc avoir au moins assez de connaissance pour connaître le succès, et ce succès doit être rapidement concrétisé dans le fruit de l'action, qui est la plénitude. Gagner au jeu de la vie dépend donc de ce que nous savons, de la quantité de connaissance acquise. Aussi, partout, la tradition veut que nous recevions à l'école, dès nos jeunes années, autant de connaissance que possible, de par les règles de la société, etc. On donne une éducation universelle qui servira de base pour des études plus poussées, de sorte que succès et progrès soient assurés. Les écoles, collèges et universités n'existent que par le rôle vital que joue la connaissance dans la réussite de la vie. Dans cette situation, le système permettant de gagner la connaissance se doit d'être aussi profond, englobant et parfait que possible."
  - "La connaissance est la base du succès dans la vie. Elle doit donc être à portée de main dans sa pleine étendue, manifestée et non-manifestée, à l'intérieur des limites et illimitée, à la surface et dans les profondeurs de la vie, en sorte que le champ tout entier de la connaissance soit à la disposition de notre esprit conscient. Nous devons connaître les mécanismes de la nature entière, savoir comment ses lois fonctionnent et comment tirer profit de ces lois, afin que chacune de nos actions soient en accord avec ces lois, soient toujours justes et menant au progrès, lequel résulte dans la plénitude. Toute loi de la création, qu'elle soit du domaine de la chimie, de la physique, de la biologie, de l'astronomie, par exemple, existe et opère dans son champ spécifique; chacune progresse elle-même, est facteur de progrès, et favorise les étapes successives de l'évolution."
  - "Les lois sont semblables à des poteaux indicateurs, pour ceux qui viennent dans leur territoire ou champ d'influence. Chacune a son propre territoire, ses propres limites. Du fait que la vie progresse, elles conduisent à des territoires plus larges, à des domaines plus vastes, jusqu'à ce que les limites soient avalées dans l'infini illimité de la vie. Une impulsion spécifique d'IC agit à l'intérieur d'un espace restreint, mais progresse bientôt pour rencontrer l'illimité dont elle est issue. Son étendue va d'ici à ici, de l'infiniment petit évoluant jusqu'à l'infiniment grand.\n\nLa valeur manifestée de l'IC s'étend à un vaste horizon, dans l'espace et le temps, et c'est à travers elle que vole le jet du progrès - de la source à la plénitude. Source et plénitude sont une seule et même chose."
  - "Se familiariser avec toutes les lois que l'on rencontrera à chaque étape du progrès, se familiariser avec l'étendue tout entière de l'évolution, de telle façon que nous ne soyons jamais retardés et ne nous sentions jamais étrangers à n'importe quelle étape, tel est le but pour lequel nous gagnons la connaissance, tel est le but de l'éducation. Une telle connaissance représente un passeport valide sur le chemin rapide, progressif, de l'évolution vers la plénitude. Devenir homme de connaissance par cette connaissance, cela veut dire que toute notre activité est spontanément progressive et ne rencontre aucune interdiction sur son chemin vers la plénitude; en effet, elle adoucit le cheminement de la vie, à la surface dans sa variété, et dans son unité en profondeur, pour qu'il fonctionne de manière à inclure tout. Pour que soit maintenu son caractère tout-inclusif, la connaissance doit être acquise sur les deux plans: horizontal et vertical,"
  - "C'est avec la connaissance qu'est né le connaisseur. Seul le connaisseur peut aller dans la bonne direction. Il arrive que l'ignorance suive par hasard la bonne direction, mais elle n'est pas juste en général. Le connaisseur né d'une connaissance tout-englobante maintient une activité qui aboutit à la réalisation personnelle et à la plénitude dans les domaines relatif et suprême de la vie. Les valeurs de surface et les valeurs les plus profondes y sont toutes comprises."
  - "Dans tout système d'éducation, dans tout système pour gagner la connaissance que l'histoire ait connu, on a exigé ce caractère tout-englobant, à savoir que la connaissance soit significative sur les deux plans, horizontal et vertical. Même avant l'époque de l'étude interdisciplinaire, cette exigence était présente en toute discipline. La capacité d'aller plus à fond dans la signification apparaît clairement dans l'histoire de Newton et de la pomme. Chaque élément de connaissance a des valeurs plus profondes. L'extension horizontale de toute discipline est maintenue par la pénétration verticale dans sa signification et ses lois sous-jacentes. Dans l'examen d'un problème complexe de mathématique, par exemple, l'intellect s'apaise et sonde plus profondément jusqu'à ce que la solution se manifeste. Dans tout domaine d'étude, il y a une tendance à ce que la connaissance s'élargisse à la fois verticalement et horizontalement."
  - "L'élargissement de la connaissance en extension comme en profondeur, dépend de la clarté de l'esprit et de sa capacité à apprendre rapidement. En relâchant tensions et contraintes, la pratique de la SIC fait tant de bien à l'esprit et au corps que le temps de réaction et la capacité d'apprendre sont améliorés, l'état général de l'esprit s'améliore, comme le montrent les expérimentations dans le domaine de la psychologie. Gagner la connaissance sur les deux plans dépend de l'état de l'esprit - de son envergure et de sa capacité d'attention. Un esprit profondément reposé peut sonder chaque chose profondément pour découvrir la réalité de ce qui était jusqu'alors inconnu et l'amener à la surface de l'esprit conscient. La spécificité de la SIC tient en ce qu'elle rend notre conscience capable de cerner la pleine valeur de la connaissance sur les deux plans: horizontal et vertical."
  - "La SIC apporte cette plénitude si nécessaire aux deux approches de la connaissance: elle les emporte toutes deux au-delà de leurs limites extrêmes, jusqu'à l'illimité transcendantal. Ce but fondamental de tout système pour gagner la connaissance n'a pas changé dans l'histoire, mais la SIC l'accomplit et l'amène à la plénitude. Elle nous rappelle que la connaissance est là pour le connaisseur, et elle nous donne les moyens d'établir ce connaisseur dans l'état de plénitude en ouvrant sa conscience individuelle à la demeure de toute connaissance."
  - "Toutes les valeurs, verticales et horizontales, résident dans la demeure de toute connaissance, dans leur plénitude; et la demeure de toute connaissance est édifiée dans le coeur et l'esprit de chacun grâce à la pratique et l'étude de la SIC."

questions:
  - question: "Quel triple devoir la connaissance doit-elle accomplir afin que le connaisseur progresse?"
    answer: "Le but de la connaissance est de rendre le chemin du progrès infaillible, rapide et source de plénitude pour le connaisseur."
  - question: "De quoi dépend le fait de gagner au jeu de la vie?"
    answer: "Gagner au jeu de la vie dépend de ce que l'on sait, de la quantité de connaissance que l'on possède."
  - question: "Quel est le but de la connaissance en ce qui concerne les lois de la Nature?"
    answer: "Nous devrions connaître les lois de la nature, Savoir comment elles fonctionnent, comment en tirer profil, afin que toutes nos actions Soient en accord avec elles."
  - question: "Vers quel but la vie progresse-t-elle?"
    answer: "Des limites étroites à des limites plus étendues, la vie va vers les plus larges limites, pour atteindre la valeur infinie, illimitée de la vie."
  - question: "En termes d'évolution et de progrès, quel est le but de l'éducation et dans quel but gagne-t-on fa connaissance?"
    answer: "Le fait de gagner la connaissance ainsi que l'éducation ont pour but de se familiariser avec l'étendue tout entière de l'évolution, avec toutes les lois que nous rencontrons à chaque étape du progrès, afin de n'être jamais comme un étranger, et n'être jamais retenus à quelque étape du progrès."
  - question: "Que signifie \"l'exigence que la connaissance soit tout-englobante\"?"
    answer: "Cela veut dire que la connaissance doit être concernée à la fois par les valeurs de surface et par les valeurs les plus profondes de la vie. Elle doit englober l'étendue tout entière de la vie."
  - question: "Comment définissons-nous le plan \"horizontal\" de la connaissance?"
    answer: "La connaissance née de la perception directe évidente d'un phénomène. La connaissance acquise par l'observation du monde phénoménal."
  - question: "Quelle est la fonction du plan \"vertical\" de la connaissance?"
    answer: "Toute discipline a une valeur horizontale, de surface: celle-ci s'appuie sur des significations plus profondes, une connaissance de valeurs beaucoup plus fondamentales. Au plan vertical, la connaissance soutient tout élément du plan horizontal."
  - question: "De quoi dépend l'épanouissement de la connaissance aux plans horizontal et vertical?"
    answer: "Il dépend de la clarté de l'esprit, de son pouvoir de compréhension, de sa capacité à apprendre rapidement et à se focaliser profondément."
  - question: "Quelle est en cela, la spécialité de la SIC?"
    answer: "La SIC rend notre conscience capable de saisir la pleine valeur de la connaissance sur les deux plans - horizontal et vertical. Elle les prolonge tous deux au-delà de leur extrême limite, jusqu'à l'illimité transcendantal."

place_de_la_lecon:
  - "La SIC est fondée sur la connaissance. Il n'est donc pas surprenant que cette leçon révèle la relation et l'importance des deux approches horizontale et verticale de la connaissance, ceci afin de tirer profit des deux valeurs de l'IC, manifestée et non-manifestée. Dans toutes ses leçons, la SIC révèle le rôle et les mécanismes de l'IC, telle qu'elle les manifeste dans la réalité du monde phénoménal. La gloire de cette leçon consiste à mettre en lumière un aspect de la connaissance qui n'a pas été exploré jusqu'ici. Le mot \"science\" veut dire \"connaissance\". La SIC et les approches verticale et horizontale de la connaissance donnent la pleine connaissance de la valeur totale de la vie, ce qui inclut la connaissance elle-même. Cette leçon, toute particulière, est ainsi utile à la valeur du cours tout entier."
  - "Alors que nous entendons parler de cette valeur plus fondamentale de la connaissance, nous commençons à voir, au sein de la valeur de surface de la vie, ce qui est communément au-delà de notre conscience. Cette indispensable leçon accomplit le but le plus élevé de la SIC simplement en écoutant et en regardant: elle dilate les limites de notre conscience individuelle jusqu'aux confins sans limite de l'Absolu. Elle entame le dernier mouvement d'une oeuvre d'art d'une beauté infinie en laquelle l'humanité entière se réjouira pour toutes les générations à venir. Cette leçon est semblable à une supernova dans l'univers de ce cours."
