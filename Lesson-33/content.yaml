schema_version: 1

lesson:
  number: 33
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et la Plénitude de la vie, génération après génération"
  language: fr

points_principaux:
  - "Une génération vivant dans la plénitude établira les fondations pour la\n\nplénitude de toutes les générations à venir."
  - "Le professeur de Science de l'Intelligence Créatrice structure la plénitude\n\npour toutes les générations:\n- en vivant et en rayonnant la pleine valeur de la vie\n- en murmurant la connaissance suprême de la vie\n- en maintenant la pureté et la vitalité de la connaissance\n- en animant en chaque homme la pleine valeur de l'Intelligence Créatrice"
  - "Le Plan Mondial a été structuré pour apporter cette plénitude à toutes les générations."

resume_long:
  - "Après avoir examiné tous les aspects différents de la Science de l'Intelligence Créatrice, nous désirons maintenant voir comment les immenses possibilités qu'elle nous offre peuvent être acquises par tous, et en tout temps. Une seule génération d'individus pleinement développés est suffisante pour que toutes les générations à venir soient pleinement développées, et une seule génération demeurant dans l'ignorance de cette connaissance suprême suffirait à maintenir toutes les générations futures dans l'ignorance. En maintenant la pureté et la vitalité de l'enseignement, génération après génération, les professeurs de Science de l'Intelligence Créatrice assureront la vie dans la plénitude, génération après génération."
  - "Il semble que cette génération soit la première dans la longue histoire de la race humaine qui grandisse dans la connaissance de la Science de l'Intelligence Créatrice. La nature de la Science de l'Intelligence Créatrice est telle qu'elle ouvre à chaque coeur et à chaque esprit la pleine valeur de cette connaissance suprême qui, dans le processus même de son développement, cultive tous les aspects de la vie, en sorte que la plénitude de la vie soit spontanément vécue par chacun en tout temps et en tout lieu. Si telle est la nature et l'influence de la connaissance de la Science de l'Intelligence Créatrice, il sera seulement nécessaire de la partager avec tous les peuples de cette génération afin d'établir de solides fondations pour un système d'enseignement qui maintiendra la pureté de la connaissance pour toutes les générations à venir."
  - "Avec l'établissement de M.I.U. dans toutes les parties du monde, l'enseignement de la Science de l'Intelligence Créatrice sera maintenu dans sa pureté, et sa pureté lui gardera sa force afin que les effets de la connaissance suprême puissent être apportés à chaque coeur et à chaque esprit. Avec la révélation de la connaissance de la Science de l'Intelligence Créatrice et parce que cette connaissance est par nature progressive et auto-évoluante, un organisme s'est manifesté pour maintenir sa pureté et sa plénitude et un plan est né qui rendra efficace cette organisation pour chaque homme dans le monde."
  - "Dès que nous acquérons la connaissance de la Science de l'Intelligence Créatrice, nous désirons immédiatement la partager avec les autres. Dès l'instant où nous faisons l'expérience de la valeur illimitée de la vie, nous prenons conscience que d'autres continueront à souffrir inutilement de génération en génération, et nous désirons que tout le monde sache qu'il\n\nexiste un domaine illimité d'Intelligence Créatrice, profondément à l'intérieur de nous, qui peut être développé de façon systématique en utilisant la nature même de l'esprit. Sachant par expérience combien il est facile d'ouvrir notre conscience à ce domaine fondamental de la vie, nous désirons que chacun puisse faire cette expérience, afin que tous les aspects de la vie soient enrichis."
  - "Seule l'ignorance des possibilités infinies qui résident au sein même de la nature de la vie, l'ignorance de la manière simple et naturelle de développer ces possibilités par la pratique de la Science de l'Intelligence Créatrice, cela seul a maintenu les gens dans la souffrance. À présent cette connaissance, demeurée longtemps cachée, est disponible pour chaque homme, connaissance suprême par nature, suprême par sa valeur et par ses effets. À mesure que la connaissance se développe, la vie évolue, à mesure que l'on acquiert davantage la connaissance de la Science de l'Intelligence Créatrice, les valeurs les plus élevées de la vie se développent spontanément. Cette connaissance suprême structure spontanément la vie dans ses valeurs croissantes jusqu'à ce que la pleine évolution soit atteinte."
  - "Pleine évolution, cela signifie que nous sommes pleinement évolués et que nous possédons la capacité de murmurer la façon d'obtenir la pleine évolution à n'importe qui. Le professeur de la Science de l'Intelligence Créatrice n'est pas seulement le \"connaisseur\", mais aussi l' \"exposant\" de la pleine valeur de la vie. Il enseigne par l'exemple, par son silence. La qualité pleinement développée de l'aptitude à enseigner est comme un signal de la pleine valeur de l'évolution. On est professeur dans la mesure où l'on irradie l'harmonie totale qui est la valeur infinie de l'Intelligence Créatrice. Le professeur est comme une coupe pleine qui déborde dans toutes les directions du goût somptueux et merveilleux de l'infini."
  - "Dans l'enseignement de la Science de l'Intelligence Créatrice, le plein développement de la personnalité, qui est le signe du plein développement de l'Intelligence Créatrice, ne veut pas seulement dire, utiliser notre plein potentiel - vivre en bonne santé, une vie normale, en pleine conscience, et agir spontanément de la façon la plus juste et la plus efficace - mais aussi, utiliser nos capacités pour apporter cet état de plénitude aux autres. Le professeur de la Science de l'Intelligence Créatrice connaît et vit la pleine valeur de la vie et irradie cette connaissance dans tous les aspects de la vie. L'évolution se réjouit en lui, et par lui la connaissance de l'évolution rapide est transmise aux autres. Dans cette qualité pleinement développée de l'aptitude à enseigner, réside l'efficacité de la Science de l'Intelligence Créatrice, pour maintenir la vie dans la plénitude, génération après génération."
  - "Parce que la connaissance de la Science de l'Intelligence Créatrice est tellement complète et spontanément utile pour établir la vie dans le but du progrès, il est très simple et naturel, pour un professeur développé de la Science de l'Intelligence Créatrice, d'en apporter la lumière aux autres. Toute souffrance et défaut de plénitude dans la vie appartiennent au domaine de l'ignorance, et la lumière de la Science de l'Intelligence Créatrice élimine l'obscurité de l'ignorance. L'illumination est une situation naturelle dans laquelle la vie est vécue, et par conséquent il est naturel pour quelqu'un qui vit dans la lumière de la vie, dans sa plénitude, de rayonner les étincelles de la vie et porter la lumière au coeur de ceux qui l'entourent."
  - "Le Plan Mondial est né de la nature progressive et auto-régénératrice de l'Intelligence Créatrice. Lorsque de nombreuses personnes, dans toutes les parties du monde, eurent expérimenté que la Science de l'Intelligence Créatrice peut apporter la pureté, le progrès et la plénitude à la vie, il était naturel qu'une organisation formule un Plan afin de former des professeurs de la Science de l'Intelligence Créatrice pour toutes les parties du monde. De cette façon, la connaissance suprême a trouvé sa propre solution pour apporter ses bénédictions à tous et partout."
  - "Grâce au Plan Mondial, chaque groupe d'un million de personnes disposera d'un Centre de formation de professeurs de Science de l'Intelligence Créatrice et chaque Centre formera mille professeurs de Science de l'Intelligence Créatrice. Ceci donnera partout un professeur de Science de l'Intelligence Créatrice pour une population de mille personnes. Dans peu de temps cette connaissance suprême sera partagée par tous les hommes et toutes les femmes de cette génération, ainsi s'élèvera l'aube de l'espoir d'une vie accomplie, génération après génération."
  - "Le Plan Mondial sera facile à réaliser parce que le centre de la connaissance de la Science de l'Intelligence Créatrice est déjà présent, déjà vivant, et fonctionne dans la conscience de chacun d'entre nous. Il suffit de le stimuler pour qu'il s'élève à sa pleine valeur, et ceci se réalisera par la pratique de la Science de l'Intelligence Créatrice."
  - "Une vie de plénitude pour toutes les générations, cela dépend de la vitalité des professeurs de Science de l'Intelligence Créatrice: aussi longtemps qu'ils seront tous en fonction, qu'ils agiront harmonieusement et maintiendront la pureté de l'enseignement en suivant les mêmes principes et les mêmes processus, la vitalité et la force de l'enseignement se maintiendront. Le mélange des valeurs s'accroît très rapidement dans le monde entier, aussi, afin de préserver la pureté et la vitalité de l'enseignement de la Science de l'Intelligence Créatrice, il est essentiel que chaque professeur s'en tienne aux\n\nprincipes qui lui ont été prescrits pour enseigner. De cette façon, chaque professeur de Science de l'Intelligence Créatrice profitera de la force de trois mille six cent professeurs dans le monde et dans deux ou trois ans, chaque professeur profitera de la force de trois millions six cent mille professeurs dans toutes les parties du monde."
  - "Aussi longtemps que l'unité de l'enseignement sera maintenue dans toutes les parties du monde, sa pureté et sa force seront maintenues, et ceci renforcera les coeurs et les esprits de tous et en tout lieu. L'ennemi de la connaissance, l'ignorance, qui a voilé la vie de tous les peuples pendant des générations dans le passé, tremblera d'entendre progresser les pas de la connaissance répandue par les professeurs de la Science de l'Intelligence Créatrice dans toutes les parties du monde."
  - "Il faut qu'il y ait un processus et des étapes échelonnées pour parvenir à la connaissance, et un effort de coopération pour maintenir l'uniformité des leçons dans toutes les générations afin que toutes les populations du monde aient la liberté d'acquérir la même plénitude de sagesse de la Science de l'Intelligence Créatrice, où que l'on soit, aujourd'hui ou demain. Le Plan Mondial permet à chaque homme d'acquérir facilement la même connaissance suprême où qu'il se trouve. Il est donc vital que les professeurs de la Science de l'Intelligence Créatrice maintiennent la pureté de cette connaissance, génération après génération, afin d'assurer une vie de plénitude, de génération en génération."

questions:
  - question: "Ayant compris et expérimenté ce qu'est la Science de l'Intelligence Créatrice, où devons-nous maintenant porter notre action?"
    answer: "Il est logique d'examiner si toutes ces possibilités gigantesques, illimitées que nous ouvre la Science de l'Intelligence Créatrice pourront toujours être acquises par tous et en tout temps."
  - question: "Pourquoi avons-nous étudie en profondeur dans les leçons précédentes la valeur suprême de la connaissance?"
    answer: "Dans ces leçons, nous avons étudié en détail la qualité de la connaissance et la valeur suprême de cette connaissance afin d'étendre à l'infini l'éventail des possibilités de chacun dans la vie."
  - question: "En considérant la Science de l'Intelligence Créatrice à la lumière de ses effets sur la connaissance, quel effet spontané ont cette connaissance et cette science sur la vie de chacun?"
    answer: "La nature même de la Science de l'Intelligence Créatrice est telle qu'elle ouvre chaque cœur et chaque esprit à la pleine valeur de la connaissance, et il devient possible à chacun, en tout lieu et en tout temps, de vivre la plénitude de la vie."
  - question: "Dites en quelques mots et simplement ce qu'il faut faire pour établir une fondation solide à un système d'enseignement de telle sorte que cette connaissance se perpétue intégralement de génération en génération?"
    answer: "Il faut simplement que cette connaissance soit partagée par tous."
  - question: "Sur le plan pratique de l'organisation, comment cette connaissance sera-t-elle transmise aux générations futures?"
    answer: "On a dit de la Science de l'Intelligence Créatrice qu'elle se régénérait et se perpétuait d'elle-même. Par l'établissement de M.I.U. dans toutes les parties du monde, la pureté de l'enseignement de la Science de l'Intelligence Créatrice sera spontanément préservée."
  - question: "Quel est le seul facteur extérieur nécessaire pour faire usage de l'Intelligence Créatrice?"
    answer: "Aucun facteur extérieur n'est nécessaire, mais l'on doit savoir comment utiliser la nature interne de l'Intelligence Créatrice."
  - question: "Outre le fait qu'il connait la Science de l'Intelligence Créatrice, quel est l'autre attribut du professeur de Science de l'Intelligence Créatrice?"
    answer: "I n'est pas simplement le connaisseur, mais aussi le porte-parole de la pleine valeur de la vie. La qualité totalement développée d'enseignant est la marque de la pleine valeur de l'évolution."
  - question: "Quelle promesse pour le futur le professeur de Science de l'Intelligence Créatrice tient-il?"
    answer: "Le professeur de Science de l'Intelligence Créatrice remplit la promesse d'une vie vécue dans la plénitude, de génération en génération."
  - question: "Quelles sont les deux qualités de l'Intelligence Créatrice à l'origine du plan mondial?"
    answer: "Le plan mondial est né de la nature progressive et auto-évolutive de l'Intelligence Créatrice."
  - question: "En termes de population, quelle est la structure de base du Plan Mondial?"
    answer: "Chaque groupe d'un million d'habitants aura un centre de formation de professeurs de Science de l'Intelligence Créatrice et chaque Centre formera mille professeurs de Science de l'Intelligence Créatrice."
  - question: "Une fois que les professeurs de Science de l'Intelligence Créatrice seront établis, combien faudra-t-il de temps pour que la connaissance suprême soit partagée par tous?"
    answer: "Dès qu'une société aura un professeur de Science de l'Intelligence Créatrice pour mille habitants, alors en six mois ou un an, la valeur de la connaissance sera partagée par tous les hommes et toutes les femmes de cette génération."
  - question: "Qu'est-ce qui va garder force et vitalité à la Science de l'Intelligence Créatrice partout, maintenant et dans toutes les générations à venir?"
    answer: "Aussi longtemps que les professeurs de Science de l'Intelligence Créatrice exerceront leur fonction harmonieusement; aussi longtemps que chaque professeur maintiendra dans son secteur la pureté de l'enseignement; aussi longtemps que chaque professeur maintiendra dans son secteur la même forme et les mêmes principes d'enseignement, alors l'enseignement restera vivant et solide. Aussi longtemps que l'enseignement sera identique dans toutes les parties du monde, la pureté de l'enseignement sera préservée et, dans chaque région, la force de l'enseignement renforcera la psychologie et les sentiments des individus partout dans le monde."
  - question: "Comment sont reliés le Plan Mondial et la Connaissance Suprême?"
    answer: "Dans le monde entier le Plan Mondial apporte à chaque homme, indépendamment du lieu où il se trouve, la possibilité d'acquérir la même connaissance suprême."

place_de_la_lecon:
  - "Tout au long du cours, et par notre propre observation, nous avons vu que la Science de l'Intelligence Créatrice est un domaine d'étude valable et nécessaire - connaissance suprême pour toute l'humanité. Ce que nous avons trouvé dans ces leçons, ce n'est pas une connaissance nouvelle, mais la connaissance d'un horizon nouveau pour tout homme dans le monde - la connaissance qui anime la conscience et y développe la demeure de toute connaissance. Dans cette leçon, il devient clair que la connaissance de l'Intelligence Créatrice évolue par elle-même, se perpétue elle-même et se régénère elle-même; elle se suffit donc tout à fait à elle-même - c'est sans effort qu'elle obtient résidence dans le coeur et l'esprit de chacun. La beauté de cette connaissance tient en ceci: dès qu'un homme la possède, il peut difficilement contenir le désir de la répandre autour de lui. L'être tout entier du professeur de Science de l'Intelligence Créatrice irradie la vérité de la vie, la connaissance suprême de la Science de l'Intelligence Créatrice. Comme le désir de répandre l'enseignement émerge spontanément avec la pratique de la MT, l'organisation permettant de diffuser l'enseignement et de le garder pur, elle aussi, apparaît spontanément. Avec cette organisation, un plan est né, le Plan Mondial, dans le but de transmettre la connaissance à toutes les générations à venir."
  - "Cette leçon constitue un pont indestructible que n'importe quel homme peut franchir, pour quitter les champs dévastés de la souffrance vers les contrées fertiles de la vie béatifique. Grâce au Plan Mondial, on peut facilement diffuser la connaissance de la Science de l'Intelligence Créatrice pour tous et en tout temps. Et grâce à M.I.U., la pureté et la dignité de l'enseignement se maintiendront de génération en génération."
