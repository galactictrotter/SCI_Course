schema_version: 1

lesson:
  number: 6
  course: "Science de l'Intelligence Créatrice"
  title: "Introduction à la Science de l'Intelligence Créatrice"
  language: fr

points_principaux:
  - >-
    Parce que la réussite dans l'action dépend directement de la
    connaissance, celle-ci doit être vraie, englobante, juste, utile -
    scientifique.
  - |-
    L'étude de l'Intelligence Créatrice est scientifique parce que :
    - L'Intelligence Créatrice peut être expliquée logiquement pour satisfaire toute quête intellectuelle.
    - L'Intelligence Créatrice peut être expérimentée directement, dans son état pur.
    - L'Intelligence Créatrice peut être vérifiée objectivement à partir d'expériences reproductibles.
    - L'Intelligence Créatrice peut être exprimée artistiquement dans sa pleine valeur.
    - L'Intelligence Créatrice peut être totalement développée et appliquée par quiconque, dans tous les domaines d'activité.
  - |-
    La Science de l'Intelligence Créatrice offre une connaissance et une expérience :
    - profondes
    - complètes
    - utiles
    - sources de plénitude
    - universelles

resume_long:
  - >-
    La connaissance de l'Intelligence Créatrice tirée de l'observation de la
    création et de l'expérience directe au cours de la MT, peut être vérifiée
    à tous les plans de la vie. C'est ce qui nous permet d'affirmer que nous
    étudions la Science de l'Intelligence Créatrice.
  - >-
    La connaissance est la base de l'action, l'action est la base de
    l'accomplissement, l'accomplissement est la base de la plénitude. Par
    conséquent, puisque la réussite dans l'action dépend directement de la
    connaissance, il est essentiel que celle-ci soit correcte et vraie.
  - >-
    Toute connaissance issue de l'observation peut être trompeuse et
    illusoire.
  - >-
    À notre époque, le critère principal de justesse de la connaissance est
    son caractère scientifique. La connaissance scientifique est
    systématique. Elle se veut une connaissance vérifiable, obtenue au moyen
    d'expérimentations répétables.
  - >-
    Deux attributs confèrent à la connaissance un caractère scientifique :
    le caractère systématique du procédé par lequel cette connaissance est
    obtenue, et la possibilité de vérifier la connaissance ainsi obtenue.
  - |-
    L'étude de l'Intelligence Créatrice est scientifique parce que :
    - L'Intelligence Créatrice peut être expliquée logiquement pour satisfaire toute quête intellectuelle.
    - L'Intelligence Créatrice peut être expérimentée directement, dans son état pur.
    - L'Intelligence Créatrice peut être vérifiée objectivement au moyen d'expériences reproductibles.
    - L'Intelligence Créatrice peut être exprimée artistiquement dans sa pleine valeur.
    - L'Intelligence Créatrice peut être développée pleinement et appliquée par quiconque, dans tous les domaines d'activité.
  - >-
    La connaissance de l'Intelligence Créatrice, obtenue par l'observation de
    la création et par l'expérience directe, peut être vérifiée sur un plan
    subjectif par n'importe qui.
  - >-
    Les changements physiologiques, psychologiques et sociologiques produits
    par la MT possèdent un caractère systématique. Il est possible de les
    reproduire et ils sont ainsi scientifiquement mesurables. La connaissance
    de l'Intelligence Créatrice peut donc être vérifiée objectivement par une
    expérimentation scientifique répétable.
  - >-
    La pratique de la MT est ouverte à l'investigation scientifique en raison
    de la reproductibilité de l'expérience. En effet, n'importe qui peut
    faire l'expérience et vérifier la connaissance de l'Intelligence
    Créatrice ainsi obtenue.
  - >-
    Étant donné que la SIC est une science, les différentes branches du
    savoir peuvent vérifier et confirmer les connaissances qu'elle apporte.
  - >-
    La méthode scientifique est universelle. Elle appartient à tous. La
    Science de l'Intelligence Créatrice démontre que la connaissance de
    l'Intelligence Créatrice est profonde, complète, utile, et source de
    plénitude.
  - >-
    La connaissance de l'Intelligence Créatrice est universelle : elle
    demeure vraie pour tous les hommes de tous les temps. On peut par ailleurs
    la vérifier à tous les niveaux de l'existence : l'environnement, le corps,
    les sens, l'esprit, l'intellect, les émotions, l'ego, l'Être individuel.
  - >-
    Le sommet suprême de la connaissance est atteint lorsqu'on accède à un
    état de la vie dans lequel on agit dans le champ des limites, tout en
    demeurant établi dans la conscience illimitée du champ pur de
    l'Intelligence Créatrice.
  - >-
    Dans cet état, la connaissance se suffit à elle-même, se prouve elle-même
    et se valide elle-même. La valeur suprême de la connaissance de
    l'Intelligence Créatrice possède ainsi un caractère scientifique.
  - >-
    La connaissance de l'Intelligence Créatrice est scientifique. Elle est la
    connaissance suprême du fait qu'elle est vérifiable à tous les niveaux de
    la vie. C'est ce qui nous permet d'affirmer que c'est une Science de
    l'Intelligence Créatrice.

questions:
  - question: "Quels attributs rendent une connaissance scientifique ?"
    answer: >-
      Sa véracité, son infaillibilité, son caractère pratique, le fait qu'elle
      soit fiable et systématique.
  - question: "Quels sont les moyens de la connaissance scientifique ?"
    answer: >-
      L'observation objective, l'expérimentation répétable, la vérification
      par les tests.
  - question: >-
      Comment les méthodes de la connaissance scientifique se retrouvent-elles
      au niveau de la SIC ?
    answer: |-
      - Les effets sont l'objet d'observations objectives.
      - Il y a répétabilité du processus de l'expérience du contact avec la pure nature de l'Intelligence Créatrice.
      - Les résultats de cette pratique ont été vérifiés sur un grand nombre de méditants différents.
  - question: >-
      À quels différents niveaux de l'existence, les effets de la pratique se
      font-ils sentir ?
    answer: >-
      Aux niveaux du corps, des sens, de l'esprit, de l'intellect, des
      sentiments, de l'ego individuel et de l'ego universel.
  - question: >-
      Comment chaque niveau est-il influencé par la pratique régulière de la
      MT ?
    answer: >-
      Le taux métabolique du corps diminue, les sens se tournent vers
      l'intérieur et leur fonctionnement se raffine, atteignant des niveaux
      plus subtils de la conscience, les sentiments deviennent plus stables
      et sont satisfaits, l'intellect devient plus vigilant et augmente son
      aptitude à discriminer, l'ego individuel perd ses limites et
      s'épanouit. Enfin, l'ego universel émerge dans la valeur individuelle,
      au moment où l'on fait l'expérience de l'Être individuel dans l'état
      transcendantal de la conscience.
  - question: >-
      Quelle affirmation simple exprime le mieux la connaissance du champ pur
      de l'Intelligence Créatrice ?
    answer: "Je suis."
  - question: >-
      En quoi la connaissance du champ pur de l'Intelligence Créatrice
      diffère‑t‑elle fondamentalement de l'expérience du champ pur de
      l'Intelligence Créatrice ?
    answer: >-
      La connaissance s'élargit alors que l'expérience ne change pas.
  - question: >-
      À quelle condition la connaissance suprême est-elle sa propre preuve et
      sa propre validation ?
    answer: >-
      Lorsqu'elle est vérifiable à partir de tous les niveaux de la vie,
      demeurant illimitée tout en s'exprimant à travers les limites.

place_de_la_lecon:
  - >-
    Une introduction donne un aperçu général du sujet. Cette leçon -
    Introduction à la Science de l'Intelligence Créatrice - ne fait pas
    exception à la règle en offrant une vision générale de la SIC. Mais cette
    leçon s'attache surtout à démontrer la fiabilité de la connaissance et de
    l'expérience de l'Intelligence Créatrice obtenue au travers d'une Science
    de l'Intelligence Créatrice. Elle vise à éliminer les doutes et le
    scepticisme au sujet de la fiabilité et de l'utilité de cette connaissance.
  - >-
    Maharishi analyse dans cette leçon les caractéristiques de la connaissance
    de l'Intelligence Créatrice. Il en montre la nature scientifique tant sur
    le plan des méthodes d'observation que sur celui de l'expérience sur
    laquelle on s'appuie pour établir cette connaissance. Ainsi cette
    connaissance s'avère-t-elle correcte, fiable, vérifiable, et par
    conséquent scientifique. La Science de l'Intelligence Créatrice satisfait
    le critère fondamental d'une science, qui est la possibilité de vérifier
    l'expérience subjective par une expérimentation reproductible.
  - >-
    La connaissance de la Science de l'Intelligence Créatrice repose ainsi sur
    une base sûre et fiable qui garantit la réussite dans l'action et une
    satisfaction profonde dans la vie. Il est évident que cette leçon est
    fondamentale pour l'ensemble de ce cours.
