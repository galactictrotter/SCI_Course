schema_version: 1

lesson:
  number: 32
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC en tant que connaissance suprême"
  language: fr

points_principaux:
  - "La connaissance constitue le lien entre le connaisseur et l'objet de la connaissance:"
  - "La connaissance est différente dans différents états de conscience. La SIC développe le niveau suprême de la conscience en épanouissant la pleine valeur de l'IC."
  - "La SIC est connaissance suprême pour les raisons suivantes:\n- elle offre un procédé de connaissance qui inclut le plein développement\ndu connaisseur.\n- elle fournit un procédé de connaissance naturel et sans effort, lequel est\nen même temps un procédé permettant de gagner le but de toute connaissance: le progrès et la plénitude.\n- elle fournit, pour gagner la connaissance, un processus qui inclut le\nprocessus de purification du connaisseur.\n- elle rend le connaisseur capable d'évaluer la totalité de l'objet de\nconnaissance et ainsi le rend capable de faire un usage constant et maximum\n\n- de son environnement."

resume_long:
  - "La connaissance constitue le lien entre le connaisseur et l'objet de connaissance. C'est le produit du processus de la connaissance, qui met en relation le connaisseur et l'objet. La connaissance est le produit tout à fait innocent du fait de connaître; le connaisseur projette sa perception sur l'objet, et ce processus s'appelle connaître, apprendre. Ce qu'il apprend est la connaissance de l'objet. La connaissance dépend donc essentiellement de deux choses: le connaisseur et l'objet de connaissance."
  - "La connaissance est différente dans différents états de conscience. Cela veut dire que la qualité, la quantité, la véracité, la validité et la structure de la connaissance dépendent de l'état de conscience du connaisseur - de la quantité d'IC qu'il exprime. Si le sujet change constamment, la connaissance changera, quel qu'en soit l'objet. L'état de l'objet peut également varier - il arrive qu'une orange soit orange et mûre, ou bien qu'elle soit verte et immature. La connaissance dépend donc aussi de l'objet. La connaissance, née du processus qui consiste à connaître, est donc influencée des deux côtés: du côté du sujet et du côté de l'objet."
  - "La pratique de la SIC développe la conscience pure, illimitée, et fait émerger la pleine valeur de l'IC dans la conscience du connaisseur. La conscience s'établit dans un état d'éveil au repos, comme le montrent les recherches scientifiques. Dans cet état, le connaisseur exprime une IC maximum et il est pleinement capable d'évaluer l'objet, car la pleine évaluation de l'objet se fonde sur la pleine conscience du sujet. Lorsque la conscience du connaisseur est pleinement développée dans la conscience pure, illimitée, alors cet état alerte de l'esprit et du coeur vécu pleinement par le connaisseur peut évaluer la pleine valeur de l'objet. Dans cette relation du sujet à l'objet, la connaissance est pleine. Nous appelons la SIC connaissance suprême du fait qu'elle élève ensemble le connaisseur et son évaluation de l'objet jusqu'au niveau suprême de l'infini."
  - "On ne peut apprécier la pleine valeur de l'objet à moins de saisir sa valeur non manifesté, illimitée en même temps que ses valeurs de surface. Lorsque\n\n- ces deux types de la valeur de l'objet (exprimée et non exprimée) se\nmaintiennent dans la conscience du connaisseur, celui-ci apprécie alors la pleine valeur de l'objet. Ce n'est possible que lorsque le connaisseur est pleinement développé. Le champ omniprésent de l'intelligence pure constitue la réalité ultime de tout objet. Dans la création, tout objet est l'expression de l'intelligence non exprimée, illimitée; ainsi la connaissance de l'objet n'est complète que lorsque la conscience de cet illimité non manifesté ne se perd\n\npas dans l'acte de perception des valeurs de surface de l'objet. Seule une telle connaissance complète sera source de plénitude pour le connaisseur."
  - "Nous découvrons, par l'observation et l'analyse intellectuelle, que l'Intelligence pure constitue la valeur la plus profonde de tout objet; mais cette conclusion intellectuelle n'a pas de réalité, en tant qu'état réel de connaissance, à moins que le connaisseur ne soit capable de la ressentir réellement, c'est-à-dire à moins que la connaissance ne devienne réalité vivante pour le connaisseur. Quand cette valeur omniprésente de la pure intelligence s'établit dans notre conscience de façon permanente, grâce à la pratique de la SIC: la valeur la plus profonde de tout objet devient alors réalité vivante pour le connaisseur; la connaissance complète de toute chase prend vie. Dans cet échange, souffle vivant entre sujet et objet, nous trouvons la floraison de la connaissance; le processus de la connaissance atteint sa plénitude lorsque le lien de la connaissance, unissant le connaisseur et l'objet, prend vie."
  - "Dans cet état de connaissance complète, apparaît une similitude ou identité, dans la profondeur même de l'objet et au niveau de la conscience du sujet. C'est l'union produite par la connaissance: l'union du sujet avec l'objet. Lorsque la connaissance contient assez de vie pour mettre en relation la pleine valeur de l'objet, alors le sujet, établi dans l'intelligence pure, illimitée, découvre la ressemblance de son être déjà présent en tout aspect de l'objet; et l'unité apparaît."
  - "La SIC établit le connaisseur dans cet état de conscience où il est un avec l'objet de connaissance; le connaisseur connaît l'objet si complètement qu'aucun aspect - grossier, subtil ou transcendantal - n'en demeure caché à sa cognition. La SIC rend ainsi le connaisseur capable de posséder le plein épanouissement de la connaissance; elle établit en outre une relation complète entre sujet et objet."
  - "Nous appellerons désormais la connaissance complète connaissance suprême du fait que le but de toute connaissance, la plénitude, se réalise dans le processus même d'acquisition de la connaissance. La connaissance\n\n- suprême est ce qui satisfait le but de l'acte de connaître chez le connaisseur,\ndans sa relation à l'objet, et ceci sans faire grand-chose. Pour gagner la connaissance, la SIC offre un procédé naturel, spontané et dépourvu d'effort; or ce procédé permet simultanément d'atteindre la plénitude. C'est pourquoi la SIC est connaissance suprême."
  - "La beauté et la gloire de la SIC tiennent en ceci: alors même qu'elle commence à révéler les valeurs les plus profondes de l'objet, elle commence\n\négalement à éliminer les blocages sur le chemin de la connaissance - les tensions et la fatigue. Le processus de la connaissance inclut donc le processus de purification qui améliore spontanément la qualité du connaisseur, et par là son évaluation de l'objet. Dans le processus de connaissance, le connaisseur devient à la fois plus pur et plus libre par rapport aux obstacles bloquant sa liberté de connaître. La pratique de la SIC améliore simultanément la qualité du connaisseur et sa capacité à évaluer l'objet; le connaisseur s'établit enfin de manière permanente dans la conscience illimitée et peut alors apprécier l'objet dans sa valeur illimitée."
  - "La SIC engage le connaisseur dans l'exploration des valeurs les plus fines de la perception; elle le régénère ainsi dans son statut infini, le rend capable de connaître l'objet dans sa valeur infinie. Nous appelons la SIC connaissance suprême parce qu'elle offre un procédé spontané, naturel et sans effort qui, d'un seul mouvement, élève le connaisseur, son évaluation de l'objet de connaissance et enfin la connaissance elle-même au niveau suprême de l'infini."
  - "Le bénéfice de toute connaissance consiste à se sentir chez soi (familier) avec toute chose. Lorsque le connaisseur peut évaluer la totalité de l'objet, sa conscience reste spontanément au niveau de l'objet qui est alors le plus utile et le plus bénéfique. Voila l'application pratique de la connaissance suprême. Entre les niveaux grossier et transcendantal de l'objet, il en existe beaucoup d'autres, tels les niveaux moléculaire, atomique et subatomique; chacun de ces niveaux possède sa propre étendue et son implication en différents domaines de la vie. Lorsque la conscience du connaisseur s'ouvre à tous ces différents niveaux, il peut alors agir à tel niveau de l'objet qui s'avérera le plus utile dans telle circonstance particulière; par conséquent il pourra, toujours et partout, faire un usage maximum de n'importe quel objet d'expérience. La SIC rend ainsi le connaisseur capable de faire l'usage maximum de son environnement, en tout temps et en tout lieu. Tel est le don immense de la connaissance suprême."
  - "Grâce à la SIC, c'est un puissant ordinateur que l'on construit dans la conscience du connaisseur; c'est pourquoi nous appelons la SIC connaissance suprême. Aucune autre connaissance n'est à même d'établir le connaisseur sur ce piédestal élevé de vie, d'où il sera à même de faire le meilleur usage possible de n'importe quoi, n'importe où et n'importe quand. Cette connaissance suprême, qui possède le but de toute connaissance programmée en elle-même, est mise à la portée de chacun grâce à la connaissance et à la pratique de la SIC."

questions:
  - question: "Comment les processus de perception et de connaissance sont-ils reliés?"
    answer: "Le connaisseur projette sa perception sur les objets, et cette projection de sa conscience s'appelle processus de connaissance."
  - question: "D'après les expérimentations scientifiques, et d'après l'expérience personnelle, dans quel état notre conscience s'établit-elle par la pratique de la SIC?"
    answer: "Les expérimentations scientifiques ont confirmé l'expérience personnelle en montrant que la conscience s'établit dans ce que nous appelons l'éveil au repos. Dans cet état, l'harmonie sous-jacente devient manifeste dans le domaine des différences."
  - question: "Quelle capacité de perception est nécessaire à la pleine appréciation d'une rose?"
    answer: "La pleine appréciation d'une rose réside dans la capacité à apprécier la valeur de surface de la perception sensorielle, et en même temps de percevoir le champ subtil de FI, lequel peut saisir la valeur non manifesté de la sève fde la vie)."
  - question: "Quel statut de la connaissance représente l'expression « la pleine appréciation »?"
    answer: "Si le connaisseur est pleinement développé, la pleine valeur de l'objet est à sa portée."
  - question: "A quel point peut-on dire que la connaissance de l'objet est complète?"
    answer: "La connaissance de l'objet n'est complète que lorsque la valeur non manifestée, illimitée de l'intelligence devient tout aussi apparente que les valeurs de surface dans la perception de l'objet. Cela revient à dire que lorsque nous évaluons la valeur de surface exprimée de l'objet, la valeur non manifestée de toutes les qualités de l'intelligence pure est elle-même ouverte à notre vision."
  - question: "Quelle est la valeur la plus profonde de tout objet?"
    answer: "L'intelligence pure."
  - question: "A quel point du développement de notre conscience la connaissance complète de toute chose devient-elle vivante?"
    answer: "La valeur la plus profonde de tout objet devient réalité vivante pour le connaisseur, et la connaissance complète de toute chose prend vie pour lui lorsque sa conscience grandit et s'établit de manière permanente dans cette valeur d'intelligence pure partout présente dans la création."
  - question: "Quelle situation la SIC crée-t-elle chez le connaisseur pour rendre possible cette plénitude de connaissance?"
    answer: "Chez le connaisseur, la SIC créé spontanément un état de conscience qui lui permet d'apprécier la pleine valeur de l'objet de connaissance. La SIC structure spontanément chez le connaisseur la capacité d'avoir la pleine connaissance de tout ce qu'il désire savoir."
  - question: "Dans l'étude de la SIC, quelle relation y a-t-il entre le procédé pour gagner la connaissance et le processus de purification du connaisseur?"
    answer: "Le procédé de développement de la connaissance inclut le processus de purification; celui-ci améliore spontanément la qualité du connaisseur, et du même coup son évaluation de l'objet. La voie à suivre pour gagner la connaissance établie par la SIC est telle que le processus de connaissance inclut le processus de purification du connaisseur. Le connaisseur devient ainsi plus pur, plus libre à l'égard des obstacles bloquant sa liberté de connaître, grâce au processus de connaissance lui-même."
  - question: "Comment la pratique de la SIC rend-elle le connaisseur capable de connaître l'objet dans sa valeur infinie?"
    answer: "La pratique de la SIC engage le connaisseur dans l'exploration des valeurs plus fines de perception: elle le régénère ainsi. C'est en régénérant le connaisseur qu'elle le rend capable de connaître l'objet dans sa valeur infinie."
  - question: "Pourquoi appelons-nous la SIC connaissance suprême?"
    answer: "Nous appelons la SIC connaissance suprême tout simplement parce qu'elle consiste en un procédé spontané, naturel, innocent et sans effort pour gagner la connaissance; grâce à ce procédé, la connaissance atteint sa valeur la plus pleine lorsque le sujet et son évaluation de l'objet s'élèvent au niveau suprême de l'infini."
  - question: "Quel bénéfice pratique apporte la connaissance suprême?"
    answer: "La connaissance suprême nous rend capable d'évaluer l'objet dans sa totalité et de faire ainsi un usage maximum de notre environnement en tout temps et en tout lieu."

place_de_la_lecon:
  - "La SIC établit la vie à un niveau de connaissance qui est plein et complet. Dans cette leçon, nous avons vu comment la SIC nous élève jusqu'à cette connaissance suprême en élevant le niveau du connaisseur jusqu'à son statut infini et en le rendant capable d'évaluer l'objet de connaissance dans sa valeur infinie. Le sujet et l'objet sont unis au niveau de l'IC pure - demeure de toute connaissance. C'est ce qui fait de la SIC le niveau de connaissance le plus élevé."
  - "La pratique de la SIC nous donne cette très pleine connaissance de manière innocente et facile. Elle purifie en même temps le connaisseur, et élimine tous les obstacles à l'expansion de la connaissance. Cette plénitude de connaissance nous permet d'utiliser notre environnement au maximum et de réaliser le but le plus élevé de l'éducation. La SIC constitue donc tout à la fois le moyen de gagner la connaissance et d'accomplir le but de toute connaissance: être à l'aise avec toute chose. Grâce à la sagesse contenue dans cette leçon, notre vie peut être vécue au niveau de la connaissance suprême."
  - "Cette leçon révèle toutes les implications de notre étude de la SIC, et nous donne une parfaite compréhension de l'accomplissement le plus élevé dans la quête de la connaissance. Non seulement cette leçon nous révèle la sève pure de l'arbre de la connaissance, mais elle nous donne une claire compréhension pour vivre cette pure essence de connaissance en toute plénitude. Cette leçon 32 est le sommet de la montagne où tout le cours nous a conduit."
