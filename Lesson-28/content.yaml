lesson:
  number: 28
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC et les études interdisciplinaires"
  language: fr

points_principaux:
  - "Les études interdisciplinaires sont nées du besoin d'intégrer les diverses branches de la connaissance."
  - "Le but de l'étude interdisciplinaire est de: '> créer un homme pleinement développé\n- le rendre capable de vivre le bénéfice de toute connaissance\n- le rendre efficace dans tous les domaines"
  - "La base commune à toute connaissance est le champ d'intelligence, que représente le connaisseur."
  - "La SIC réalise le but de l'étude interdisciplinaire car:\n- elle établit la base commune de toutes les disciplines au niveau de notre\npropre conscience\n- elle structure le but de toute connaissance - la plénitude - en tout coeur et\nen tout esprit\n- elle édifie une demeure de toute connaissance en chaque homme"
  - "La connaissance interdisciplinaire fondamentale de la SIC peut développer la capacité d'accomplir une action multiphasée, qui donne spontanément satisfaction dans toutes les directions."

resume_long:
  - "Lorsque les responsables de l'éducation ont réalisé que l'étude de différents sujets ne suffit pas à développer l'homme de manière pleine, responsable et sincère et, quel que soit le sujet d'étude ou le courant de connaissance dans lequel on évolue, que l'on n'a pas ensuite le succès attendu pour maîtriser les phases diverses de la vie, un remède fut suggéré: on l'appela « étude interdisciplinaire ». Certes, l'étude de chaque discipline aidera l'homme à être plus efficace dans une avenue particulière de la vie; il est toutefois physiquement impossible pour un être humain d'étudier chaque discipline."
  - "Écoles et universités ouvrent tous les canaux de connaissance aux étudiants,\n\nmais, comme aucun étudiant ne peut en tirer pleinement avantage à cause du facteur temps, quelques institutions éducatives offrent des programmes combinés de plusieurs disciplines; et c'est une tentative de plus pour approcher l'idéal, c'est-à-dire former un homme pleinement éduqué. Cette étude interdisciplinaire représente une grande avancée dans le domaine de l'éducation, mais ne développe pas l'homme pleinement. La quête ne sera jamais satisfaite tant que l'on n'aura pas mis au point un système d'éducation grâce auquel la base de toute connaissance peut être amenée à la conscience de chacun. Lorsque cette caractéristique commune à toutes les branches d'étude sera assimilée au niveau de la conscience de chaque étudiant, le but de l'étude interdisciplinaire sera lui-même accompli."
  - "Les aspirations de l'homme sont infinies et illimitées: à moins que l'éducation ne développe la capacité de satisfaire à tous les désirs, comment peut-on affirmer qu'elle est satisfaisante? Si un homme, convenablement éduqué selon les systèmes en vogue, demeure insatisfait, mécontent et privé de la plénitude, à quoi bon perdre son temps pour une telle éducation? Tout le problème de la plénitude repose sur le pivot de la connaissance, parce que la connaissance est la base de l'action, l'action la base de la réalisation personnelle, et la réalisation la base de la plénitude. Si la connaissance est incomplète, la vie sera une recherche non plénifiée; on marchera sans cesse, mais sans jamais arriver, on avancera vers le but, mais sans jamais l'atteindre. Par conséquent, un système d'éducation digne de ce nom doit offrir une connaissance qui soit profonde et complète, autrement il ne produira pas ce qui est le but même de l'éducation: des hommes et des femmes de connaissance vivant dans la plénitude."
  - "Pour que l'éducation puisse structurer son but intrinsèque - la demeure de toute connaissance en tout coeur et en tout esprit - l'étude interdisciplinaire doit localiser une base, un lien et un fond communs à toute connaissance, ceci au niveau-même de la conscience individuelle et de manière telle que la conscience puisse s'ouvrir à l'impulsion fondamentale qui anime toute branche d'étude. Seule une branche commune à toutes les branches d'étude, une base profonde, stable, et non-variable, pourrait réaliser le caractère ou bien le but de l'étude interdisciplinaire. Il n'y a qu'une voie permettant de réaliser pleinement les possibilités d'une telle base commune, et cette voie se trouve dans l'étudiant ou le connaisseur lui-même. À moins que le connaisseur ne devienne conscient dans sa propre conscience du fond commun de toute connaissance, la base commune à toutes les branches n'est pas structurée dans son esprit. C'est dans la connaissance du connaisseur, dans le champ du connaisseur, que réside le moyen direct de structurer cette base commune et de toucher au but de l'étude interdisciplinaire."
  - "Le champ du connaisseur est le champ de la conscience, de l'état de conscience sur lequel vont et viennent toutes les impulsions de chaque élément de la connaissance. L'édifice de l'étude interdisciplinaire a son seul aspect totalement stable dans le connaisseur, dans la conscience, dans l'intelligence. Un homme de connaissance est un homme intelligent, un homme à la personnalité intégrée, qui vit spontanément le fruit de toute connaissance; un homme dont la précision de pensée aboutit à la précision de l'action: quelqu'un qui ne commet pas d'erreur, qui exprime les vagues de vie en les épanouissant en vagues de bonheur, que le chagrin n'ombrage pas: en bref, quelqu'un dont la conscience est établie dans le champ pur de l'intelligence d'où s'élève cette abondance inévitable de connaissance et de plénitude. La connaissance et la plénitude viennent spontanément par la pratique de la SIC: il est d'ailleurs évident que c'est la SIC qui fait du rêve de l'étude interdisciplinaire et de l'idéal de l'éducation une réalité."
  - "La valeur d'une étude interdisciplinaire réussie tient en ce qu'elle ne laisse aucun étudiant ignorant en quelque domaine que ce soit de la vie: les arts, les sciences, les humanités, chaque branche doit jouer son rôle. Mais le fait d'acquérir des informations dans les divers domaines d'étude, en soi, n'ouvre pas la conscience individuelle à la pleine connaissance du connaisseur lui-même, qui seule est la base de toute connaissance. En dehors de la connaissance du connaisseur, il n'y a aucun domaine d'étude dont on puisse dire qu'il est la source-mère de tous les courants du savoir.\n\nL'intelligence est la caractéristique essentielle du connaisseur, et seul le champ pur, non-manifesté de l'IC est la source-mère de toute connaissance. La connaissance est structurée dans la conscience, et celui qui est éveillé à cette conscience possède déjà l'avantage de tout ce que l'étude interdisciplinaire vise à offrir à l'étudiant."
  - "Seul le jardinier qui sait agir au niveau de la sève pourra provoquer Iles changements désirés dans les diverses expressions de cette sève. Celui dont la conscience est ouverte au niveau fondamental de l'IC peut seul provoquer les modifications désirées dans les expressions de l'IC, et ces expressions constituent le domaine entier de la création. Une telle connaissance interdisciplinaire peut seule développer une capacité d'action multiphasée, c'est-à-dire qui donne satisfaction de tous côtés, d'un coup et de manière spontanée."
  - "L'étude interdisciplinaire, cette phase de l'éducation qui s'est développée sur la base de nombreux principes - différents cursus, différents plans d'étude, différentes combinaisons de sujets, différents projets et travaux en atelier afin que l'étudiant acquière la connaissance de domaines variés, se réjouira en touchant son but dans l'étude de la SIC. Le fait qu'on ait perdu de vue le but de l'éducation dans toutes les parties du monde demeure (même si cette perte est partiellement compensée par les études interdisciplinaires actuelles), et cette perte est ressentie non seulement par les étudiants de tous pays, mais encore par la vie et le monde dans son ensemble.\n\nAujourd'hui, les professeurs de SIC amènent à la lumière la valeur de l'IC pour l'étude de n'importe quel domaine, et ils murmurent la plénitude à toutes les aspirations de l'étude interdisciplinaire en ouvrant la conscience de chaque étudiant à la base et au lien de toutes les branches du savoir, en construisant la demeure de toute connaissance dans leur coeur et dans leur esprit. Ainsi, l'idéal le plus élevé de l'éducation et son but se trouvent accomplis et réalisés par la SIC."

questions:
  - question: "De quelle théorie provient l'expression \"étude interdisciplinaire\"?"
    answer: "De la théorie selon laquelle tout étudiant devrait recevoir une compréhension de plusieurs domaines et disciplines, pour être considéré et bien éduqué."
  - question: "Quelle est la difficulté principale de cette théorie?"
    answer: "Il n'est physiquement pas possible de devenir efficace en chaque domaine de la vie ou d'acquérir la connaissance de toutes les disciplines existantes."
  - question: "Quelle est la conséquence de cette difficulté sur le but des études interdisciplinaires?"
    answer: "Le but de l'étude interdisciplinaire - produire des hommes et des femmes éduqués - ne peut ètre atteint à moins que la valeur de toute connaissance soit à portée de main dans la vie pratique."
  - question: "Que faudrait-il atteindre, dans toute branche d'étude, pour que la source- mère de toutes ces branches d'étude soit à portée de main?"
    answer: "Il doit y avoir quelque caractéristique commune à toutes les disciplines, et si cette caractéristique commune pouvait être saisie par l'esprit conscient de l'étudiant, alors la source-mère de toutes les branches d'étude serait enfin à portée de main."
  - question: "Quel est le but de tout système d'éducation?"
    answer: "Produire un homme éduqué, ur homme de connaissance, d'accomplissement, de plénitude."
  - question: "De quoi dépend la plénitude d'un homme dans la vie?"
    answer: "La question entière de la plénitude repose sur le pivot de la connaissance. La connaissance doit donc être profonde et complète."
  - question: "Comment la connaissance doit-elle être structurée pour que l'éducation soit efficace?"
    answer: "L'éducation doit être telle qu'elle structure le but de toute connaissance en chaque esprit et en chaque coeur."
  - question: "Comment l'étudiant peut-il réaliser la quête fondamentale de l'étude interdisciplinaire?"
    answer: "Il doit posséder le lieu de rencontre de toutes les branches du savoir au niveau-même de sa conscience."
  - question: "En conséquence, dans quel domaine réside le moyen direct d'atteindre le but de l'étude interdisciplinaire?"
    answer: "La connaissance du connaisseur est le moyen direct de structurer le champ de l'étude interdisciplinaire et aussi d'en atteindre le but."
  - question: "Que veut dire «le domaine du connaisseur »?"
    answer: "Le champ de la conscience, de l'intelligence."
  - question: "Quel est le fondement de l'étude interdisciplinaire?"
    answer: "La connaissance de la conscience, de l'intelligence, tel est le fondement de l'étude interdisciplinaire."
  - question: "A quel niveau la connaissance réside-t-elle?"
    answer: "Au niveau de l'intelligence."
  - question: "Quelle est la seule manière de vivre le bénéfice de toute connaissance?"
    answer: "On ne peut vivre le fruit de toute connaissance que lorsque la base de toute connaissance, le champ pur de l'intelligence, est établi au plan de la conscience individuelle (de l'esprit conscient)."
  - question: "Quelle est la base dynamique de l'étude interdisciplinaire?"
    answer: "La base dynamique de l'étude interdisciplinaire est la connaissance du CONNAISSEUr."
  - question: "Comment la SIC réalise-t-elle tranquillement les aspirations de l'étude interdisciplinaire?"
    answer: "En ouvrant la conscience de chaque étudiant à la base même et au lien commun à toutes les branches d'étude, la SIC murmure la plénitude aux aspirations de l'étude interdisciplinaire."

