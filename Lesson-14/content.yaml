schema_version: 1

lesson:
  number: 14
  course: "Science de l'Intelligence Créatrice"
  title: "Vérification par la Physique des principes qui sous-tendent l'expérience de la pure nature de l'Intelligence Créatrice"
  language: fr

points_principaux:
  - "SIC : Principe de la plongée : prendre un angle correct et laisser les choses se faire.\n- Physique : Une fois les conditions initiales définies, la trajectoire d'un système est totalement prédictible."
  - "SIC : L'Intelligence cosmique oriente toute activité vers son but.\n- Physique : Tout système évolue vers son but selon le principe de la moindre action."
  - "SIC : Le principe de la plongée et de la gravité : l'esprit gravite naturellement vers le champ pur de l'Intelligence Créatrice.\n- Physique : L'atome est attiré vers son état fondamental, qui est un état d'ordre parfait."
  - "SIC : Le principe du charme croissant : à mesure que l'on se rapproche du champ pur de l'Intelligence Créatrice, l'intelligence, l'énergie et le repos augmentent.\n- Physique : À mesure que l'atome se rapproche de son état fondamental, les transitions d'un état au suivant se font de plus en plus rapidement et facilement."
  - "SIC : Principe du voyage confortable : le mantra a une influence particulière qui augmente l'efficacité et le confort du processus d'apaisement de l'esprit.\n- Physique : Principe de la transition induite : l'introduction d'une lumière résonnante facilite la transition de l'atome vers son état fondamental."
  - "SIC : Principe de l'accroissement de l'intelligence par le repos : lorsque l'activité mentale s'apaise, l'ordre augmente.\n- Physique : La troisième loi de la thermodynamique : lorsque la température — l'activité — diminue, l'ordre augmente."
  - "SIC : Principe de la purification du chemin : avec l'accroissement de l'ordre, les stress et les tensions se dissolvent.\n- Physique : Près de la température zéro, l'accroissement de l'ordre crée une purification spontanée. Lorsque l'eau salée gèle, le sel se sépare de l'eau."
  - "SIC : La conscience transcendantale est un état d'ordre parfait, silencieux, illimité.\n- Physique : L'hélium superfluide est un état silencieux de l'hélium, dans lequel n'existe aucune résistance et dans lequel l'ordre ne peut être perturbé."
  - "SIC : La conscience transcendantale, bien que non exprimée, est la base de toutes les expressions de la vie.\n- Physique : Toutes les valeurs de la vie sont soutenues par des valeurs plus subtiles, et ultimement par l'état de vide."

resume_long:
  - "Chaque méditant expérimente que le mouvement de la conscience depuis le niveau superficiel de la perception vers les niveaux plus profonds, jusqu'à la source de la pensée, est un phénomène physique. Cette leçon étudie le mouvement de la conscience à la lumière des lois de la nature découvertes par la Physique."
  - "Pendant la pratique de la MT, à travers le processus de réduction de l'activité, l'esprit fait l'expérience de toute son étendue, depuis le niveau conscient de l'activité mentale, jusqu'au niveau de la non activité de la conscience transcendantale, le champ pur de l'Intelligence Créatrice. La réduction de l'activité se fait selon le principe de la plongée: il suffit de prendre l'angle correct et de laisser faire."
  - "Selon le point de vue de la Physique, tout mouvement se caractérise par une origine repérable en terme de position, d'angle et d'accélération, et par un point d'arrivée. Lorsque les conditions initiales d'une action sont connues, il est possible d'en déterminer mathématiquement la trajectoire précise jusqu'à son point d'arrivée."
  - "Durant la Méditation Transcendantale, l'activité du mental est progressivement réduite jusqu'à ce que soit atteint un état de non activité, dans le champ de la pure Intelligence Créatrice. Cette trajectoire de l'esprit est prédictible par les lois de la physique."
  - "La loi naturelle est responsable de l'ordre et de la diversité qui existent dans la création, de l'ensemble de la vie cosmique depuis l'activité subtile de l'infiniment petit, jusqu'à l'immense activité des galaxies.\n\nParce que la loi naturelle est une instance toute-puissante, l'activité conduite par l'Intelligence cosmique de la nature va directement au but. Ce phénomène a été découvert par la physique comme loi de la moindre action."
  - "Le processus de la plongée se fait selon le principe de la moindre action. Une fois que les conditions initiales ont été définies, il suffit de prendre l'angle correct et de laisser les choses se faire, directement vers le but. “Laisser les choses se faire” signifie qu'on laisse le processus se dérouler non pas en vertu d'un effort individuel, mais en vertu de l'Intelligence cosmique."
  - "La force de gravité est une autre influence qui guide le processus de plongée. Durant la méditation, l'esprit gravite naturellement vers le champ pur de l'Intelligence Créatrice, de manière spontanée et sans effort."
  - "Dans la terminologie de la physique, l'état fondamental, dans lequel toute activité cesse, est un état naturel de repos de l'atome. Les électrons sont naturellement attirés vers le noyau, d'une façon analogue à l'attraction d'un plongeur vers le bas. La force d'attraction permet qu'ait lieu un phénomène de réduction croissante de l'activité jusqu'à ce que soit atteint l'état fondamental, dans lequel toute chose est au repos."
  - "La rapidité de la transition des électrons à l'intérieur de l'atome augmente à mesure que l'activité se réduit et que l'état fondamental se rapproche. Le but de toute activité est le domaine de plus grand repos, de plus grand confort."
  - "Dans la méditation, à mesure que l'activité mentale diminue et que la conscience atteint des niveaux de plus grande énergie et de plus grande intelligence, le charme augmente. Ce phénomène est vécu comme une influence apaisante. L'accroissement de l'énergie et de l'intelligence atteint son niveau suprême dans le transcendant, dans lequel le repos est le plus profond."
  - "Chaque méditant sait qu'en utilisant le mantra, il arrive rapidement à l'expérience de la pure nature de l'Intelligence Créatrice. Dans ce voyage rapide, il vit un bonheur croissant. Ce principe est celui du voyage confortable. La joie d'arriver rapidement au but contribue au confort du voyage."
  - "À chaque niveau d'apaisement de l'esprit, le mantra a un effet spécifique qui participe à l'efficacité et au confort du mouvement d'intériorisation."
  - "En physique, nous trouvons un phénomène identique à cet effet induit par le mantra au cours de la pratique. Lorsqu'un atome approche son état fondamental, son énergie ou activité se réduit et il émet une lumière spécifique. En introduisant dans un système une lumière de même qualité, il est possible d'accélérer la vitesse de transition des atomes d'un état à un autre, de telle sorte que le système atteigne plus rapidement son but. Ce phénomène est appelé transition induite ou émission stimulée."
  - "La Science de l'Intelligence Créatrice, en définissant ces principes qui guide l'expérience de la pure nature de l'Intelligence Créatrice, met en évidence des principes identiques à ceux que la physique a découvert aux différents niveaux de la création. Cette similitude existe parce que la MT est un processus naturel. Tous les processus de la nature obéissent aux mêmes principes."
  - "L'expérience des niveaux plus subtils de l'activité mentale exige un raffinement des facultés de perception. Ce raffinement de la perception sur le chemin de la pure nature de l'Intelligence Créatrice conduit ensuite à un accroissement de l'intelligence et de l'énergie après la méditation."
  - "L'accroissement de l'intelligence corrélativement à l'accroissement du repos, est un phénomène bien connu dans la nature. Il est décrit par la troisième loi de la thermodynamique, qui énonce que “l'ordre augmente lorsque l'activité diminue”. Quand un système atteint son état fondamental, il gagne un état d'ordre parfait. Cet accroissement de l'ordre lorsque l'activité diminue, a un effet purificateur sur le système."
  - "Lorsque l'activité mentale diminue dans la méditation, l'ordre augmente jusqu'à ce que la conscience atteigne le champ de la pure Intelligence Créatrice à la source de la pensée, qui est un état d'ordre parfait. Grâce à cet accroissement de l'ordre, les stress commencent à se dissoudre. Cet accroissement de la pureté -du système nerveux est un phénomène naturel dû à la diminution de l'activité."
  - "Dans le cas de l'hélium liquide, lorsque la température diminue, l'activité des atomes d'hélium est réduite. Lorsque la température approche deux degrés au-dessus du zéro absolu, les atomes se scindent en deux états distincts - actif et non actif. L'hélium superfluide apparaît. Encore plus près du zéro absolu, la pureté du système devient telle que les atomes s'organisent en une totalité homogène et constituent une superfluidité complète."
  - "Quand l'hélium devient superfluide, les fluctuations des atomes individuels s'organisent de la façon la plus ordonnée qui soit. Les atomes, comme s'ils étaient reliés les uns aux autres, forment un état cohérent infiniment extensible, dénué de toute résistance. La fluidité, la pénétration, l'harmonie et l'ordre sont de ce fait extrêmement importants."
  - "La réduction de la température d'un système physique aboutit à son auto-purification. Par exemple, lorsque la température d'une solution saline est réduite, la glace et les cristaux de sel se séparent et chacun des éléments se retrouve à l'état pur. De façon similaire, lorsque la température de l'hélium liquide est réduite, les deux composants du système, l'état superfluide et l'état normalement actif, deviennent identifiables séparément."
  - "Quand la température de l'hélium est réduite, l'état fondamental, qui est inhérent à l'état actif de chaque atome, manifeste davantage ses propriétés. Lorsque le zéro absolu est sur le point d'être atteint, l'état fondamental s'établit dans l'ensemble de l'hélium."
  - "L'apparition soudaine de la superfluidité de l'hélium s'apparente à l'apparition soudaine de la conscience transcendantale dans la méditation. De même que l'hélium superfluide est exempte de tout mouvement chaotique, la conscience transcendantale est un état de tranquillité parfaite que rien ne peut perturber. Le silence parfait est le centre le plus intime de chaque parcelle de l'existence. Il est le niveau transcendantal, éternellement silencieux de la vie, qui ne connaît aucune limitation."
  - "Cet état silencieux d'illimité, bien que non exprimé, est la base de toutes les expressions de la vie. Il est par nature complètement séparé de toute la création manifestée."
  - "Les métaux présentent également des états spécifiques de cohérence aux basses températures. Ainsi, lorsque la température du plomb approche le zéro absolu, sa résistance devient nulle au passage de l'électricité. Ce phénomène s'appelle la supraconductivité. -"
  - "Au niveau des atomes, la résistance que présentent les existences individuelles à être une totalité parfaitement coordonnée, provient de l'activité, Dès lors que l'activité est réduite à l'état fondamental, chaque chose devient parfaitement coordonnées et semble être reliée à toute autre chose."
  - "La similarité entre les lois de la physique et les principes de la Science de l'Intelligence Créatrice, montre que la MT est un phénomène naturel. En tant que phénomène naturel, elle s'étend du domaine du repos infini à l'activité cosmique la plus grossière en passant par tous les degrés subtils de l'activité."
  - "Ainsi, les lois qui gouvernent la réduction de l'activité d'un système physique vers l'état de vide sont similaires aux lois qui gouvernement la réduction de l'activité mentale vers la pure nature de l'Intelligence Créatrice."
  - "Le fait que le cerveau produisent des ondes montre que l'esprit possède certains caractères d'un système physique. Par conséquent, les lois qui gouvernent la réduction de l'activité mentale et celles qui gouvernent la réduction de l'activité physique du système nerveux sont les mêmes."
  - "Les différents niveaux de conscience peuvent être expliqués en de différents niveaux d'activités, similairement aux découvertes de la Physique."
  - "La terminologie moderne de la physique exprime de manière nouvelle la connaissance ancienne sur la façon dont les niveaux superficiels de la vie sont soutenus par des valeurs plus subtils et ultimement par une valeur infinie qui est la base de toute chose et que la physique appelle état de vide."
  - "Lorsque les lois de la physique seront davantage clarifiées, nous pourrons les comprendre en référence à notre expérience de la\n\ntranscendance. Les principes responsables de l'expérience de la pure Intelligence Créatrice seront considérés par la Physique comme identiques à ceux qui sous-tendent touts les aspects physiques de la vie."

questions:
  - question: "Comment le principe de la plongée se retrouve-t-il en Physique?"
    answer: "Une fois les conditions initiales définies, la trajectoire entière d'un mouvement jusqu'à son point d'arrivée, est totalement prédictible."
  - question: "Qu'est-ce que la loi de la moindre action?"
    answer: "La nature choisit le trajet le plus direct pour mener l'action à son but."
  - question: "Comment expérimente-t-on la loi de la moindre action pendant la Méditation?"
    answer: "Tout le processus de la MT se fait sans effort individuel, grâce à l'intelligence cosmique qui nous conduit directement vers l'expérience de la pure Intelligence Créatrice."
  - question: "Comment le principe de la gravité se retrouve-t-il en Physique?"
    answer: "L'atome est attiré naturellement vers son état fondamental, qui est l'état le plus reposé."
  - question: "Comment le principe du charme croissant est-il illustré par la Physique?"
    answer: "La vitesse de transition d'un atome d'un état à un autre augmente à mesure que celui-ci se rapproche de son état fondamental."
  - question: "Quel phénomène physique peut être comparé à l'influence du mantra dans le mouvement d'intériorisation de la méditation?"
    answer: "La transition induite ou l'émission stimulée: l'introduction d'une lumière résonnante augmente la vitesse er la facilité avec laquelle les atomes se rapprochent de leur état fondamental."
  - question: "Quelle loi de la Physique correspond au principe de l'accroissement de Intelligence par le repos?"
    answer: "La troisième loi de la thermodynamique, qui énonce que l'ordre s'accroît à mesure que la température - l'activité - diminue."
  - question: "Quelles caractéristiques de l'hélium superfluide retrouve-t-on dans la conscience transcendantale?"
    answer: "L'absence de limites, l'harmonie, l'ordre et le repos parfait, que rien ne peut perturber."
  - question: "Comment le principe de la purification du chemin se retrouve:t-il en Physique?"
    answer: "Lorsque la température d'une solution d'eau saline descend vers zéro degré, la glace se sépare de ses impuretés salines. Lorsque la température de l'hélium se rapproche du zéro absolu, émerge un superfluide, pur, non actif et ordonné, complètement séparé du fluide actif et chaotique."
  - question: "Que montre la similarité entre les lois de la nature découvertes par la physique et les principes qui sous-tendent l'expérience de la MT?"
    answer: "Elle montre que le MT est un phénomène naturel."

place_de_la_lecon:
  - "Cette leçon jette un pont entre les lois de la nature découvertes par la physique et les principes de la Science de l'Intelligence Créatrice responsables du mouvement de l'esprit vers la source de la pensée, vers le champ pur de l'Intelligence Créatrice. Toute la vie, dans son mouvement perpétuel, depuis l'activité la plus fine jusqu'à l'activité la plus grossière, est gouvernée par les lois de la nature. La physique étudie les lois qui régissent l'activité physique. Le méditant expérimente les lois qui régissent l'activité mentale. En fait, ce sont les mêmes lois qui gouvernent toutes les activités, physiques ou mentales. La similarité entre les lois découvertes par la physique et les principes de l'expérience de la MT, montre que la technique de Méditation Transcendantale est un phénomène naturel. Cette similitude illustre également le rôle fondamental de la SIC par rapport aux autres sciences. La Science de l'Intelligence Créatrice est la première science qui donne la connaissance et l'expérience de principes si fondamentaux de l'évolution et de l'existence qu'ils sont les fondements de toutes les disciplines. Dans la SIC nous trouvons la base, l'étendue et le but ultime de toutes les sciences."
