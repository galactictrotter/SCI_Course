schema_version: 1

lesson:
  number: 9
  course: "Science de l'Intelligence Créatrice"
  title: "L'Intelligence Créatrice est la base de toute connaissance"
  language: fr

points_principaux:
  - "Lien entre la perception, la connaissance et le développement de l'Intelligence Créatrice."
  - "La connaissance est structurée dans la conscience."
  - "L'expérience directe de la conscience pure, du domaine pur de l'Intelligence Créatrice, permet de bâtir en soi-même la demeure de toute connaissance."
  - "Le but ultime et suprême de l'éducation est d'établir l'homme dans la demeure de toute connaissance."
  - |-
    Les bienfaits de l'état de toute connaissance sont :
    - une action accomplie spontanément en harmonie avec toute la connaissance
    - une vie évolutive vécue dans la plénitude, tel un océan se réjouissant perpétuellement dans le jeu de ses vagues.

resume_long:
  - "L'Intelligence Créatrice est la base de toute connaissance. La Science de l'Intelligence Créatrice propose une technique qui, parce qu'elle développe la pleine valeur de l'Intelligence Créatrice, permet à chaque homme de vivre la pleine valeur de la connaissance."
  - "Nous savons par expérience que la connaissance s'acquiert à partir de la perception. Le simple fait de voir un objet nous livre une connaissance à son propos. Le fait d'apprendre quelque chose de quelqu'un constitue également une connaissance acquise par la perception, en l'occurrence le sens de l'ouïe."
  - "Bien que la connaissance s'obtienne à travers la perception, nous ne considérons pas la perception comme la base de la connaissance. En effet, la perception dépend d'autre chose. Elle repose sur le degré d'Intelligence Créatrice. La perception est liée à la qualité de l'éveil et de la vigilance."
  - "Les expériences scientifiques montrent que la pratique de la MT affine les perceptions, développe l'intelligence, accentue l'éveil et la rapidité de réaction. Ces résultats sont un reflet du développement de l'Intelligence Créatrice."
  - "Le développement de l'Intelligence Créatrice amène un affinement de la perception et de l'intelligence. Cette amélioration de la clarté de la perception et de la pensée conduit au développement de la connaissance. Ainsi le niveau de connaissance d'un homme est directement lié à son niveau d'Intelligence Créatrice."
  - "La connaissance est différente dans différents états de conscience. Et parce que la qualité de la conscience dépend du niveau d'Intelligence Créatrice, les différents états de conscience peuvent être mis en correspondance avec différentes valeurs de l'Intelligence Créatrice. Nous disons par conséquent que l'Intelligence Créatrice est la base de la connaissance. Le niveau d'Intelligence Créatrice est la mesure de la connaissance."
  - "Cette conception de l'Intelligence Créatrice comme base de toute connaissance est une vérité de grande portée pour chaque homme. Elle implique que si nous capturons la pleine valeur de l'Intelligence Créatrice au niveau de l'intelligence pure non-manifestée, nous capturons du même coup le siège de toute connaissance."
  - "Cette vérité est merveilleusement bien formulée dans le Rig Veda : « La connaissance est structurée dans la conscience ». Comme chaque homme est doté de conscience, chaque homme est potentiellement la demeure de toute connaissance. Chaque homme possède la structure de toute la connaissance au niveau de sa conscience. Cette structure doit simplement être rénovée."
  - "Ainsi la qualité de la connaissance d'un homme repose sur son niveau d'Intelligence Créatrice, c-à-d son niveau d'éveil ou de conscience. Si la pleine valeur de l'Intelligence pure, la valeur infinie, illimitée de la conscience, pouvait devenir une réalité permanente au niveau de l'esprit conscient, celui-ci deviendrait alors la demeure de toute connaissance."
  - "Depuis que nous avons commencé la pratique de la MT, nous sommes plus créatifs. Les obstacles au développement de l'Intelligence Créatrice - les tensions et les fatigues - se dissolvent progressivement et l'expérience du champ pur de l'Intelligence Créatrice devient spontanément plus claire."
  - "Nous avons donc maintenant à notre disposition un moyen simple, naturel, très efficace, pour développer la pleine valeur de l'Intelligence Créatrice. Cela signifie que nous disposons d'un moyen simple, naturel, automatique, n'impliquant pas d'effort, pour atteindre la totalité de la connaissance dans son état le plus pur. Stabiliser la pleine valeur de l'Intelligence Créatrice revient à construire en soi une demeure de toute connaissance. C'est pourquoi nous disons que « la connaissance est structurée dans la conscience »."
  - "« La connaissance est structurée dans la conscience » est la devise de MIU - Maharishi International University. MIU se consacre depuis plusieurs années à étudier toutes les branches du savoir sous l'angle de la Science de l'Intelligence Créatrice."
  - "MIU aspire à structurer la demeure de toute connaissance dans le cœur de chaque étudiant de telle sorte que quoiqu'il étudie, il puisse jouir du bénéfice de toute connaissance."
  - "Quand cette demeure de toute connaissance est structurée de façon permanente dans la conscience d'un homme, celui-ci devient un homme véritablement éduqué, illuminé, et profondément efficace. Il fait preuve d'une grande dextérité dans l'action si bien que celle-ci réussit parfaitement et aboutit à la plénitude. Un tel homme est dénué de faiblesse, ne fait plus d'erreur, est spontanément juste dans ses façons d'être et dans ses actions. En conséquence, il vit la valeur suprême du progrès et de l'évolution."
  - "Chaque être devrait développer cet état de conscience dans lequel la connaissance est vivante, satisfaisante et complète, utile et toute-englobante. Cet état peut être atteint au moyen d'un processus très naturel, spontané, n'exigeant pas d'effort, qui permet l'actualisation de la tendance naturelle de l'Intelligence Créatrice à croître jusqu'à sa valeur ultime. Ce processus et cette connaissance sont désormais disponibles grâce au cours de la Science de l'Intelligence Créatrice dispensé par MIU."
  - "Dans le passé, l'éducation n'a pas donné entière satisfaction simplement parce qu'aucune possibilité n'existait pour gagner le bénéfice de toute connaissance. L'individualité humaine étant inscrite dans l'Intelligence cosmique, l'appétit de connaissance ne cesse de grandir à mesure que l'on apprend. Chaque domaine de connaissance est par ailleurs si vaste que la durée d'une vie ne peut suffire pour en faire le tour par la simple lecture. La vie humaine est si courte, qu'en essayant de bien connaître tout ce qui concerne notre vie, nous ne pouvons qu'effleurer l'ensemble des connaissances relatives à la vie dans son ensemble. Aussi le système éducatif actuel ne peut-il éduquer aucun homme à être un connaisseur véritable de lui-même et de son environnement."
  - "L'homme a besoin d'une technique grâce à laquelle il peut accéder à la totalité de la vie, sous la forme concentrée de la graine. Heureusement, nous disposons désormais de cette technique. Lorsque nous avons abordé le thème de l'acquisition de la connaissance, nous avons localisé le germe de toute connaissance au niveau de la conscience."
  - "Nous avons analysé comment l'Intelligence devient consciente, et comment, lorsque la conscience devient consciente, l'Intelligence devient intelligente. Cet aspect intelligent de l'Intelligence devient l'Intelligence Créatrice."
  - "Celui qui s'approprie la demeure de toute connaissance au niveau de sa conscience, vit dès lors une existence imprégnée de connaissance aux niveaux de ses pensées, de ses actions, de ses comportements. Il vit comme un être éduqué devrait vivre : une vie de progrès et de satisfaction profonde. Ainsi peut être atteint l'objectif de l'éducation qui vise à former des hommes véritablement éduqués."
  - "Développer la totalité de l'Intelligence Créatrice revient à établir en soi-même la demeure de toute connaissance. Sur cette base, l'homme vit le bénéfice de toute connaissance. L'expression « vivre le bénéfice de toute connaissance » signifie qu'on se sent familier avec toute chose. Après tout, qu'apporte la connaissance si ce n'est de nous rendre compétent dans le domaine particulier qu'elle traite."
  - "Sachant que l'Intelligence Créatrice est la base de toute connaissance, et disposant de la technique pour développer en nous-même la pleine valeur de l'Intelligence Créatrice, nous pouvons tous devenir les bénéficiaires de toute la connaissance sans avoir à en étudier toutes les disciplines. Même en nous spécialisant dans un domaine, nous pouvons conserver le bénéfice de toute connaissance, qui est l'aptitude à vivre dans la plénitude."
  - "Un homme de connaissance vit une existence de satisfaction profonde, une vie ayant une valeur maximale pour lui-même et pour la société."
  - "En bref, nous avons vu que la connaissance est tributaire du niveau d'Intelligence Créatrice. La Méditation Transcendantale est une technique naturelle, spontanée, n'exigeant pas d'effort, universelle, grâce à laquelle chaque homme peut développer la pleine valeur de l'Intelligence Créatrice et vivre par conséquent la pleine valeur de la connaissance."

questions:
  - question: "De quoi dépend la clarté de la perception et par conséquent la connaissance ?"
    answer: "De notre degré d'éveil, de notre niveau de conscience, d'intelligence, d'intelligence créatrice."
  - question: "Par conséquent, comment pouvons-nous accéder à la demeure de toute connaissance ?"
    answer: "En établissant notre conscience dans le domaine de la pure intelligence, dans la pleine valeur de l'Intelligence Créatrice."
  - question: "Comment est formulé dans le Rig Veda, ce rapport entre la connaissance et la conscience ?"
    answer: "« La connaissance est structurée dans la conscience »."
  - question: "Comment la pratique de la MT restaure-t-elle une structure usée ?"
    answer: "En éliminant les tensions du corps et de l'esprit."
  - question: "Quelle tendance naturelle de l'Intelligence Créatrice est utilisée dans la MT ?"
    answer: "Sa tendance naturelle à croître vers sa pleine valeur."
  - question: "Pourquoi la quantité croissante d'informations que l'éducation nous enseigne n'a-t-elle pas pu jusqu'à présent satisfaire les étudiants ?"
    answer: "Parce que l'appétit de connaissance augmente avec la quantité des connaissances à acquérir, quantité qui est illimitée tandis que le temps d'une vie est court."
  - question: "Comment ce problème fondamental de l'éducation peut-il être résolu ?"
    answer: "En permettant aux étudiant de capturer le domaine de toute connaissance au niveau de leur conscience."
  - question: "Quelle conséquence sur la vie aurait la réalisation de l'idéal de l'éducation ?"
    answer: "L'éducation formerait alors des personnes véritablement éduquées vivant une vie de progrès constant au niveau de leurs pensées, de leurs actions et de leurs comportements."
  - question: "Comment les écoles, les collèges et les universités peuvent-ils devenir des temples véritables de la connaissance ?"
    answer: "En développant la pleine valeur de l'Intelligence Créatrice chez tous les étudiants - en dispensant des cours de Science de l'Intelligence Créatrice."
  - question: "Comment le fait de capturer la demeure de toute connaissance, le pur domaine de l'Intelligence Créatrice, affecterait-il l'éducation générale et spécialisée ?"
    answer: "Chacun vivrait le bénéfice de toute connaissance, sans avoir à étudier chaque domaine. Même en se spécialisant dans une discipline, il garderait le bénéfice de toute connaissance."

place_de_la_lecon:
  - "La connaissance se fonde sur l'Intelligence Créatrice. En effet, notre capacité de connaissance est intimement liée à notre degré d'intelligence. Et l'Intelligence Créatrice n'est rien d'autre que l'Intelligence en action. Ainsi l'Intelligence Créatrice s'avère-t-elle être la base de toute connaissance, et par conséquent de toute action, de tout accomplissement, et de toute plénitude. La compréhension de cette vérité - et donc de cette leçon - est essentielle pour tirer pleinement bénéfice de l'étude et des applications de la Science de l'Intelligence Créatrice."
  - "Au cours des leçons précédentes, nous avons développé une définition générale de l'Intelligence Créatrice. Nous tirons maintenant des conclusions sur cette définition et, en reconnaissant l'Intelligence Créatrice comme base de toute connaissance, nous affinons notre compréhension."
  - "Cette leçon contient une idée fondamentale à la SIC, qui est extrêmement bien synthétisée dans le Rig Veda par l'expression « La connaissance est structurée dans la conscience ». Cette expression est devenue la devise de MIU."
  - "Bien que la perception soit le moyen d'accès à la connaissance, elle n'en constitue pas pour autant la base. La qualité de notre perception et de notre pensée dépend directement de la quantité d'Intelligence Créatrice que nous utilisons. L'Intelligence Créatrice est la base de toute connaissance. Le contact avec le champ pur de l'Intelligence Créatrice entraîne une perception et une pensée plus claires, qui conduisent inévitablement à une connaissance accrue."
  - "Cette leçon révèle que, puisque la connaissance est structurée dans la conscience, tout homme possède en lui la demeure de toute connaissance. On devrait considérer comme véritablement éduqué l'homme établi dans la demeure de toute connaissance. Seul un tel homme peut jouir du bénéfice de toute connaissance, c-à-d vivre dans la plénitude."
  - "La vision globale dispensée dans cette leçon servira de base pour susciter de nouvelles compréhensions plus profondes sur les principes, l'étendue et les applications de la Science de l'Intelligence Créatrice. Cette leçon nous fait entrer dans la demeure de toute connaissance. Il n'est pas surprenant qu'elle soit la neuvième leçon, neuf étant le chiffre le plus élevé. Cette leçon peut être considéré comme un phare destiné à guider notre compréhension dans la vaste étendue de ce cours."
