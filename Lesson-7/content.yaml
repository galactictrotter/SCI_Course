schema_version: 1

lesson:
  number: 7
  course: "Science de l'Intelligence Créatrice"
  title: "L'étendue de l'Intelligence Créatrice"
  language: fr

points_principaux:
  - |-
    L'Intelligence Créatrice s'étend :
    - de ce qui est plus petit que le plus petit à ce qui est plus grand que le plus grand ;
    - du non-manifesté au non-manifesté, infini, illimité, éternel, en passant par tous les degrés de la manifestation ;
    - d'ici à ici ;
    - du « je » au « je » ;
    - de la graine à la graine ;
    - de la plénitude à la plénitude.
  - "Le système nerveux humain possède l'aptitude naturelle à vivre toute l'étendue de l'Intelligence Créatrice."
  - "La Science de l'Intelligence Créatrice libère cette aptitude inhérente à chaque homme. Elle permet de développer en tout homme la connaissance et l'expérience de la totalité de l'Intelligence Créatrice."

resume_long:
  - "L'expérience de la pure nature de l'Intelligence Créatrice et l'observation du monde phénoménal nous amènent à découvrir que l'Intelligence Créatrice englobe le champ tout entier de la vie, depuis l'existence individuelle jusqu'à la totalité de l'univers. L'Intelligence Créatrice s'étend de l'activité des fines particules jusqu'à celle des galaxies. Une connaissance fondamentale guide notre démarche comme un phare éclaire le chemin : « Le système nerveux humain a la capacité naturelle de vivre toute l'étendue de l'Intelligence Créatrice et d'en intégrer toutes les valeurs dans l'activité quotidienne »."
  - "L'expérience de la MT montre que l'Intelligence Créatrice pure est non-manifestée par nature ; lorsque l'activité mentale cesse, le méditant expérimente la valeur non-manifestée de la pure nature de l'Intelligence Créatrice. À mesure qu'il reproduit cette expérience, il devient chaque jour plus créatif : les valeurs manifestées de l'Intelligence Créatrice grandissent dans sa perception, dans son esprit, dans sa nature. Cette expérience montre l'amplitude du champ de l'Intelligence Créatrice, qui va de la valeur non-manifestée aux valeurs manifestées."
  - "Ainsi, la création toute entière est l'expression de l'Intelligence Créatrice, dont la nature essentielle est non-manifestée. Le champ de l'Intelligence Créatrice inclut cette valeur non-manifestée et toutes les valeurs manifestées de la création. L'étendue de l'Intelligence Créatrice va de la non-activité de l'Intelligence pure, à l'activité de l'atome, jusqu'à la vaste activité de l'univers entier. L'étendue de l'Intelligence Créatrice va de l'état de repos profond au sein de la valeur non-manifestée de la pure Intelligence Créatrice jusqu'à l'immense activité dynamique responsable de la pulsation de l'univers."
  - "La pratique de la méditation permet de découvrir la valeur non-manifestée de l'Intelligence Créatrice. Nous faisons également l'expérience de sa valeur manifestée à travers les pensées qui émergent du non-manifesté. Puis, la pensée se concrétise en action, l'action en réalisation et la réalisation en plénitude."
  - "La plénitude est un état dans lequel le calme profond de la conscience transcendantale est maintenu dans l'activité. Cette expérience constitue ce qu'on peut appeler la plénitude de la vie. Elle s'installe en vertu même de la tendance naturelle de l'Intelligence Créatrice à évoluer. Le calme profond du non-manifesté envahit progressivement les aspects manifestés de la pensée, puis les aspects encore plus manifestés de l'action, de la réalisation et de la plénitude complète, dans laquelle le calme parfait du non-manifesté devient vivant dans le champ de l'activité."
  - "Ceci montre l'amplitude du champ de l'Intelligence Créatrice, qui englobe la valeur non-manifestée de l'Intelligence pure et les différents degrés de manifestation de l'Intelligence Créatrice, depuis la pensée, l'action, la réalisation et finalement l'état de plénitude, dans lequel la valeur non-manifestée de l'Intelligence pure est vécue à l'intérieur même de ses manifestations."
  - "La pratique de la MT développe l'état de plénitude. À mesure que les tensions sont éliminées, nous devenons plus créatifs. Étant plus créatifs, nous devenons capables d'être à la fois dynamiques, calmes et harmonieux. Cet état d'équilibre de l'esprit - équilibre entre les valeurs manifestées et non-manifestées de l'Intelligence Créatrice - s'étend d'ici à ici. Ce n'est qu'une question de passer par là, qui, en fait, est également ici."
  - "L'Intelligence Créatrice s'étend d'ici à ici, du « je » au « je », du « je » du sommeil profond (un état de complète inertie) au « je » de la conscience cosmique (un état de la vie plus reposant que le sommeil, même dans l'activité). L'Intelligence Créatrice va du « je » dans un état de non-développement au « je » dans son état le plus développé. Le « je » demeure : le « je » du sommeil profond est le même que le « je » de la conscience cosmique. Mais dans la conscience cosmique, le « je » est associé à l'Illimité, à la valeur non-manifestée de l'Intelligence Créatrice."
  - "L'Intelligence Créatrice va donc du « je » de la vague au « je » de l'océan. Les profondeurs silencieuses de l'océan sont semblables à la valeur non-manifestée de l'Intelligence Créatrice. L'Intelligence Créatrice se manifeste en vagues, et ces vagues s'élèvent de plus en plus haut. Cette aspiration à s'élever au plus haut atteint sa plénitude suprême, lorsque toutes les vagues trouvent leur place dans la valeur illimitée de l'océan. Ainsi, l'Intelligence Créatrice va de l'océan à l'océan et les vagues ne sont que le jeu transitoire de l'océan."
  - "L'Intelligence Créatrice s'étend de la graine à la graine. En effet, la croissance de l'arbre trouve son plein aboutissement dans la création d'une graine. De la graine à la graine, telle est l'étendue de l'Intelligence Créatrice."
  - "L'Intelligence Créatrice s'étend de la plénitude de la vie à la plénitude de la vie. Les vagues de la créativité jaillissent de la plénitude de la valeur illimitée non-manifestée de la vie. Et dansant dans les valeurs manifestées de la création, elles grandissent dans la joie et retrouvent finalement leur plénitude dans la vie illimitée."
  - "L'Intelligence Créatrice s'épanouit pleinement dans une double plénitude : la plénitude de l'illimité et la plénitude des limites. La valeur non-manifestée et non-active de l'Intelligence Créatrice est un domaine de plénitude. Et de cette plénitude-ci, une autre plénitude émerge en tant que sa manifestation. Elle émerge et se développe jusqu'à atteindre la même plénitude que celle de l'illimité. Et c'est alors l'état de conscience cosmique dans lequel les deux plénitudes sont devenues une réalité vivante."
  - "Ce principe de l'évolution de la créativité est vrai dans tous les états de conscience. Avec la croissance de la conscience, la connaissance devient plus englobante. À chaque niveau de conscience, la connaissance est différente et la vie est évaluée différemment. Les fluctuations de l'Intelligence Créatrice engendrent des réalités multiples. Mais ce qui demeure vrai dans tous les cas, c'est que l'étendue de l'Intelligence Créatrice va de la plénitude à la plénitude."
  - "Cette connaissance - cette approche scientifique et systématique de l'étendue de l'Intelligence Créatrice - a l'immense portée de nous donner une vision claire des possibilités de la conscience humaine. La conscience humaine individuelle a la capacité d'intégrer la valeur totale de l'Intelligence Créatrice. Ainsi l'homme peut vivre une vie dans laquelle la plénitude est devenue une réalité vivante."
  - "La connaissance de l'étendue de l'Intelligence Créatrice englobe la sagesse de l'unité et celle de l'ensemble de la diversité. Dans l'état de conscience transcendantale, nous faisons l'expérience de la valeur unifiée de l'Intelligence Créatrice. Grâce à cette expérience, l'Intelligence Créatrice grandit jusqu'à ce que la conscience devienne capable de vivre, dans une joie indicible, la valeur non-manifestée de l'Intelligence Créatrice dans toutes les circonstances quotidiennes de l'activité manifestée."
  - "Cette connaissance du principe de croissance de la pure nature de l'Intelligence Créatrice nous invite à intégrer et à vivre aussi rapidement que possible les deux plénitudes de la vie. Cette réunion des deux plénitudes constitue l'expérience de la pleine étendue de l'Intelligence Créatrice."
  - "La connaissance de l'étendue de l'Intelligence Créatrice éveille notre aspiration à évoluer. Et cette aspiration est concrétisable grâce à la connaissance du fait que le centre de l'Intelligence Créatrice se trouve en nous-mêmes, à la source de la pensée."
  - "Le système nerveux humain est un instrument, une création de l'Intelligence Créatrice, conçu pour en englober toute l'étendue : la valeur non-manifestée et la valeur manifestée pleinement développée. C'est ce qui nous fait dire que l'étendue de l'Intelligence Créatrice va d'ici à ici, c'est-à-dire qu'elle se trouve en nous-mêmes."
  - "Par conséquent, que peut-on faire si l'on souhaite intégrer la totalité de l'Intelligence Créatrice ? Il suffit de rester là où l'on est, d'établir notre conscience dans le Soi, dans cet état de pure Intelligence, qui est immuable, non-mouvant, stable et illimité. Conscients de là où nous sommes, nous avons alors la possibilité d'aller là où nous le voulons."
  - "Cette possibilité de vivre toute l'étendue de l'Intelligence Créatrice est une aptitude naturelle du système nerveux. Seuls les stress et les tensions bloquent le fonctionnement normal du système nerveux. Ils nous empêchent d'utiliser et de vivre toute l'étendue des valeurs de l'Intelligence Créatrice dans la vie quotidienne."
  - "Lorsque toutes les tensions sont éliminées, la conscience cosmique est atteinte. La conscience cosmique est cet état de la vie dans lequel toute l'étendue de l'Intelligence Créatrice est vécue en tant que réalité vivante. Quand l'esprit arrive à demeurer stable dans la tranquillité, l'étendue totale de l'Intelligence Créatrice devient vivante. Dans cet état de la vie, chaque impulsion devient juste, menant à une action correcte, à la réalisation maximale, et en conséquence à une plénitude profonde."
  - "Grâce à la connaissance de la Science de l'Intelligence Créatrice, chaque homme peut désormais développer la pleine valeur de l'Intelligence Créatrice et l'utiliser dans la vie quotidienne. Cette science offre la technique pratique et naturelle pour éliminer les tensions, et la connaissance nécessaire pour comprendre ce qui se passe lorsque toute l'étendue de l'Intelligence Créatrice commence à devenir une réalité vivante."

questions:
  - question: "Citer les deux expériences procurées par la MT qui permettent de définir l'étendue de l'Intelligence Créatrice ?"
    answer: "Lorsque l'activité mentale cesse au cours de la pratique, le méditant fait l'expérience de la conscience non-manifestée et illimitée. Ensuite, dans l'activité, il ressent le développement des qualités de l'Intelligence Créatrice."
  - question: "Que nous apprend l'observation de la création à propos de la nature essentielle de l'Intelligence Créatrice ?"
    answer: "La nature essentielle de l'Intelligence Créatrice est non-manifestée. La création toute entière en est l'expression manifestée - l'arbre est dans la graine."
  - question: "Quelle conclusion sur l'étendue de l'Intelligence Créatrice nous fournissent ces deux modes d'expérience que sont l'expérience directe et l'observation ?"
    answer: "L'étendue de l'Intelligence Créatrice englobe la totalité de la vie - de la vie individuelle à la vie universelle."
  - question: "Quelles expériences montrent que l'état transcendantal est un état de plénitude ?"
    answer: |-
      - Lorsqu'on en sort, on souhaite y retourner. Ceci démontre que c'est un état de plus grande plénitude que celui que l'on vit une fois sorti.
      - Dans cet état, nous oublions tout ce qui nous est cher. Cela démontre qu'il est encore plus cher et plus satisfaisant que toute autre chose.
      - Dans cet état, on ne désire rien d'autre et cela montre que c'est un état de plénitude. Lorsqu'on en sort, on désire retourner à cet état de plénitude.
  - question: "Qu'y a-t-il de plus dans l'état de plénitude ultime ?"
    answer: "Le calme du non-manifesté devient vivant et s'exprime dans l'activité."
  - question: "En termes de non-manifesté, quelle est l'étendue de l'Intelligence Créatrice ?"
    answer: "Elle va de la valeur non-manifestée isolée de l'Intelligence pure jusqu'à la valeur non-manifestée de l'Intelligence pure au sein de ses manifestations."
  - question: "En termes de conscience individuelle, quelle est l'étendue de l'Intelligence Créatrice ?"
    answer: "Elle va du « je » du sommeil profond au « je » de la conscience cosmique."
  - question: "Quelle est l'étendue de l'Intelligence Créatrice dans la croissance d'un arbre ?"
    answer: "Elle va de la graine à la graine."
  - question: "Quelle inspiration concrète sur la vie humaine apporte cette connaissance de l'Intelligence Créatrice ?"
    answer: "Puisque le centre de l'Intelligence Créatrice est localisable en nous-mêmes à la source de la pensée, nous pouvons évoluer jusqu'à vivre la pleine valeur de l'Intelligence Créatrice. « La pleine valeur de l'Intelligence Créatrice » signifie que la totalité du non-manifesté peut se manifester au niveau de la conscience individuelle. Les actes de la vie quotidienne deviendront alors faciles et naturels. Rien ne sera difficile. La souffrance aura disparu. Et le bonheur sera ancré en nous."
  - question: "Où se situe le centre de l'Intelligence Créatrice dans la vie individuelle et dans la vie cosmique ?"
    answer: "Dans la vie individuelle, l'Intelligence Créatrice se localise à la source de la pensée, d'où émergent tous les courants de la créativité. Dans la vie cosmique, le centre de l'Intelligence Créatrice se trouve partout, car chaque chose évolue et chaque chose évolue à partir de l'intérieur d'elle-même. Par conséquent, le centre de l'Intelligence Créatrice cosmique se trouve partout."
  - question: "Qu'est-ce qui nous empêche de vivre et d'utiliser toute l'étendue de l'Intelligence Créatrice dans notre vie ?"
    answer: "Les tensions et les stress bloquent le fonctionnement normal du système nerveux."
  - question: "Décrivez l'état de conscience cosmique ?"
    answer: "C'est un état dans lequel on perçoit directement que le centre de l'Intelligence Créatrice cosmique est partout. Lorsque la conscience est établie dans le Soi illimité, l'Illimité se retrouve partout. Ce n'est pas simplement un état de sérénité. C'est un état d'infinité. La sérénité n'est pas suffisante. C'est un état dans lequel les deux plénitudes - la plénitude de l'Illimité et la plénitude des limites - sont devenues une réalité vivante. En conscience cosmique, la pleine étendue de l'Intelligence Créatrice devient par conséquent une réalité vivante. Dans cet état de vie, chaque impulsion est juste, menant à une action correcte, à une réalisation maximale, et à un contentement profond."

place_de_la_lecon:
  - "Cette leçon concrétise la vision des possibilités ouverte dans les leçons précédentes. Elle montre qu'en utilisant cette connaissance de manière appropriée, tout homme peut développer le plein potentiel de l'Intelligence Créatrice, qui est illimité. En nous ouvrant à la connaissance de la pleine étendue de l'Intelligence Créatrice, nous prenons conscience de l'immense portée de la connaissance contenue dans l'ensemble du cours. Cette prise de conscience permettra de considérer les leçons suivantes avec une vision plus large et plus englobante."
  - "Cette leçon est le souffle même de l'ensemble de ce cours."
