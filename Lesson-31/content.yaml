schema_version: 1

lesson:
  number: 31
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC, M.I.U. et l'étude de l'intelligence"
  language: fr

points_principaux:
  - "La connaissance de l'intelligence est éternelle."
  - "MIU fut établie afin de stabiliser tous les domaines d'étude à la lumière sur\n\nla base éternelle de toute connaissance qu'est le champ d'intelligence pure."
  - "Cette réalisation de MIU créera des hommes de connaissance et réalisera les\n\nsept objectifs de la SIC grâce au Plan Mondial."
  - "MIU réalisera le Plan Mondial en établissant un centre de formation de\n\nprofesseurs de SIC par million d'habitant dans le monde entier."

resume_long:
  - "Nous avons vu comment l'étude de l'intelligence donne la plénitude à tout homme, accomplit le but de l'étude interdisciplinaire et réalise l'idéal le plus élevé de l'éducation. MIU assurera le bien-être, le progrès et la plénitude de l'humanité en chaque génération, en maintenant la pureté et l'efficacité de l'enseignement"
  - "En surface, l'étude de l'Intelligence semble s'ajouter au domaine de l'éducation; mais, en profondeur, elle s'enracine dans l'éternité de la connaissance. Nous savons, par l'expérience et par l'observation, que la vie est vaste, illimitée et éternelle; en conséquence, la connaissance elle aussi est vaste, illimitée et éternelle."
  - "Etant éternel, le domaine de la connaissance s'enracine dans l'enseignement de la connaissance. Et celui qui enseigne la connaissance de la pleine valeur de la vie, en toute génération, s'enracine lui-même dans cette connaissance éternelle. De génération en génération, la même valeur illimitée de connaissance est reçue puis donnée par celui qui enseigne. De ce fait apparaît inévitablement la structure d'une tradition - une tradition d'enseignants qui mettent en lumière la tradition de la connaissance. L'enseignement de l'intelligence sous la forme de la SIC, s'enracine dans la longue lignée"
  - "Par la grâce de Guru Dev, nous avons acquis cette connaissance dans cette génération, nous devons veiller à ce qu'elle ne se brise pas sur les rocs de l'ignorance dans les générations à venir. Nous devons donc stabiliser Iles fondations de cette connaissance autant que cela est possible dans le domaine relatif. L'intelhigentsia de chaque génération fournira les gardiens de cette connaissance: c'est pourquoi on lui a donné une base académique en établissant une université internationale."
  - "En impliquant le nom « Maharishi: » dans celui de l'université, nous en avons fait un moyen de maintenir la tradition de la connaissance pour toutes les générations à venir, également un moyen permettant d'inspirer les gardiens de cette connaissance dans les générations à venir, grâce à sa valeur et son but traditionnel. Le nom « Maharishi » veut dire « grand voyant » et le but de l'Université Internationale Maharishi est de créer des grands voyants dans toutes les parties du monde en chaque génération - voyants qui, non seulement voient la réalité, mais encore sont capables de transmettre la valeur du fait d'être, capables de créer un voyant en chacun sur terre. Un voyant est celui qui voit, connait, et enseigne la réalité par son propre\n\nexemple. Il veille à ce que les principes de vie, dont il a éprouvé la vérité et la valeur à partir de sa propre expérience, s'appliquent à la vie de chacun pour leur plus grand;\n\nde MIU et soutient ce but - conserver la connaissance de l'intelligence et maintenir les standards (la forme) de cette connaissance sous la forme d'une science. [Fragment incomplet dans la source numérisée.]"
  - "Le but de MIU et l'aspiration de ses enseignants, Maharishi partout. Toi et Moi (You and Me) doivent devenir « M ». Cet idéal vient des Upanishads, où s'exprime ce très beau flot de vie, d'amour et de connaissance passant de l'enseignant à l'étudiant : « Grandissons ensemble dans la connaissance, grandissons ensemble dans la vie, vivons ensemble dans la plénitude ». Toi et moi, devenons « M », Maharishi : M-I-U. D'abord Maharishi, le but et statut de « Je », l'enseignant, et maintenant le but et statut de « Tu », l'étudiant. Élevons-nous ensemble dans la connaissance, la force de vivre et la plénitude de la vie, que rien ne vienne entre Toi et Je nous empêcher de devenir « M » : voici l'appel de MIU de génération en génération. Cet idéal de MIU, inspiré par la profondeur, la dignité, la plénitude et la gloire de la SIC, constitue la plénitude de cet âge scientifique. La connaissance de la valeur complète de la vie est apparue sous la forme d'une science, et maintenant une institution permet de conserver cette science dans toute sa pureté, de génération en génération."
  - "La vie est infiniment délicate. C'est ce caractère infiniment délicat de la vie qui maintient ensemble les limites et l'illimité. Cette délicatesse grandit avec la croissance de l'IC. Le sentiment, première expression de la vie, partant de sa valeur non manifestée, est extrêmement délicat. Par expérience, nous savons combien nos sentiments sont délicats et sensibles. La structure de la vie est si délicate que le domaine tout entier de la connaissance de la vie est également délicat, Sont également très délicates: la connaissance analytique du monde phénoménal qui conclut à l'existence d'un champ pur d'IC responsable de la croissance de toute chose. Enfin est délicate la pratique qui, spontanément et sans effort, amène l'esprit à ce domaine. Etant si délicates, cette connaissance et cette pratique de la SIC peuvent produire le progrès et la plénitude dans la vie."
  - "Cette connaissance de la vie doit être préservée dans sa délicatesse extrême, si l'on veut en conserver toute l'efficacité. Tant que la pureté de la connaissance sera maintenue, son caractère délicat sera également maintenu; sur cette base, seront maintenues efficacité et la validité de la SIC. Ses bienfaits seront alors assurés pour toute les génération à venir. Il faut donc toujours transmettre la connaissance au nom des Maîtres de la Tradition.\n\nNous disons que c'est notre “sainte tradition” parce qu'elle a une valeur infinie pour la vie de chacun. Elle est innocente, gracieuse,\n\ninfinie dignité.\n\nindispensables et valides pour conserver la tradition de cette connaissance et la donner au nom de notre sainte tradition de génération en génération. [Fragment incomplet dans la source numérisée.]"
  - "Dans la longue histoire de l'éducation, MIU est la première université qui souhaite la bienvenue et donne la plénitude à tous les autres systèmes d'éducation dans le monde entier. Elle honore toutes les institutions et systèmes de connaissance, et les invite à satisfaire leur aspiration en développant la pleine valeur d'une vie intégrée dans l'environnement. En chaque génération, les temples de la connaissance - écoles, collèges et universités - furent bâtis dans le but de produire une humanité meilleure. Cette aspiration peut être maintenant comblée, en donnant la connaissance de la SIC à tout étudiant. MIU offre son appréciation, sa louange à toutes les organisations éducatives, puisque toutes se fondent sur cette même ambition: développer le plein potentiel de tout individu de manière à ce qu'il puisse vivre une vie qui soit à tout moment source de progrès suprême avec eux. Et nous les remercions d'apprendre avec nous. C'est en effet grâce à leur générosité dans le partage de cette connaissance que le but de MIU atteindra sa plénitude."
  - "Le but de MIU consiste à réaliser les sept objectifs de la SIC pour tout individu, toute société et toute nation, ceci de génération en génération. L'effort de MIU continuera aussi longtemps que l'on aura besoin de professeurs de SIC dans quelque société ou partie du monde, et on en aura besoin pour chaque génération dans le monde entier. C'est l'âge de MIU. Dans chaque génération, cette organisation réalisera ses objectifs en faveur de tout individu, de toute société et de toute nation, en conservant la pureté de l'enseignement de la SIC. MIU sera ainsi toujours dans la plénitude."
  - "La capacité qu'a la SIC d'amener toute vie à la plénitude a donné naissance au Plan Mondial. MIU constitue l'organisation par laquelle le Plan Mondial est établi dans toutes les parties du monde. Dans la longue histoire de la race humaine, c'est la première fois que l'on planifie avec succès et que l'on réalise la plénitude et le progrès de tout individu vivant sur terre. Les racines de MIU s'enfoncent dans la connaissance éternelle de l'IC. En donnant cette connaissance dans toute sa pureté, MIU comble l'aspiration de la SIC: qu'aucun homme ne continue à souffrir, mais s'épanouisse et irradie la pleine valeur de la vie."
  - "La connaissance vient combler le besoin de l'humanité. Avec elle apparaît aussi la force d'hommes de connaissance, lesquels s'organisent au sein de MIU afin de donner la plénitude à l'aspiration de cet âge scientifique: que tout homme progresse systématiquement vers la plénitude. La plénitude ne doit pas demeurer au stade de l'espoir, mais devenir réalité vivante dans toute pensée et action de chacun, grâce à la connaissance de la SIC.\n\nEn conservant la pureté et l'efficacité de l'enseignement de la SIC, MIU réalisera ce but en faveur du monde entier et dans chaque génération."

questions:
  - question: "Où l'étude de l'intelligence s'enracine-t-elle”?"
    answer: "lle s'enracine dans l'éternité de la connaissance."
  - question: "De quelle manière les professeurs de SIC sont-ils enracinés dans la connaissance?"
    answer: "De la même manière que le parfum est enraciné dans la fleur."
  - question: "Maintenant que nous avons acquis cette connaissance, quelle est notre obligation vis-à-vis des générations à venir?"
    answer: "Ayant acquis cette connaissance dans cette génération, Il nous faut veiller à ce qu'elle ne se brise pas sur les rocs de l'ignorance durant les générations à venir."
  - question: "Qui doivent être les gardiens de cette connaissance?"
    answer: "L'intelligentsia de chaque génération, voilà les gardiens de cette CONNAISSANCE."
  - question: "Quelle est la signification de « Maharishi » et quel sera le but de l'université portant ce nom?"
    answer: "« Maharishi » veut dire « grand voyant ». MIU a été instituée pour créer des voyants en chaque génération. Le voyant est celui qui voit par son propre exemple."
  - question: "Sous quelle forme la connaissance doit être conservée, si l'on veut en donner les bienfaits à toutes les générations à venir?"
    answer: "Maintenir la pureté de la connaissance, voilà la base à partir de laquelle on peut offrir. [Fragment incomplet dans la source numérisée.]"
  - question: "Quelle est l'attitude de MIU à l'égard des autres systèmes de connaissance?"
    answer: "En tant que gardienne de la connaissance de l'intelligence, MIU honore tous les systèmes de connaissance. Elle se sent à l'aise avec le fait que les aspirations de toutes les institutions éducatives sont similaires. Nous voulons partager la connaissance suprême avec elles."
  - question: "Est-ce l'espoir de la plénitude que MIU donne au monde”?"
    answer: "La direction du progrès doit être celle de la plénitude ultime. Cette plénitude ne doit pas rester l'un des efforts de la conscience humaine. Mais elle doit descendre en chaque phase de la pensée et de l'action de tout homme. La connaissance de la SIC, via MIU, réalisera ce but pour tout homme dans le monde."

place_de_la_lecon:
  - "Dans cette leçon, nous voyons que Maharishi a créé un plan parfait pour l'évolution harmonieuse du monde, ceci en structurant l'étude de l'intelligence au plan d'une institution stable, de manière à fournir cette connaissance à toutes les époques futures. Tout au long du cours, la profondeur de la connaissance de la SIC nous a été révélée et par notre propre expérience et par l'analyse intellectuelle. Maharishi présente maintenant la profondeur de cette connaissance dans la sublime dignité d'une tradition éternelle, laquelle a transmis la torche rayonnante de la sagesse de génération en génération. Comme réponse au grand besoin de notre temps, l'enseignement de la SIC vient transformer les aspirations les plus élevées de l'humanité en réalité. Grâce à cette connaissance de la valeur infinie de la vie, tout individu vivra la plénitude."
  - "MIU fournit une base stable à la connaissance, base qui en maintiendra la forme tout au long des vagues changeantes du temps, et veillera à ce que cet enseignement d'une si grande valeur ne se brise pas sur les rocs de l'ignorance dans quelque génération future. La connaissance suprême de la SIC reçoit ainsi une demeure resplendissante dans les murs de MIU. La leçon 31 se présente comme projecteur et « mainteneur » de cette connaissance délicate, assurant sa sécurité et sa longévité dans le cadre académique de MIU."
