schema_version: 1

lesson:
  number: 23
  course: "Science de l'Intelligence Créatrice"
  title: "Les Sept États de Conscience"
  language: fr

points_principaux:
  - "Qualités spécifiques: quatrième état: illimité, intelligence pure, repos vigilant, conscience transcendantale. Cinquième état: activité ou repos avec le quatrième état. Sixième état: cinquième état glorifié, une conscience qui perçoit le relatif suprême avec la conscience du soi absolu. Septième état: conscience unifiée qui perçoit toute chose en termes du soi absolu."
  - "Comment la conscience se développe du quatrième au septième état: le cinquième: en alternant l'expérience du quatrième état avec l'activité (MT et activité). Le sixième: en accomplissant des activités d'une qualité plus fine, partant d'une impulsion du coeur. Le septième: la valeur relative suprême de la perception, dans le sixième état, s'élève spontanément à la valeur infinie."
  - "Tout homme peut, grâce à la SIC, s'élever jusqu'au septième état de conscience et jouir ainsi de la valeur infinie de la vie."

resume_long:
  - "Maintenant que nous avons établi le quatrième état de conscience, il sera\n\nintéressant de voir s'il est possible de vivre d'autres états de conscience. L'analyse intellectuelle, la recherche scientifique et l'expérience directe nous montrent que le quatrième état enrichit les états de veille, rêve et sommeil. Il semblerait que le quatrième état puisse être développé de manière à coexister avec les trois autres. Cela pourrait se produire en raffinant le système nerveux de telle manière qu'il devienne capable de maintenir l'état de repos plus profond que le sommeil en même temps que le quatrième état déjà établi. Le système nerveux pourrait ainsi s'habituer à maintenir cet état de repos profond et l'esprit garder une vigilance totale, de sorte que le quatrième état puisse persister pendant la veille, le rêve et le sommeil."
  - "Nous savons par expérience que la conscience pure est la nature du\n\nquatrième état. Nous avons vu qu'elle est non-manifestée, c'est-à-dire qu'elle n'a pas de limite; c'est une conscience non-limitée. La conscience objective du monde des limites caractérise l'état de veille; ainsi lorsque le quatrième état l'accompagne, la conscience des limites et l'illimité coexistent. La conscience de l'illimité et la conscience des limites, le premier plan de la conscience illimitée soutenant la perception des objets, la conscience pure faisant l'expérience de la rose: telle est la nature de la coexistence du quatrième état et de l'état de veille de la conscience. Avant que nous ne commencions à méditer, la conscience pure était voilée sous l'influence de l'état de veille; mais lorsqu'elle se maintient dans l'esprit alors que celui-ci fait l'expérience des limites du monde objectif, un cinquième état de conscience apparaît naturellement et spontanément, et il est complètement différent des quatre autres. On développe ce cinquième état par l'alternance du quatrième avec l'état de veille. Le cinquième état de conscience consiste en la coexistence du quatrième état avec la veille, le rêve ou le sommeil,"
  - "La physique a montré que la réalité matérielle se présente en couches. Chaque couche (molécules, atomes, particules, etc.) se trouve à l'intérieur d'une autre et possède sa propre nature spécifique, ses propres lois. Chaque couche possède son propre niveau d'intelligence et de conscience.\n\nUn objectif grand angle permet de voir non seulement les limites de l'objet, mais encore l'arrière-plan qui le révèle. Ainsi en est-il de la perception dans le cinquième état de conscience, en vertu du caractère illimité de la conscience de celui qui perçoit. Cela se produit tout aussi bien vers\n\nl'intérieur que vers l'extérieur, aux deux niveaux vertical et horizontal de la connaissance."
  - "Une conscience non restreinte et illimitée, telle qu'elle apparaît dans le cinquième état de conscience, peut atteindre des valeurs de perception beaucoup plus profondes et plus fines. et ceci jusqu'à ce que la valeur relative la plus fine de l'objet soit incluse dans la perception. Ces niveaux plus fins sont caches à la vue qui ne voit que la valeur de surface des objets. Une telle vision ne saisit que la surface des choses et ne dévoile des qualités de l'objet que celles qui le distinguent de tout son environnement; par conséquent, ces limites de l'objet restent rigides. bien définies et spécifiques. Une fois que l'on a stabilisé le cinquième état, la conscience illimitée étant établie au niveau de l'esprit conscient, la perception commence graduellement à s'approfondir jusqu'à ce qu'elle pénètre la valeur relative la plus fine des objets. Ce sera une valeur distincte de perception où l'aspect relatif le plus fin sera perçu spontanément à la surface même du relatif grossier. La sève dépourvue de couleur qui demeure cachée sous la surface des couleurs de la fleur est maintenant connue comme ce qui structure tout élément de couleur que manifeste la fleur. La sève incolore est perçue réalisée - à la surface de la fleur, mais, comme elle est transparente, elle demeure là sans cacher la couleur et lui permet de garder le premier plan, sans pour autant que ladite couleur fasse ombrage à la sève incolore."
  - "Dans le cinquième état de conscience, où le quatrième coexiste avec la veille, on perçoit la valeur de surface des objets. Lorsque la perception devient si raffinée qu'elle saisit le relatif le plus fin à la surface du relatif grossier, alors nous sommes en présence d'un nouvel état de conscience distinct du cinquième. C'est pourquoi nous l'appelons le sixième. H se développe grâce à l'alternance de l'expérience du quatrième avec une activité plus raffinée guidée par l'impulsion du coeur: l'activité est davantage dirigée par le sentiment. Son caractère spécifique consiste en une perception tellement raffinée qu'elle est capable de saisir la valeur relative La plus fine à la surface de tout objet de perception."
  - "Dans les cinquième et sixième états de conscience, la conscience illimitée est établie de façon permanente pendant la veille, le rêve et le sommeil. Dans le sixième état, nous pouvons en plus percevoir l'aspect le plus fin de l'existence relative; il semble ainsi qu'aucune évolution ne soit encore possible en terme de perception. Cependant, dans notre examen du quatrième état de conscience, nous avons découvert que c'est une réalité transcendantale et absolue. Cela veut dire qu'il est non relatif, et qu'on peut en faire l'expérience. Nous pouvons donc nous demander s'il serait possible\n\nde faire l'expérience de la réalité transcendantale située au-delà du relatif le plus fin, au plan de la cognition, tout en restant établi dans le quatrième état au plan de la conscience.\n\nLa perception ne peut atteindre cet état, car elle implique qu'il y ait un objet de perception aussi bien qu'un sujet qui perçoive, et comme la valeur absolue de la vie est non manifestée, elle est donc non perceptible. Cependant, lorsque la conscience illimitée, non manifestée, est devenue la nature même de l'esprit conscient (cinquième état), et lorsque cet esprit conscient saisit lui-même le relatif le plus fin (sixième état), alors la valeur non manifestée qui imprègne le relatif le plus fin sera animée. Cette animation de la valeur transcendantale de l'objectivité n'est pas autre chose que l'animation de l'esprit conscient dans sa valeur illimitée. Cette similitude, ou identité, anime les objets de perception de telle sorte que leur valeur non-manifestée, jusque là diffuse et fermée à la conscience, commence à respirer la vie.\n\nL'état de la cognition prend soudain un caractère différent de celui qui saisit le relatif le plus fin. Ce nouvel état de cognition s'anime dans l'absolu infini, éternel. Tout ceci n'est possible que lorsque l'esprit conscient vibre avec cette valeur infinie jusqu'au point où la perception s'élève à sa valeur infinie, qu'elle s'anime transcendantalement, l'esprit saisissant l'aspect relatif le plus fin de l'existence. Ceci mérite de s'appeler le septième état de conscience. Au-delà, il ne semble pas y avoir d'autres possibilité de développement. Nous pouvons parler de l'état unifié de la conscience."
  - "Dans ce septième état, la valeur ultime, non-manifestée, infinie de l'objectivité s'anime et devient connue en termes de la pure valeur subjective de la conscience illimitée, non-manifestée. Elle est en effet ultime parce que les expériences, l'objectivité, la perception et l'action ont toutes été élevées au même niveau d'illimité, La connaissance a établi un pont entre le sujet connaissant et l'objet connu. L'objet est saisi dans sa réalité totale lorsque son caractère infini, caché jusqu'alors, est apprécié en surface.\n\nLorsque La perception s'ouvre à la valeur infinie de l'objet, elle devient totale; celui qui perçoit devient capable de saisir l'objet dans sa complétion, et l'on acquiert ainsi la pleine valeur de la connaissance. La connaissance est pleine, la réalité infinie structure chaque petit élément du fini, et la perception pénètre jusqu'à la profondeur illimitée de la vérité, évaluant chaque objet en termes d'infini Cet état de conscience, le plus élevé, devient réalité vivante grâce au processus qui ouvre l'esprit conscient au quatrième état, puis, le combinant à l'activité, l'élève au cinquième, au sixième, jusqu'à atteindre cet accomplissement ultime du septième état. Vivre cet état suprême de vie, telle est la perspective ouverte par la connaissance et la pratique de la SIC."

questions:
  - question: "Qu'est-ce qui caractérise le cinquième état de conscience?"
    answer: "La conscience pure que l'on expérimenté en même temps que l'objet d'expérience."
  - question: "Que peut-on dire de la perception dans le cinquième état de conscience ”?"
    answer: "Dans le cinquième état de conscience, où la le quatrième coexiste avec l'état de veille de la conscience, la perception atteint la surface de l'objet."
  - question: "Quel exemple, tire de la physique, nous conduit à envisager l'existence d'un sixième état de conscience?"
    answer: "La physique nous enseigne qu'il y a diverses couches d'existence: molécules, atomes, électrons, particules élémentaires, particules à haute énergie, etc. Ces couches d'existence, imbriquées les unes à l'intérieur des autres, ont chacune leur propre nature et leur propre niveau d'intelligence."
  - question: "Que peut-on dire de la perception dans le sixième état de conscience?"
    answer: "Lorsque la perception est raffinée au point de permettre l'expérience du plus fin relatif à la surface du relatif grossier, nous sommes en présence d'un autre état de conscience, distinct du cinquième par ses caractéristiques propres: la capacité de percevoir le relatif le plus fin jointe à la conscience illimitée. Le plus fin relatif est alors perçu en tant que valeur la plus raffinée de la perception. Lorsque la conscience illimitée devient en trait permanent de notre esprit conscient, et que la perception est des plus raffinées, capable de saisir partout la valeur relative la plus fine, nous avons là un état nouveau, qui porte un nom différent: sixième état de Conscience."
  - question: "Qu'est-ce qui rend possible d'avoir un septième état de conscience?"
    answer: "Cela n'est possible que lorsque l'esprit conscient vibre dans la valeur infinie et se trouve avoir été raffiné au point de saisir Spontanément la valeur relative la plus fine; et de là, il s'élève directement à la valeur infinie de la perception au niveau de l'esprit conscient. Telle est la caractéristique qui mérite bien le nom de septième état de conscience."
  - question: "Pourquoi donnons-nous différents noms à ces états de conscience?"
    answer: "Nous donnons un nom - Septième, Sixième, cinquième, quatrième... simplement du fait que les caractéristiques de chacun d'eux sont différentes de celles des autres."
  - question: "Comment l'état le plus élevé de la conscience devient-il réalité vivante?"
    answer: "Grace au processus qui ouvre l'esprit conscient à l'existence valide du quatrième état de conscience combiné à l'activité."

place_de_la_lecon:
  - "A ce point du cours, nous avons établi la nature, l'étendue et les moyens de développement de l'IC. La leçon 23 met en lumière toutes les valeurs possibles de la conscience et révèle aussi l'aspect pratique de l'épanouissement de la valeur suprême de l'IC au niveau de notre propre conscience."
  - "Cette leçon nous fait connaître les mécanismes par lesquels la demeure de toute connaissance se structure au sein de notre conscience; elle nous montre donc comment tout individu peut s'élever à un niveau d'existence où tout aspect de la vie recevra un soutien spontané, direct et complet de la part de la valeur infinie de l'IC. On peut évidemment dire que cette leçon incarne la vie du cours tout entier, puisqu'elle étudie systématiquement, et contribue scientifiquement au développement de la conscience, à partir des limites des états relatifs jusqu'à l'illimité de la conscience suprême, ceci grâce à la connaissance et la pratique de la Science de l'Intelligence Créatrice."
