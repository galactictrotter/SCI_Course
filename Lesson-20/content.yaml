schema_version: 1

lesson:
  number: 20
  course: "Science de l'Intelligence Créatrice"
  title: "La SIC, l'Évolution et l'Environnement"
  language: fr

points_principaux:
  - "Tous les aspects de la vie sont interdépendants."
  - "L'évolution de l'individu et celle de l'environnement sont naturellement interdépendantes."
  - "L'évolution de l'individu s'accomplit grâce au contact avec le champ fondamental de l'évolution: le champ pur de l'IC."
  - "L'évolution de l'environnement s'accomplit spontanément grâce à la croissance de l'IC chez l'individu."
  - "La SIC offre une formule pratique permettant d'établir et l'individu et son environnement dans la plénitude."

resume_long:
  - "Si nous voulons nous améliorer, marcher vers le progrès, la santé et le bonheur, et utiliser notre plein potentiel, nous devons inclure tous les domaines dans notre progrès. La maison, le jardin, le voisinage, le pays, le monde et l'univers, tout doit manifester la gloire suprême de la vie. L'évolution inclut tout, de l'individu à la totalité de la vie cosmique. Rien ne peut être pris isolément."
  - "Tout ce qui existe dans l'univers est influencé par tout le reste. L'univers réagit à l'action individuelle (cf. La Science de l'Être et l'Art de Vivre). Chaque souffle, chaque petite activité individuelle, atteint les galaxies les plus lointaines. Voilà ce que nous révèlent les connaissances modernes en astronomie et en physique subatomique. Quand nous considérons l'évolution de l'individu, nous devons envisager simultanément celle de son environnement."
  - "Les bienfaits dispensés à chaque partie de l'univers le sont de manière ordonnée. La pluie tombe aussi bien sur l'herbe que sur les roses, et l'une glorifie l'autre. Le progrès résulte du soutien coordonné de tous ses éléments, ce qui fait partie intégrante du processus naturel de l'évolution. Autrement, l'évolution serait laissée au hasard. Tout évolue avec tout: voilà ce que l'IC accomplit spontanément et automatiquement. Il y a simultanéité dans l'évolution de toutes choses ensemble."
  - "Les qualités auto-régénératrice et “auto-perpétuante\" de l'IC répondent au besoin vital suivant lequel la croissance de l'individu et celle de son environnement doivent se réaliser simultanément. Lorsque notre conscience atteint le champ pur de l'IC (durant la MT), nous faisons l'expérience de cette purification que nous avions appelée la glorification du chemin, ce qui veut dire que l'IC élimine spontanément les obstacles à son propre progrès. Comme on le voit aussi dans le cas du chasse-neige, cette élimination des barrières qui restreignent le développement de l'IC favorise davantage son propre développement et encourage également l'évolution de l'environnement tout entier. Étant donné que la caractéristique illimitée de l'IC s'intègre aux limites de notre conscience grâce à la MT, nous évoluons parallèlement à l'environnement - dans sa progression naturelle, l'évolution cosmique est en accord avec l'évolution individuelle."
  - "Lorsque nous cessons d'être tendu et soucieux, grâce à la pratique régulière de la MT, l'atmosphère autour de nous s'améliore elle aussi et tout l'environnement commence à s'épanouir du fait que nous irradions plus de\n\nvie autour de nous. On a montré que l'attitude positive du jardinier à l'égard de la croissance de la plante est bénéfique à celle-ci. On dit aussi que l'atmosphère reflète les qualités de la personne. La qualité de la lumière émise dépend de la propreté et de la puissance de l'ampoule. Ce sont les valeurs intérieures qui s'irradient vers l'extérieur."
  - "Une vie pleinement développée, heureuse, en bonne santé, irradie ces qualités dans son environnement. Il est naturel que celui qui vit une telle vie entreprenne d'améliorer ce qui l'entoure. Il faut en outre que les individus aient une large vision de ce qu'ils entreprennent, de telle sorte que tous les éléments extérieurs à leurs préoccupations immédiates soient aussi pris en considération, puisque l'amélioration de l'environnement dépend de celle de l'individu. Un bon directeur se préoccupe de ce qui se passe à l'extérieur des portails aussi bien que dans l'usine même."
  - "Ceux qui commencent à pratiquer la MT ne sont donc pas satisfaits de voir autour d'eux des gens soucieux, malades et misérables. La paix qu'ils ont trouvée doit s'étendre à ceux qui sont autour d'eux et dans leur environnement; c'est pourquoi ils deviennent eux-mêmes professeurs de SIC et apprennent à donner la technique de MT à leurs amis."
  - "Il est important que toutes nos aspirations et chaque étape de notre progrès\n\ncontribuent aussi au progrès de tout ce qui nous entoure. Nous ne pouvons connaître la paix seulement en nous-même: il nous faut créer un environnement paisible pour que la paix se stabilise en nous-même. L'environnement doit donc avoir sa place dans notre propre évolution individuelle. Pour qu'il en soit ainsi, tout individu doit donc avoir conscience qu'il existe une technique spontanée, laquelle nous permet de mettre notre propre progrès directement en accord avec le rythme rapide de l'évolution, ce qui aura pour conséquence d'élargir cette influence évolutive à notre environnement tout entier. C'est en effet la seule façon d'incorporer spontanément les étapes d'évolution au sein de l'environnement: par le truchement de l'évolution individuelle. Cette technique naturelle suffit à développer la valeur illimitée, cosmique, de l'IC dans le souffle individuel. Lorsque l'IC cosmique, illimitée, se développe dans la vie de l'individu, toutes ses actions contribuent spontanément au développement de tout ce qui le concerne. L'évolution individuelle sera ainsi protégée, soutenue, enrichie et encouragée spontanément par l'évolution de tout ce qui existe dans le cosmos."
  - "Lorsque l'individu se trouve établi dans ce champ fondamental et illimité d'intelligence pure, lequel soutient l'évolution maximale, alors l'évolution qui développe simultanément ce qui se passe partout devient possession\n\nconsciente de la vie individuelle. C'est l'unique moyen de permettre à la vie individuelle d'évoluer consciemment en produisant des bienfaits maximums au plan de l'influence écologique et évolutive, partout dans la création."
  - "Il y a des problèmes du fait que la conscience individuelle ne couvre pas un horizon assez large; l'individu n'a pas la capacité d'être utile aux autres lorsqu'il s'occupe de lui-même. Toute personne pratiquant régulièrement la MT et possédant cette connaissance de la SIC incorpore en elle-même la valeur fondamentale et la force de l'évolution de son environnement. Etroitesse de vue et négligence de l'entourage sont ainsi éliminées d'office. On développera plutôt une large vision, qui dépasse les problèmes individuels avant même qu'ils ne naissent. Ce n'est pas en pensant à les aider que nous aidons les autres. Toute aide ne peut être donnée qu'à partir d'un niveau d'utilisation spontanée de l'IC cosmique, ce qui crée un bien maximum et pour soi et pour l'environnement."
  - "Ainsi le développement maximum de l'IC, acquis grâce régulière de la MT, est la seule réponse, d'ailleurs absolument suffisante, à tout les problèmes de pensée, de parole et d'action, et à tous les problèmes de société, d'écologie et d'environnement. C'est une formule fondamentale, universellement applicable, qui permet l'évolution simultanée et de l'individu et de son environnement."

questions:
  - question: "Quelle relation y a-t-il entre l'univers et l'individu?"
    answer: "L'univers réagit à l'action individuelle. Les deux sont interdépendants."
  - question: "Comment l'IC comble-t-elle le besoin essentiel de l'évolution?"
    answer: "En englobant l'ensemble de la croissance de l'environnement et de l'individu."
  - question: "Comment fonctionne le principe de la glorification du chemin?"
    answer: "Le développement de l'IC élimine spontanément les obstacles au progrès et a l'évolution qui lui barrent la route."
  - question: "Dans quel domaine l'environnement acquiert-il sa valeur?"
    answer: "Dans le domaine de la conscience individuelle. Une conscience élargie octroie une valeur plus grande à l'environnement; une conscience illimitée trouve à l'environnement une valeur infinie."
  - question: "De quoi dépend la croissance de l'environnement?"
    answer: "La croissance de l'environnement dépend de la croissance, du progrès et de l'évolution de l'individu."
  - question: "Qu'implique la connexion entre la paix intérieure et la paix extérieure?"
    answer: "Si nous voulons stabiliser la paix en nous-même, nous devons d'abord créer un environnement paisible (analogie du ballon de football)."
  - question: "Comment peut donc s'accomplir l'ensemble de la croissance évolutive?"
    answer: "Grâce à la croissance de l'évolution individuelle par le truchement du développement de l'IC dans la vie individuelle."
  - question: "Quelle est la formule permettant le développement de l'environnement?"
    answer: "La croissance maximum de l'individu, à la cadence la plus rapide, dépend du fait qu'il incorpore la valeur fondamentale de l'évolution au sein même de sa conscience. L'évolution de l'environnement est ainsi prise en charge, tout aussi bien que celle de la vie individuelle."
  - question: "A partir de quel niveau l'individu peut-il accomplir un bien maximum, et pour lui-même, et pour son environnement?"
    answer: "En utilisant spontanément l'IC cosmique; voila comment l'individu peut se faire un bien maximum, tout en donnant en même temps le meilleur à son environnement."
  - question: "Quelle est la solution fondamentale à tous les problèmes de la vie?"
    answer: "C'est la croissance de l'IC dans la vie de l'individu, produite grâce à la pratique régulière de la MT. Cette croissance développe une vision plus large, elle agrandit les horizons de la conscience, et ceci permet à l'individu de résoudre n'importe quel problème."

place_de_la_lecon:
  - "Jusqu'à ce point du cours, nous avons considéré les valeurs physiques et mentales de l'IC au niveau de l'individu. Le temps est maintenant venu d'étendre notre conscience pour saisir l'horizon sans limite de notre environnement et de l'univers tout entier."
  - "Nous savons que tout ce qui existe dans l'univers influence toute autre chose. L'univers réagit à l'action individuelle. Dans cette leçon, nous avons considéré l'interdépendance entre individu et environnement, et nous avons aussi vu comment l'évolution de l'environnement peut être portée à son maximum par le truchement du plein développement de l'IC chez l'individu. Dans l'évolution de l'individu, c'est la Valeur cosmique, illimitée de la conscience qui s'accroît. Cette croissance de la conscience illimitée au sein même de la vie individuelle organise spontanément l'évolution de l'atmosphère, le progrès naturelle et la plus efficace qui soit."
  - "Puisque les développements de l'individu et de son environnement sont à ce point interdépendants, il est donc très important que nous devenions professeurs de SIC et que nous diffusions ainsi la pleine valeur de l'IC. Alors on verra que la SIC constitue la solution à tous les problèmes, apportant la plénitude à tout individu ainsi qu'à son environnement. Telle est la connaissance suprême - donner la plénitude de la vie, de génération en génération. Cette formule pratique, universelle, pour donner la plénitude à l'individu comme à son environnement, a spontanément inspiré le Plan Mondial, auquel nous participons tous; il permet en effet le développement de la valeur maximum de l'IC pour tout individu, et il donne succès, bonheur et plénitude à tout foyer. Ainsi chacun de nous peut-il irradier la vie dans l'environnement tout entier, et glorifier la création entière."
  - "Cette leçon focalise la lumière de la SIC, que nous avons acquise jusqu'ici, sur l'environnement. Nous voyons la relation intime entre individu et environnement, nous voyons également la valeur de la connaissance, à tous les niveaux de la vie, c'est-à-dire du niveau individuel au niveau cosmique. Nous sommes maintenant prêts à considérer l'application spécifique de la SIC à de nombreux domaines de connaissance, sans pour autant perdre de vue la pleine valeur de la SIC (au sens large) à tous les niveaux de la vie."
  - "Cette leçon 20, c'est donc le télescope du cours: elle nous permet en effet d'examiner intimement la fonction de l'IC et la SIC dans la perspective la plus large de la vie, à savoir ces étendues qui, communément, dépassent de loin la vision de l'homme."
